openapi: 3.0.3
info:
  title: Vendor Connectivity API (proposed)
  version: 0.1.0-proposed
  description: |
    **Proposed contract, derived from `model/model.yaml` → `contexts[vendor-connectivity]`.
    Nothing here is built yet.**

    This is the **Vendor API**: the Open Host Service of the `vendor-connectivity`
    bounded context. Its JSON schemas are the **Published Language** that every
    vendor conforms to. The warehouse-systems fleet (vendor `V-WS`) reaches the
    retail network only through this contract, from its `network-fulfillment`
    context (Conformist + Anti-Corruption Layer). It is the only channel between
    the two organizations.

    Protocol rules (from the model's `business_decisions`):

    - Poll purchase orders with `GET /vendor/purchase-orders`, paging with `nextToken`.
      A purchase order may be delivered more than once (simulation knob
      `PO_REDELIVERY_RATE`); be idempotent on `poNumber`.
    - Acknowledge once, in full, before `ackBy`. Fill-or-kill: one decision covers
      every line. `ackBy = min(issuedAt + vendor ackWindow, requiredShipBy - node handlingTime)`.
    - Every asynchronous vendor write returns `202` with a `transactionId`. The write
      takes effect only when `GET /vendor/transactions/{transactionId}` reports
      `SUCCESS`. Processing waits at least `TX_PROCESSING_DELAY`; a share of
      transactions fails on purpose (`TX_FAILURE_RATE`).
    - A label is issued only for an `ACCEPTED` purchase order. A shipment is
      confirmed only with a label for every package. The label request is the one
      synchronous write (see its operation and the model gap noted there).
    - Rate limits are part of the contract: `429` with `Retry-After` (`RATE_LIMIT_RPS`).
    - No ship-to PII anywhere. A label is `labelRef + trackingNumber + carrier`, never
      an address.
    - No authentication (consistent with the fleet). The vendor names itself with
      `vendorId` in every write body.
  contact:
    name: retail-network-docs
    url: https://github.com/IQVO/retail-network-docs
servers:
  - url: http://localhost:8000/api/retail-network/vendor-connectivity
tags:
  - name: Purchase Orders
    description: Poll and read purchase orders issued to the vendor's nodes.
  - name: Acknowledgements
    description: The single, whole-order accept or reject (asynchronous).
  - name: Inventory
    description: Inventory feeds per node (asynchronous, relayed to offer-availability).
  - name: Nodes
    description: Register vendor nodes, declare their operational profile, read them and their scorecard.
  - name: Shipping Labels
    description: Labels for the packages of an ACCEPTED purchase order.
  - name: Shipment Confirmations
    description: Confirm that a purchase order shipped (asynchronous).
  - name: Transactions
    description: Reconcile every asynchronous write by its transactionId.
  - name: Vendors
    description: Vendor onboarding, used by network partner managers (not part of the vendor-facing protocol).
paths:
  /vendor/purchase-orders:
    get:
      tags: [Purchase Orders]
      operationId: pollPurchaseOrders
      summary: Poll purchase orders (PollPurchaseOrders)
      description: |
        Returns purchase orders issued to the vendor's nodes after `createdAfter`,
        oldest first, in pages. Pass the returned `nextToken` to fetch the next
        page; an absent `nextToken` means the last page. A purchase order can be
        returned again (`PO_REDELIVERY_RATE`); the vendor deduplicates on `poNumber`.
      parameters:
        - name: createdAfter
          in: query
          required: false
          description: Only purchase orders with `issuedAt` strictly after this instant.
          schema:
            type: string
            format: date-time
        - name: nodeId
          in: query
          required: false
          description: Only purchase orders for this node.
          schema:
            type: string
        - name: nextToken
          in: query
          required: false
          description: Opaque continuation token from the previous page. When present, the other filters are ignored.
          schema:
            type: string
      responses:
        '200':
          description: One page of purchase orders.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrderPage'
        '422':
          $ref: '#/components/responses/ValidationProblem'
        '429':
          $ref: '#/components/responses/RateLimited'
  /vendor/purchase-orders/{poNumber}:
    get:
      tags: [Purchase Orders]
      operationId: getPurchaseOrder
      summary: Get one purchase order (GetPurchaseOrder)
      parameters:
        - $ref: '#/components/parameters/PoNumber'
      responses:
        '200':
          description: The purchase order, its acknowledgement, labels and shipment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrder'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /vendor/acknowledgements:
    post:
      tags: [Acknowledgements]
      operationId: submitAcknowledgement
      summary: Acknowledge a purchase order in full (SubmitAcknowledgement)
      description: |
        Accepts or rejects the whole purchase order with one decision. The request
        must echo every line with its ordered quantity; anything else is a partial
        acknowledgement and is refused (`ErrPartialAcknowledgement`). A purchase
        order is acknowledged at most once (`ErrAlreadyAcknowledged`, which also
        covers an acknowledgement still processing) and never after `ackBy`
        (`ErrAckWindowClosed`, judged on the receipt instant). On `202` the order
        moves to `ACK_PROCESSING`; it becomes `ACCEPTED` or `REJECTED` when the
        transaction succeeds, and returns to `ISSUED` if it fails.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcknowledgementRequest'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/StateConflict'
        '422':
          $ref: '#/components/responses/ValidationProblem'
        '429':
          $ref: '#/components/responses/RateLimited'
  /vendor/inventory:
    post:
      tags: [Inventory]
      operationId: submitInventory
      summary: Submit an inventory feed for one node (SubmitInventory)
      description: |
        Asynchronous (`SubmissionKind` `INVENTORY`). On processing, the feed is
        relayed to offer-availability (`POST /inventory-feeds`, `ApplyInventoryFeed`).
        A full feed zeroes every listing of the node it omits. Downstream refusals
        (for example `ErrListingNotOnNode`, `ErrFeedAlreadyApplied`) appear as
        `errors` on the transaction.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryFeedRequest'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationProblem'
        '429':
          $ref: '#/components/responses/RateLimited'
  /vendor/nodes:
    post:
      tags: [Nodes]
      operationId: registerVendorNode
      summary: Register a vendor node (RegisterVendorNode)
      description: |
        Asynchronous (`SubmissionKind` `NODE_REGISTRATION`). On processing, the node
        is registered with node-topology (`POST /nodes`, `RegisterNode`). A vendor
        may register only `FULFILLMENT_CENTER`, `INBOUND_CROSS_DOCK` or
        `RETURNS_CENTER` nodes. Downstream refusals (for example
        `ErrOperatorNotAllowedForNodeType`, `ErrVendorNodeCodeTaken`) appear as
        `errors` on the transaction.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeRegistrationRequest'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '422':
          $ref: '#/components/responses/ValidationProblem'
        '429':
          $ref: '#/components/responses/RateLimited'
  /vendor/nodes/{nodeId}:
    get:
      tags: [Nodes]
      operationId: getNode
      summary: Get one of the vendor's nodes (GetNode)
      description: Served from the local VendorNodeView, fed by node-topology events.
      parameters:
        - $ref: '#/components/parameters/NodeId'
      responses:
        '200':
          description: The node as the network knows it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorNode'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /vendor/nodes/{nodeId}/profile:
    put:
      tags: [Nodes]
      operationId: declareNodeProfile
      summary: Declare the node's operational profile (DeclareNodeProfile)
      description: |
        Asynchronous (`SubmissionKind` `NODE_PROFILE`). On processing, the profile is
        relayed to node-topology (`PUT /nodes/{nodeId}/operational-profile`,
        `DeclareOperationalProfile`). A profile is versioned: `profileRevision` must
        strictly increase. Downstream refusals (`ErrStaleProfileRevision`,
        `ErrIncompleteOperationalProfile`, `ErrCutoffOutsideOperatingHours`) appear
        as `errors` on the transaction.
      parameters:
        - $ref: '#/components/parameters/NodeId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeProfileRequest'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationProblem'
        '429':
          $ref: '#/components/responses/RateLimited'
  /vendor/nodes/{nodeId}/scorecard:
    get:
      tags: [Nodes]
      operationId: getScorecard
      summary: Get the node's measured scorecard (GetScorecard)
      description: Relayed synchronously from node-performance (`GET /scorecards/{nodeId}`).
      parameters:
        - $ref: '#/components/parameters/NodeId'
      responses:
        '200':
          description: The node's rolling-window scorecards.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scorecard'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /vendor/shipping-labels:
    post:
      tags: [Shipping Labels]
      operationId: requestLabel
      summary: Request labels for an accepted purchase order (RequestLabel)
      description: |
        Synchronous: labels are issued by shipping-and-tracking (`POST /labels`,
        `IssueLabel`) inside this request and returned in the response. Allowed only
        once the purchase order is `ACCEPTED` (`ErrLabelBeforeAcceptance`). A label
        never carries the ship-to address. Re-requesting a label for the same
        `(poNumber, packageNo)` returns the label already issued.

        Model gap: the model says every vendor write returns `202` with a
        `transactionId`, but `SubmissionKind` has no label kind and `IssueLabel` is a
        synchronous call; this operation follows the latter.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LabelRequest'
      responses:
        '200':
          description: One label per requested package.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabelResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/StateConflict'
        '422':
          $ref: '#/components/responses/ValidationProblem'
        '429':
          $ref: '#/components/responses/RateLimited'
  /vendor/shipment-confirmations:
    post:
      tags: [Shipment Confirmations]
      operationId: submitShipmentConfirmation
      summary: Confirm that a purchase order shipped (SubmitShipmentConfirmation)
      description: |
        Asynchronous (`SubmissionKind` `SHIPMENT_CONFIRMATION`). Allowed only for an
        `ACCEPTED` purchase order with a label for every package
        (`ErrConfirmWithoutLabel`). On `202` the order moves to `SHIPMENT_PROCESSING`;
        it becomes `SHIPPED` when the transaction succeeds and returns to `ACCEPTED`
        if it fails.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShipmentConfirmationRequest'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/StateConflict'
        '422':
          $ref: '#/components/responses/ValidationProblem'
        '429':
          $ref: '#/components/responses/RateLimited'
  /vendor/transactions/{transactionId}:
    get:
      tags: [Transactions]
      operationId: getTransaction
      summary: Get the outcome of an asynchronous write (GetTransaction)
      parameters:
        - name: transactionId
          in: path
          required: true
          description: The id returned by the `202` of the write.
          schema:
            type: string
      responses:
        '200':
          description: The transaction and, once processed, its outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /vendors:
    post:
      tags: [Vendors]
      operationId: onboardVendor
      summary: Onboard a vendor (OnboardVendor)
      description: Used by network partner managers. Publishes `VendorOnboarded`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardVendorRequest'
      responses:
        '201':
          description: The vendor account, ACTIVE.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorAccount'
        '422':
          $ref: '#/components/responses/ValidationProblem'
components:
  parameters:
    PoNumber:
      name: poNumber
      in: path
      required: true
      description: The purchase order number. Idempotent on the release it was issued for.
      schema:
        type: string
    NodeId:
      name: nodeId
      in: path
      required: true
      description: The network's id of the vendor node.
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-chosen key. A retry with the same key returns the first response (for an asynchronous write, the same `transactionId`).
      schema:
        type: string
        maxLength: 128
  headers:
    RetryAfter:
      description: Seconds to wait before the next call.
      schema:
        type: integer
        minimum: 1
  responses:
    Accepted:
      description: Accepted for processing. Reconcile with `GET /vendor/transactions/{transactionId}`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TransactionAccepted'
    NotFound:
      description: |
        The resource does not exist, or it belongs to another vendor
        (`ErrNodeNotOwnedByVendor`, problem type `node-not-owned-by-vendor`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    StateConflict:
      description: |
        The purchase order is in the wrong state for this write. Problem types:
        `already-acknowledged` (`ErrAlreadyAcknowledged`), `ack-window-closed`
        (`ErrAckWindowClosed`), `label-before-acceptance` (`ErrLabelBeforeAcceptance`),
        `confirm-without-label` (`ErrConfirmWithoutLabel`), `purchase-order-state`
        (a write against a state the model gives no `Err...` for; proposed), `stale`
        (optimistic-concurrency conflict; retry).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationProblem:
      description: |
        The request is malformed or breaks a validation rule. Problem types:
        `validation`, `partial-acknowledgement` (`ErrPartialAcknowledgement`),
        `ack-window-out-of-range` (`ErrAckWindowOutOfRange`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: Rate limit exceeded (`RATE_LIMIT_RPS`). Problem type `rate-limited`.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status]
      properties:
        type:
          type: string
          description: Problem type slug, for example `ack-window-closed`.
          example: ack-window-closed
        title:
          type: string
          example: Acknowledgement window closed
        status:
          type: integer
          example: 409
        detail:
          type: string
          example: poNumber PO-7f3c was due by 2026-10-22T14:00:00Z
        instance:
          type: string
    TransactionAccepted:
      type: object
      required: [transactionId]
      properties:
        transactionId:
          type: string
          example: tx-01J9Z6K4M2
    SubmissionKind:
      type: string
      enum: [ACKNOWLEDGEMENT, INVENTORY, NODE_REGISTRATION, NODE_PROFILE, SHIPMENT_CONFIRMATION]
    SubmissionStatus:
      type: string
      enum: [PROCESSING, SUCCESS, FAILURE]
    SubmissionError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Error code. For a downstream refusal, the owning context's `Err...` identifier.
          example: ErrStaleProfileRevision
        message:
          type: string
        path:
          type: string
          description: JSON path of the offending request field, when known.
          example: $.profileRevision
    Transaction:
      type: object
      required: [transactionId, vendorId, kind, status, receivedAt]
      properties:
        transactionId:
          type: string
        vendorId:
          type: string
        kind:
          $ref: '#/components/schemas/SubmissionKind'
        status:
          $ref: '#/components/schemas/SubmissionStatus'
        receivedAt:
          type: string
          format: date-time
        processedAt:
          type: string
          format: date-time
          nullable: true
        errors:
          type: array
          items:
            $ref: '#/components/schemas/SubmissionError'
    PurchaseOrderState:
      type: string
      enum: [ISSUED, ACK_PROCESSING, ACCEPTED, REJECTED, EXPIRED, SHIPMENT_PROCESSING, SHIPPED, CANCELLED]
    RejectReason:
      type: string
      enum: [OUT_OF_STOCK, UNKNOWN_LISTING, CANNOT_MEET_SHIP_BY, DISCONTINUED]
    PoLine:
      type: object
      required: [lineNo, listingId, quantity]
      properties:
        lineNo:
          type: integer
          minimum: 1
        listingId:
          type: string
          description: The network's listing (one catalogue item offered from one node).
        quantity:
          type: integer
          minimum: 1
    Label:
      type: object
      required: [labelRef, trackingNumber, carrier]
      description: A shipping label reference. Never carries the ship-to address.
      properties:
        packageNo:
          type: integer
          minimum: 1
        labelRef:
          type: string
        trackingNumber:
          type: string
        carrier:
          type: string
    Acknowledgement:
      type: object
      required: [decision, transactionId]
      properties:
        decision:
          type: string
          enum: [ACCEPT, REJECT]
        reasonCode:
          $ref: '#/components/schemas/RejectReason'
        transactionId:
          type: string
    PurchaseOrder:
      type: object
      description: |
        The network's instruction to one vendor node to ship one shipment group in
        full by `requiredShipBy`. Carries no ship-to PII.
      required: [poNumber, vendorId, nodeId, state, issuedAt, requiredShipBy, ackBy, lines]
      properties:
        poNumber:
          type: string
          example: PO-7f3c
        vendorId:
          type: string
          example: V-WS
        nodeId:
          type: string
        state:
          $ref: '#/components/schemas/PurchaseOrderState'
        issuedAt:
          type: string
          format: date-time
        requiredShipBy:
          type: string
          format: date-time
          description: The pickup cutoff the order must be ready for (the fleet calls it the CPT).
        ackBy:
          type: string
          format: date-time
          description: min(issuedAt + vendor ackWindow, requiredShipBy - node handlingTime).
        lines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PoLine'
        acknowledgement:
          description: Absent until the vendor's acknowledgement transaction succeeds.
          allOf:
            - $ref: '#/components/schemas/Acknowledgement'
        labels:
          type: array
          items:
            $ref: '#/components/schemas/Label'
        trackingNumbers:
          type: array
          description: The tracking numbers confirmed shipped.
          items:
            type: string
        shippedAt:
          type: string
          format: date-time
          nullable: true
    PurchaseOrderPage:
      type: object
      required: [purchaseOrders]
      properties:
        purchaseOrders:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseOrder'
        nextToken:
          type: string
          nullable: true
          description: Absent or null on the last page.
    AckLine:
      type: object
      required: [lineNo, quantity]
      properties:
        lineNo:
          type: integer
          minimum: 1
        quantity:
          type: integer
          minimum: 1
          description: Must equal the ordered quantity (fill-or-kill).
    AcknowledgementRequest:
      type: object
      required: [vendorId, poNumber, decision, lines]
      properties:
        vendorId:
          type: string
        poNumber:
          type: string
        decision:
          type: string
          enum: [ACCEPT, REJECT]
        reasonCode:
          allOf:
            - $ref: '#/components/schemas/RejectReason'
          description: Required when `decision` is `REJECT`.
        lines:
          type: array
          minItems: 1
          description: Every line of the purchase order, once, with its ordered quantity.
          items:
            $ref: '#/components/schemas/AckLine'
    InventoryLine:
      type: object
      required: [listingId, availableQty, basis]
      properties:
        listingId:
          type: string
        availableQty:
          type: integer
          minimum: 0
        basis:
          type: string
          enum: [PHYSICAL, THROUGHPUT_CONSTRAINED, UNKNOWN]
    InventoryFeedRequest:
      type: object
      required: [vendorId, nodeId, fullUpdate, asOf, lines]
      properties:
        vendorId:
          type: string
        nodeId:
          type: string
        fullUpdate:
          type: boolean
          description: When true, every listing of the node omitted here becomes zero.
        asOf:
          type: string
          format: date-time
        lines:
          type: array
          items:
            $ref: '#/components/schemas/InventoryLine'
    NodeType:
      type: string
      description: Node types a vendor may register. Parcel nodes are network-operated.
      enum: [FULFILLMENT_CENTER, INBOUND_CROSS_DOCK, RETURNS_CENTER]
    NodeSubtype:
      type: string
      enum: [SORTABLE, NON_SORTABLE, XL, SOFT_LINES, SUB_SAME_DAY, FRESH, MICRO]
    NodeRegistrationRequest:
      type: object
      required: [vendorId, vendorNodeCode, nodeType, regionId, timezone, postalCode, countryCode]
      properties:
        vendorId:
          type: string
        vendorNodeCode:
          type: string
          description: The vendor's own code for the node, unique per vendor.
        nodeType:
          $ref: '#/components/schemas/NodeType'
        subtype:
          $ref: '#/components/schemas/NodeSubtype'
        regionId:
          type: string
        timezone:
          type: string
          example: America/Sao_Paulo
        postalCode:
          type: string
          description: The node's own location (a building), not a customer address.
        countryCode:
          type: string
        lat:
          type: number
        lon:
          type: number
    CutoffSlot:
      type: object
      required: [localTime]
      properties:
        localTime:
          type: string
          example: '18:00'
        maxOrders:
          type: integer
          minimum: 1
    ThroughputCap:
      type: object
      required: [value, timeUnit, unit]
      properties:
        value:
          type: integer
          minimum: 1
        timeUnit:
          type: string
          example: HOUR
        unit:
          type: string
          enum: [ORDER]
    NodeProfileRequest:
      type: object
      required: [vendorId, profileRevision, timezone, operatingHoursByDay, handlingTimeMinutes, cutoffs, throughputCap]
      properties:
        vendorId:
          type: string
        profileRevision:
          type: integer
          minimum: 1
          description: Strictly increases per node.
        timezone:
          type: string
        operatingHoursByDay:
          type: object
          description: Operating hours keyed by day; the structure is node-topology's OperationalProfile.
          additionalProperties: true
        holidays:
          type: array
          items:
            type: string
            format: date
        handlingTimeMinutes:
          type: integer
          minimum: 1
        cutoffs:
          type: array
          items:
            $ref: '#/components/schemas/CutoffSlot'
        throughputCap:
          $ref: '#/components/schemas/ThroughputCap'
        sortDwellMinutes:
          type: integer
          minimum: 0
    VendorNode:
      type: object
      required: [nodeId, vendorId, vendorNodeCode, nodeType, status]
      properties:
        nodeId:
          type: string
        vendorId:
          type: string
        vendorNodeCode:
          type: string
        nodeType:
          $ref: '#/components/schemas/NodeType'
        subtype:
          $ref: '#/components/schemas/NodeSubtype'
        status:
          type: string
          enum: [PROPOSED, ACTIVE, SUSPENDED, RETIRED]
        regionId:
          type: string
        timezone:
          type: string
    ScorecardWindow:
      type: object
      required: [window, grade, observations, computedAt]
      properties:
        window:
          type: string
          description: Rolling window (7-day or 30-day).
          example: 7d
        grade:
          type: string
          enum: [A, B, C, D, PROVISIONAL]
        onTimeHandoverRate:
          type: number
          minimum: 0
          maximum: 1
        lateAckRate:
          type: number
          minimum: 0
          maximum: 1
        rejectRate:
          type: number
          minimum: 0
          maximum: 1
        expiryRate:
          type: number
          minimum: 0
          maximum: 1
        promiseKeptRate:
          type: number
          minimum: 0
          maximum: 1
        feedFreshnessP95Minutes:
          type: number
          minimum: 0
        observations:
          type: integer
          minimum: 0
        computedAt:
          type: string
          format: date-time
    Scorecard:
      type: object
      required: [nodeId, windows]
      properties:
        nodeId:
          type: string
        windows:
          type: array
          items:
            $ref: '#/components/schemas/ScorecardWindow'
    LabelPackage:
      type: object
      required: [packageNo]
      properties:
        packageNo:
          type: integer
          minimum: 1
    LabelRequest:
      type: object
      required: [vendorId, poNumber, packages]
      properties:
        vendorId:
          type: string
        poNumber:
          type: string
        packages:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/LabelPackage'
    LabelResponse:
      type: object
      required: [poNumber, labels]
      properties:
        poNumber:
          type: string
        labels:
          type: array
          items:
            $ref: '#/components/schemas/Label'
    ShipmentConfirmationRequest:
      type: object
      required: [vendorId, poNumber, shippedAt, trackingNumbers]
      properties:
        vendorId:
          type: string
        poNumber:
          type: string
        shippedAt:
          type: string
          format: date-time
        trackingNumbers:
          type: array
          minItems: 1
          description: One per package; each must belong to a label issued for this purchase order.
          items:
            type: string
    OnboardVendorRequest:
      type: object
      required: [vendorId, name, ackWindowMinutes]
      properties:
        vendorId:
          type: string
          example: V-WS
        name:
          type: string
        ackWindowMinutes:
          type: integer
          minimum: 60
          maximum: 1440
          description: Between 1h and 24h (`ErrAckWindowOutOfRange`).
    VendorAccount:
      type: object
      required: [vendorId, name, ackWindowMinutes, state]
      properties:
        vendorId:
          type: string
        name:
          type: string
        ackWindowMinutes:
          type: integer
        state:
          type: string
          enum: [ACTIVE, SUSPENDED]
