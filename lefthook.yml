# lefthook.yml — git hooks for warehouse-docs.
#
# One-time local activation (hooks are NOT tracked in git, so every clone must
# do this once):
#
#   brew install lefthook
#   lefthook install
#
# The hooks are thin wrappers around the Makefile so there is exactly ONE
# definition of each sensor (see Makefile / .github/workflows/ci.yml).
# gen-check and drift-test are offline (stdlib + node); the fuller gate
# (typecheck, build) runs in pre-push and CI.

min_version: 1.7.0

# Fast offline sensors only — must stay snappy enough to run on every commit.
pre-commit:
  parallel: false
  jobs:
    - name: gen-check
      run: |
        command -v make >/dev/null 2>&1 || {
          echo "lefthook/pre-commit: 'make' is not installed or not on PATH — cannot run the quality gate."
          exit 1
        }
        make gen-check
    - name: drift-test
      run: make drift-test

# The last gate before code leaves the machine (needs `make install` once).
pre-push:
  parallel: false
  jobs:
    - name: check
      run: |
        command -v make >/dev/null 2>&1 || {
          echo "lefthook/pre-push: 'make' is not installed or not on PATH — cannot run the quality gate."
          exit 1
        }
        make check
