# retail-network canonical domain model
#
# This file is the SINGLE SOURCE OF TRUTH for every page under docs/.
# Every aggregate, invariant, command, event, consumer, relationship and
# ubiquitous-language term printed on the site must exist here first.
# Pages derive from it; they never introduce a new message or edge.
#
# Status: AS BUILT for all eleven services (seller-inbound included since its
# develop branch carries cmd/api, cmd/mcp and apis/; re-checked 2026-10-26).
# The events, fields, consumers, routes and reason vocabularies below were
# checked against each service's specification and code on origin/develop;
# identifiers (Go-style Err... names, REST paths, CloudEvents types) are the
# names the services use.
#
# This file is the MODEL derived from public fulfillment-network
# benchmarks plus the warehouse-systems estate; it makes no claim
# about any real company's internal service names.

meta:
  domain: Retail Network
  slug: retail-network
  organization: >-
    A separate organization from the warehouse-systems fleet. It owns the
    customer, the catalogue, the delivery promise, order sourcing, the
    seller inbound programme and the parcel network (sortation centres,
    delivery stations, air hubs).
    Fulfillment nodes are operated by vendors; the warehouse-systems fleet
    is vendor V-WS (one vendor among potentially many).
  supersedes: >-
    The single-context decision D1 of the drafted retail-network ADR 0001
    (network-fulfillment/docs/planning/retail-network-adr-0001-DRAFT-for-new-repo.md).
    D2 (Direct-Fulfillment-like protocol in our own vocabulary), D3
    (declared + measured capability), D4 (proportional capacity share), D5
    (release on reconciled acceptance) and D6 (no auth) are kept.
  hard_boundary: >-
    No retail-network context consumes a warehouse.* Kafka topic, calls a
    warehouse-systems service, or reads warehouse-systems data. The fleet
    never consumes a retailnetwork.* topic. The only channel between the two
    organizations is the Vendor API (Open Host Service + Published Language)
    of vendor-connectivity, called by the fleet's network-fulfillment.

conventions:
  cloudevents:
    spec: CloudEvents 1.0, structured JSON, mandatory on every Kafka message (fleet rule carried over)
    type: "com.retailnetwork.<tier>.<context>.<entity>.<EventName>"
    entity_rule: "`<entity>` is the lower-case name of the aggregate or read-side model that raises the event, exactly the entity field of the published event below. Consumers dispatch on the full type string."
    source: "/retailnetwork/<context>"
    dataschema: "urn:retailnetwork:<context>:events:<EventName>:v1"
    subject: aggregate root id (also the Kafka partition key)
    topic: "retailnetwork.<context>.events"
    analytics_topic: "retailnetwork.<context>.analytics"
    tiers:
      commerce: [offer-availability, delivery-promise, customer-ordering, order-sourcing]
      logistics: [node-topology, linehaul-transportation, last-mile-delivery, shipping-and-tracking]
      partner: [vendor-connectivity, node-performance, seller-inbound]
  integration_rules:
    - Every context owns its database; no shared tables.
    - Every published event leaves through a transactional outbox.
    - Every consumer is idempotent on the CloudEvents id (inbox table).
    - Consumers dispatch on the full type string, never on a suffix.
    - Sibling data used in a decision is a local, event-fed read model; the promise hot path makes no synchronous call.
    - Synchronous in-organization calls exist only where a caller needs an answer inside a user or vendor request (listed under sync_calls).
  no_auth: Consistent with the fleet (no auth on REST or MCP). PII is synthetic and confined to customer-ordering and shipping-and-tracking.
  errors:
    - {error: ErrNotFound, status: 404, problem: not-found, rule: "an addressed aggregate does not exist"}
    - {error: ErrIllegalTransition, status: 409, problem: illegal-transition, rule: "the command is not allowed from the aggregate's current state"}
    - {error: ErrConcurrentUpdate, status: 409, problem: concurrent-update, rule: "optimistic-concurrency version mismatch; the caller re-reads and retries"}
    - {error: ErrValidation, status: 422, problem: validation-failed, rule: "the request is well-formed JSON but violates a value-object rule"}
  idempotency: "Every state-changing POST and PUT takes an Idempotency-Key header; each context keeps an idempotency_keys table keyed by (route, key) with a 24-hour TTL. An infrastructure table, not an aggregate."
  analytics_rule: "Events marked analytics-only are published ONLY to retailnetwork.<context>.analytics; integration events go ONLY to retailnetwork.<context>.events."

# ---------------------------------------------------------------------------
# Node types (owned by node-topology). Mapping from the fleet's facility-layout
# siteRole (ADR 0037) is in fleet_site_role_mapping below.
# ---------------------------------------------------------------------------
node_types:
  FULFILLMENT_CENTER:
    operator_allowed: [VENDOR]
    capabilities: [OUTBOUND, INBOUND]
    subtypes: [SORTABLE, NON_SORTABLE, XL, SOFT_LINES, SUB_SAME_DAY, FRESH, MICRO]
    description: Stores sellable inventory, receives inbound stock (including seller shipments), picks, packs and hands packages to the network at a pickup departure.
  INBOUND_CROSS_DOCK:
    operator_allowed: [VENDOR]
    capabilities: [INBOUND]
    description: Receives bulk inbound and pushes it into fulfillment centres. Never a ship-from node for customer orders.
  RETURNS_CENTER:
    operator_allowed: [VENDOR]
    capabilities: [RETURNS]
    description: The return location a customer return is routed to.
  SORTATION_CENTER:
    operator_allowed: [NETWORK]
    capabilities: [SORT]
    description: Sorts packages by final destination and consolidates them onto outbound loads.
  DELIVERY_STATION:
    operator_allowed: [NETWORK]
    capabilities: [LAST_MILE]
    description: Receives sorted packages and dispatches them on delivery routes inside its service area.
  AIR_HUB:
    operator_allowed: [NETWORK]
    capabilities: [SORT, AIR]
    description: Gateway between the ground network and air lanes.

lane_rules:
  # allowed (origin type -> destination type) pairs for a Lane
  allowed:
    - [FULFILLMENT_CENTER, SORTATION_CENTER]
    - [FULFILLMENT_CENTER, DELIVERY_STATION]   # direct injection (same-day, regional)
    - [FULFILLMENT_CENTER, AIR_HUB]
    - [SORTATION_CENTER, SORTATION_CENTER]
    - [SORTATION_CENTER, DELIVERY_STATION]
    - [SORTATION_CENTER, AIR_HUB]
    - [AIR_HUB, AIR_HUB]
    - [AIR_HUB, SORTATION_CENTER]
    - [AIR_HUB, DELIVERY_STATION]
    - [INBOUND_CROSS_DOCK, FULFILLMENT_CENTER]  # inbound lane, never on a customer path
  modes: [GROUND, AIR]

fleet_site_role_mapping:
  # warehouse-systems facility-layout siteRole -> network registration
  ROBOTICS_SORTABLE_FC:        {registers_as: FULFILLMENT_CENTER, subtype: SORTABLE, via: vendor-connectivity}
  TRADITIONAL_SORTABLE_FC:     {registers_as: FULFILLMENT_CENTER, subtype: SORTABLE, via: vendor-connectivity}
  SOFT_LINES_SORTABLE_FC:      {registers_as: FULFILLMENT_CENTER, subtype: SOFT_LINES, via: vendor-connectivity}
  NON_SORTABLE_FC:             {registers_as: FULFILLMENT_CENTER, subtype: NON_SORTABLE, via: vendor-connectivity}
  XL_FC:                       {registers_as: FULFILLMENT_CENTER, subtype: XL, via: vendor-connectivity}
  SUB_SAME_DAY_FC:             {registers_as: FULFILLMENT_CENTER, subtype: SUB_SAME_DAY, via: vendor-connectivity}
  FRESH_GROCERY_FC:            {registers_as: FULFILLMENT_CENTER, subtype: FRESH, via: vendor-connectivity}
  MICRO_FC:                    {registers_as: FULFILLMENT_CENTER, subtype: MICRO, via: vendor-connectivity}
  SIMULATED_FC:                {registers_as: FULFILLMENT_CENTER, subtype: SORTABLE, via: vendor-connectivity}
  INBOUND_CROSS_DOCK:          {registers_as: INBOUND_CROSS_DOCK, via: vendor-connectivity}
  NATIONAL_INBOUND_CROSS_DOCK: {registers_as: INBOUND_CROSS_DOCK, via: vendor-connectivity}
  RETURNS_CENTER:              {registers_as: RETURNS_CENTER, via: vendor-connectivity}
  SORTATION_CENTER:            {registers_as: none, note: "network-operated node; the fleet's facility-layout row is a reference mirror only"}
  DELIVERY_STATION:            {registers_as: none, note: "network-operated node; the fleet's facility-layout row is a reference mirror only"}
  AIR_HUB_GATEWAY:             {registers_as: none, note: "network-operated node (AIR_HUB); the fleet's facility-layout row is a reference mirror only"}

service_tiers:
  SAME_DAY:  {max_calendar_days: 0, nominal_fallback: false, path: "FULFILLMENT_CENTER(SUB_SAME_DAY|MICRO) -> DELIVERY_STATION of the destination service area"}
  NEXT_DAY:  {max_calendar_days: 1, nominal_fallback: false}
  TWO_DAY:   {max_calendar_days: 2, nominal_fallback: false}
  STANDARD:  {max_calendar_days: 7, nominal_fallback: true}
  CONSOLIDATED: {max_calendar_days: 14, nominal_fallback: true, path: "opt-in: quoted only when the request lists it or names a chosen delivery day; never in a default quote set and never in an estimate (delivery-promise ADR 0024)"}

# ---------------------------------------------------------------------------
# Bounded contexts
# chart: x = complexity, y = differentiation, on the fleet's pinned quadrant
# labels (quadrant-1 Core top-right, quadrant-2 Decisive top-left,
# quadrant-3 Supporting bottom-left, quadrant-4 Generic bottom-right).
# ---------------------------------------------------------------------------
contexts:

  # =========================================================================
  - id: node-topology
    name: Node Topology
    code: NT
    tier: logistics
    classification: Supporting
    chart: {differentiation: 0.42, complexity: 0.44, evolution: Custom-built}
    business_model: Enabler (every promise, assignment and route rests on it)
    purpose: >-
      The authoritative registry of the network's physical shape: every node
      (vendor fulfillment centres, cross-docks, returns centres, and the
      network's own sortation centres, delivery stations and air hubs), its
      declared operational profile, the directed lanes between nodes, the
      regions, and which delivery station serves which postal area.
    roles: [Specification, Gateway for declared capability (owner), Master data]
    business_decisions:
      - A parcel node (SORTATION_CENTER, DELIVERY_STATION, AIR_HUB) is always network-operated; a vendor may register only FULFILLMENT_CENTER, INBOUND_CROSS_DOCK or RETURNS_CENTER nodes.
      - A node takes customer demand only while ACTIVE and only if it has the OUTBOUND capability.
      - An operational profile is versioned; a new declaration never edits an old revision.
      - A lane joins two different nodes along an allowed type pair; both ends must be ACTIVE to open it.
      - Every postal prefix maps to exactly one delivery station per assignment version.
    aggregates:
      - name: Node
        root_id: nodeId
        description: One physical building in the network, its type, operator, region, time zone and declared operational profile.
        states: [PROPOSED, ACTIVE, SUSPENDED, RETIRED]
        transitions:
          - [PROPOSED, ACTIVE, ActivateNode]
          - [ACTIVE, SUSPENDED, SuspendNode]
          - [SUSPENDED, ACTIVE, ActivateNode]
          - [ACTIVE, RETIRED, RetireNode]
          - [SUSPENDED, RETIRED, RetireNode]
        entities: []
        value_objects:
          - "OperationalProfile{profileRevision, timezone, operatingHoursByDay, holidays[], handlingTime, cutoffs[CutoffSlot{localTime HH:mm, days[] (default every operating day), maxOrders?}], throughputCap{value int>0, timeUnit HOUR|DAY, unit=ORDER}, sortDwellMinutes (sort centres and air hubs only), inbound{maxCartonWeightG, maxCartonDimsMm{l,w,h}, acceptsPallets, requiresSscc} (optional; nodes with the INBOUND capability only), declaredBy(VENDOR|NETWORK_OPS), declaredAt}; operatingHoursByDay{monday..sunday: {start HH:mm, end HH:mm}} (a missing day is closed); holidays[] are ISO dates (closed all day)"
          - NodeCapabilities{outbound, inbound, returns, sort, lastMile, air}
          - GeoLocation{postalCode, countryCode, lat, lon}
          - VendorRef{vendorId, vendorNodeCode}
        invariants:
          - {rule: "operator must be allowed for the node type (parcel nodes are NETWORK-operated)", error: ErrOperatorNotAllowedForNodeType}
          - {rule: "vendorNodeCode is unique per vendor", error: ErrVendorNodeCodeTaken}
          - {rule: "profile revision strictly increases", error: ErrStaleProfileRevision}
          - {rule: "a FULFILLMENT_CENTER profile declares at least one cutoff and a handlingTime > 0 before activation, and every later revision of an ACTIVE FULFILLMENT_CENTER keeps both", error: ErrIncompleteOperationalProfile}
          - {rule: "every day of a cutoff falls inside the operating hours of that day", error: ErrCutoffOutsideOperatingHours}
          - {rule: "the node's regionId names a defined Region", error: ErrUnknownRegion}
          - {rule: "subtype, when given, is one of the node type's subtypes in node_types", error: ErrSubtypeNotAllowed}
          - {rule: "sortDwellMinutes is declared only by SORTATION_CENTER and AIR_HUB nodes", error: ErrSortDwellNotAllowed}
          # as built (node-topology ADR 0015, gap G64 closed): FULFILLMENT_CENTER carries INBOUND (node_types); a NEW declaration of inbound limits on a type without INBOUND is refused before the ADR 0007 value checks; stored revisions that carry such limits stay restorable (no migration)
          - {rule: "inbound limits are declared only on a node whose type has the INBOUND capability (FULFILLMENT_CENTER, INBOUND_CROSS_DOCK); HTTP 422 inbound-limits-not-allowed. Checked on DeclareOperationalProfile only, before the value checks; an explicit inbound null reads as absent; Restore never refuses a stored revision (node-topology ADR 0015)", error: ErrInboundLimitsNotAllowed}
          - {rule: "inbound limits, when declared, declare at least one field; every number set is a positive integer (at most 2147483647); the three maxCartonDimsMm edges are all-or-none (node-topology ADR 0007)", error: ErrValidation}
          - {rule: "RETIRED is terminal", error: ErrNodeRetired}
        commands: [RegisterNode, DeclareOperationalProfile, ActivateNode, SuspendNode, RetireNode]
        events: [NodeRegistered, NodeOperationalProfileDeclared, NodeActivated, NodeSuspended, NodeRetired]
        throughput_estimate: "low: tens of writes per day"
        size_estimate: "one row + one profile row per revision; ~10^3 nodes"
      - name: Lane
        root_id: laneId
        description: A directed, mode-specific connection between two nodes with a nominal transit time. Its scheduled departures belong to linehaul-transportation.
        states: [OPEN, CLOSED]
        transitions:
          - [OPEN, CLOSED, CloseLane]
        value_objects: ["NominalTransit{minutes}", "LaneMode(GROUND|AIR)"]
        invariants:
          - {rule: "origin and destination differ", error: ErrLaneLoop}
          - {rule: "(origin type, destination type) is an allowed pair", error: ErrLaneTypePairNotAllowed}
          - {rule: "both ends ACTIVE when opening", error: ErrLaneEndpointNotActive}
          - {rule: "at most one OPEN lane per (origin, destination, mode)", error: ErrDuplicateLane}
        commands: [OpenLane, CloseLane]
        events: [LaneOpened, LaneClosed]
        throughput_estimate: "low"
        size_estimate: "~10^4 lanes"
      - name: ServiceArea
        root_id: postalPrefix
        description: Which delivery station (and therefore which region) serves a postal prefix, versioned.
        states: [ASSIGNED]
        invariants:
          - {rule: "the assigned node is an ACTIVE DELIVERY_STATION", error: ErrNotADeliveryStation}
          - {rule: "assignment version strictly increases", error: ErrStaleAssignmentVersion}
          - {rule: "the assigned region is a defined Region and matches the station's region", error: ErrUnknownRegion}
        transitions:
          - [ASSIGNED, ASSIGNED, AssignServiceArea]
        initial_state: ASSIGNED
        commands: [AssignServiceArea]
        events: [ServiceAreaAssigned]
        throughput_estimate: "low; bulk at network redesign"
        size_estimate: "~10^4 prefixes"
      - name: Region
        root_id: regionId
        description: A largely self-sufficient partition of the network; nodes and service areas belong to exactly one region.
        states: [DEFINED]
        initial_state: DEFINED
        invariants:
          - {rule: "region code unique", error: ErrRegionCodeTaken}
        commands: [DefineRegion]
        events: [RegionDefined]
        throughput_estimate: "rare"
        size_estimate: "single digits (eight in the reference network)"
    read_models: []
    policies:
      - {name: DefaultCapabilitiesByType, rule: "node capabilities are derived from node_types, never typed by hand"}
      - {name: SuspendedEndpointsUnusable, rule: "suspending or retiring a node closes nothing: its OPEN lanes and ASSIGNED service areas stay as they are, and consumers treat them as unusable while the node is not ACTIVE (they react to NodeSuspended and NodeRetired)"}
      - {name: NoDefaultLaneNoPackagesPerOrder, rule: "node-topology declares no default outbound lane and no packagesPerOrder: neither is a field of Node, Lane or OperationalProfile. linehaul-transportation derives the pickup's lane itself (policy DefaultOutboundLane) and keeps its own packagesPerOrder setting (policy PickupCapacity); delivery-promise reads packagesPerOrder from its PromisePolicy"}
    inbound:
      - {from: vendor-connectivity, type: cmd, channel: "REST POST /nodes (in-org)", routes: ["POST /nodes"], message: "RegisterNode (vendor node)", relationship: Customer/Supplier}
      - {from: vendor-connectivity, type: cmd, channel: "REST PUT /nodes/{nodeId}/operational-profile (in-org)", routes: ["PUT /nodes/{nodeId}/operational-profile"], message: "DeclareOperationalProfile", relationship: Customer/Supplier}
      - {from: network-ops planner, type: cmd, channel: "REST PUT /nodes/{nodeId}/operational-profile", routes: ["PUT /nodes/{nodeId}/operational-profile"], message: "DeclareOperationalProfile (declaredBy NETWORK_OPS)", relationship: UI}
      - {from: network-ops planner, type: cmd, channel: "REST POST /nodes, POST /nodes/{nodeId}:activate, POST /nodes/{nodeId}:suspend, POST /nodes/{nodeId}:retire, POST /lanes, POST /lanes/{laneId}:close, PUT /service-areas/{postalPrefix}, POST /regions", routes: ["POST /nodes", "POST /nodes/{nodeId}:activate", "POST /nodes/{nodeId}:suspend", "POST /nodes/{nodeId}:retire", "POST /lanes", "POST /lanes/{laneId}:close", "PUT /service-areas/{postalPrefix}", "POST /regions"], message: "RegisterNode (network node), ActivateNode, SuspendNode, RetireNode, OpenLane, CloseLane, AssignServiceArea, DefineRegion", relationship: UI}
      - {from: any context, type: qry, channel: "REST GET /nodes/{nodeId}, GET /nodes, GET /lanes, GET /service-areas/{postalPrefix}, GET /regions, GET /regions/{regionId}", routes: ["GET /nodes/{nodeId}", "GET /nodes", "GET /lanes", "GET /service-areas/{postalPrefix}", "GET /regions", "GET /regions/{regionId}"], message: "GetNode, ListNodes, ListLanes, ResolveServiceArea, ListRegions, GetRegion", relationship: OHS}
    rest:
      - "POST /nodes"
      - "GET /nodes/{nodeId}"
      - "GET /nodes?type=&region=&status="
      - "PUT /nodes/{nodeId}/operational-profile"
      - "POST /nodes/{nodeId}:activate"
      - "POST /nodes/{nodeId}:suspend"
      - "POST /nodes/{nodeId}:retire"
      - "POST /lanes"
      - "POST /lanes/{laneId}:close"
      - "GET /lanes?origin=&destination="
      - "PUT /service-areas/{postalPrefix}"
      - "GET /service-areas/{postalPrefix}"
      - "POST /regions"
      - "GET /regions"
      - "GET /regions/{regionId}"
    publishes:
      - {event: NodeRegistered, entity: node, data: [nodeId, nodeType, subtype, operator, vendorId, vendorNodeCode, regionId, timezone, postalCode, countryCode], consumers: [offer-availability, delivery-promise, order-sourcing, linehaul-transportation, last-mile-delivery, node-performance, vendor-connectivity, seller-inbound]}
      - {event: NodeOperationalProfileDeclared, entity: node, data: [nodeId, profileRevision, timezone, operatingHoursByDay, holidays, handlingTimeMinutes, cutoffs, throughputCap, sortDwellMinutes, inbound, declaredBy], consumers: [delivery-promise, order-sourcing, linehaul-transportation, node-performance, vendor-connectivity, seller-inbound]}
      - {event: NodeActivated, entity: node, data: [nodeId, activatedAt], consumers: [offer-availability, delivery-promise, order-sourcing, linehaul-transportation, vendor-connectivity, seller-inbound]}
      - {event: NodeSuspended, entity: node, data: [nodeId, reason, suspendedAt], consumers: [offer-availability, delivery-promise, order-sourcing, linehaul-transportation, vendor-connectivity, seller-inbound]}
      - {event: NodeRetired, entity: node, data: [nodeId, retiredAt], consumers: [offer-availability, delivery-promise, order-sourcing, linehaul-transportation, vendor-connectivity, seller-inbound]}
      - {event: LaneOpened, entity: lane, data: [laneId, originNodeId, destinationNodeId, mode, nominalTransitMinutes], consumers: [linehaul-transportation, delivery-promise, order-sourcing]}
      - {event: LaneCostDeclared, entity: lane, data: [laneId, costPerUnitCents, declaredAt], consumers: [order-sourcing]}
      - {event: LaneClosed, entity: lane, data: [laneId, closedAt], consumers: [linehaul-transportation, delivery-promise, order-sourcing]}
      - {event: ServiceAreaAssigned, entity: servicearea, data: [postalPrefix, deliveryStationNodeId, regionId, assignmentVersion], consumers: [delivery-promise, order-sourcing, last-mile-delivery]}
      - {event: RegionDefined, entity: region, data: [regionId, code, name], consumers: [delivery-promise, order-sourcing]}
    reasons: []   # no closed vocabulary: NodeSuspended.reason is free text (non-blank)
    consumes: []
    sync_calls: []
    ul:
      - {term: Node, definition: "One physical building of the network, of exactly one node type.", code: "node.Node"}
      - {term: Node Type, definition: "FULFILLMENT_CENTER, INBOUND_CROSS_DOCK, RETURNS_CENTER, SORTATION_CENTER, DELIVERY_STATION or AIR_HUB.", code: "node.Type"}
      - {term: Node Operator, definition: "Who runs the building: NETWORK or a VENDOR.", code: "node.Operator"}
      - {term: Operational Profile, definition: "The node's declared operating hours, cutoffs, handling time, throughput cap and time zone, versioned by profileRevision.", code: "node.OperationalProfile"}
      - {term: Cutoff, definition: "A local time by which a node declares packages are ready to be handed over; the network schedules one pickup departure per cutoff.", code: "node.CutoffSlot"}
      - {term: Handling Time, definition: "Declared time from order release to a package ready for handover.", code: "node.OperationalProfile.HandlingTime"}
      - {term: Sort Dwell, definition: "Declared minutes a package normally spends inside a sortation centre or air hub between arrival and departure; declared only by those node types.", code: "node.OperationalProfile.SortDwellMinutes"}
      - {term: Throughput Cap, definition: "Declared maximum orders per time unit a node accepts.", code: "node.ThroughputCap"}
      - {term: Inbound Limits, definition: "A receiving node's declared carton weight and size limits, whether it accepts pallets and whether it requires an SSCC on every carton.", code: "node.OperationalProfile.Inbound"}
      - {term: Lane, definition: "A directed, mode-specific connection between two nodes.", code: "lane.Lane"}
      - {term: Region, definition: "A largely self-sufficient partition of the network.", code: "region.Region"}
      - {term: Service Area, definition: "The postal prefixes one delivery station serves.", code: "servicearea.ServiceArea"}

  # =========================================================================
  - id: offer-availability
    name: Offer & Availability
    code: OA
    tier: commerce
    classification: Supporting
    chart: {differentiation: 0.38, complexity: 0.30, evolution: Product}
    business_model: Revenue enabler (what can be sold, from where)
    purpose: >-
      Knows what the network can sell and from which node: the catalogue
      item, one listing per (catalogue item, node), and the quantity each
      node currently claims it can ship, with the basis the vendor gave for
      that number (physical stock or throughput-constrained).
    roles: [Specification, Analysis (availability)]
    business_decisions:
      - A listing is sellable only while its node is ACTIVE and its owner is not a suspended seller (offer-availability ADR 0013).
      - Received seller stock becomes the seller's listing on the receiving node at availability 0 / UNKNOWN; only the vendor's inventory feed sets availability (offer-availability ADR 0014).
      - A feed older than the last applied feed for that node is ignored.
      - A full feed zeroes every listing of that node it omits.
      - The basis the vendor declares (PHYSICAL or THROUGHPUT_CONSTRAINED) is kept with the number, never re-derived.
    aggregates:
      - name: CatalogItem
        root_id: catalogItemId
        description: The network's own item master entry (title, dimensions, weight, handling flags, the each GTIN and a packaging hierarchy). Vendors refer to it by listingId.
        states: [ACTIVE, DISCONTINUED]
        transitions: [[ACTIVE, DISCONTINUED, DiscontinueItem]]
        value_objects:
          - "Identifiers{gtin} (the each-level GTIN, optional)"
          - "PackagingHierarchy[PackLevelDef] (optional; one active definition per level)"
          - "PackLevelDef{level(EACH|INNER|CASE|PALLET), gtin, childGtin?, unitsPerPack (eaches, >= 2 except EACH = 1), dimsMm{l,w,h}?, grossWeightG?, active}; a level other than EACH has childGtin (the next lower level's GTIN); unitsPerPack is the direct factor to eaches, stored and not recomputed by chaining"
        invariants:
          - {rule: "dimensions and weight are positive", error: ErrInvalidItemDimensions}
          - {rule: "a GTIN is 8, 12, 13 or 14 digits with a valid mod-10 check digit, stored as 14 digits", error: ErrInvalidGTIN}
          - {rule: "a GTIN identifies exactly one (catalogue item, level)", error: ErrGtinAlreadyAssigned}
          - {rule: "once a level is active its unitsPerPack never changes for that GTIN: a new content quantity is a new GTIN at that level and a re-declaration of every level above it, and the old level is retired (active = false)", error: ErrPackQuantityImmutable}
          - {rule: "a level's child level is lower than the level itself", error: ErrPackLevelOrder}
          - {rule: "unitsPerPack is at least 2 for every level other than EACH, and 1 for EACH", error: ErrInvalidPackQuantity}
          - {rule: "variable-measure GTINs (indicator digit 9) are rejected", error: ErrInvalidGTIN}
        commands: [CreateCatalogItem, DiscontinueItem, DeclarePackaging, RetirePackLevel]
        events: [CatalogItemCreated, CatalogItemDiscontinued, CatalogItemPackagingDeclared, CatalogItemPackLevelRetired]
        throughput_estimate: "low"
        size_estimate: "~10^6 items"
      - name: Listing
        root_id: listingId
        description: "One catalogue item offered from one node by one owner, with the node's claimed available quantity, its basis and the feed it came from. ownerRef is the seller of record; empty means stock the vendor owns (every listing that exists today)."
        states: [LIVE, SUPPRESSED]
        transitions:
          - [LIVE, SUPPRESSED, SuppressListing]
          - [SUPPRESSED, LIVE, RestoreListing]
        value_objects: ["Availability{availableQty, basis(PHYSICAL|THROUGHPUT_CONSTRAINED|UNKNOWN), asOf, feedId}", "OwnerRef (optional opaque string; the sellerId of a seller's stock)"]
        invariants:
          - {rule: "availableQty >= 0", error: ErrNegativeAvailability}
          - {rule: "an update with asOf <= current asOf is ignored (monotonic per listing)", error: ErrStaleAvailability}
          - {rule: "a listing on a non-ACTIVE node is SUPPRESSED", error: ErrNodeNotSellable}
          - {rule: "one listing per (catalogItemId, nodeId, ownerRef); no ownerRef is its own owner", error: ErrDuplicateListing}
        commands: [CreateListing, ApplyAvailability, SuppressListing, RestoreListing, ApplyReceivedStock]
        events: [ListingCreated, ListingAvailabilityChanged, ListingSuppressed, ListingRestored]
        throughput_estimate: "high: one update per feed line; bursty"
        size_estimate: "items x nodes, sparse"
      - name: InventoryFeed
        root_id: feedId
        description: "One vendor inventory submission for one node, full or partial, applied atomically."
        states: [RECEIVED, APPLIED, FAILED]
        transitions:
          - [RECEIVED, APPLIED, ApplyInventoryFeed]
          - [RECEIVED, FAILED, ApplyInventoryFeed]
        invariants:
          - {rule: "every line names a listing of the feed's node", error: ErrListingNotOnNode}
          - {rule: "a feed is applied at most once", error: ErrFeedAlreadyApplied}
        commands: [ApplyInventoryFeed]
        events: [InventoryFeedApplied]
        throughput_estimate: "medium: per vendor node every few minutes"
        size_estimate: "retained 30 days"
    read_models:
      - {name: NodeStatusView, source: "node-topology NodeRegistered/NodeActivated/NodeSuspended/NodeRetired"}
      - {name: SellerStatusView, source: "seller-inbound SellerSuspended (SUSPENDED, asOf = suspendedAt), SellerReinstated (ACTIVE, asOf = reinstatedAt); one row per sellerId, an observation older than asOf is ignored, an unknown seller is ACTIVE (offer-availability ADR 0013)"}
    policies:
      - {name: SuppressOnNodeUnavailable, rule: "on NodeSuspended or NodeRetired suppress every listing of the node; on NodeActivated reconcile every listing of the node: it becomes LIVE only when no other cause holds, and a listing whose owner is SUSPENDED switches to OWNER_SUSPENDED instead (offer-availability ADR 0013)"}
      - {name: SuppressOnOwnerSuspended, rule: "on SellerSuspended suppress every LIVE listing with ownerRef = sellerId with reason OWNER_SUSPENDED (one ListingSuppressed each, in the transaction of the view update); a listing already suppressed for a higher cause keeps its reason, and the owner's view row stops a later restore of that cause; on SellerReinstated reconcile every OWNER_SUSPENDED listing of the owner: ListingRestored when no cause remains, otherwise one ListingSuppressed with the remaining highest cause (offer-availability ADR 0013, gap G48)"}
      - {name: ListingReconcile, rule: "Listing.Reconcile reads the listing's three causes (node ACTIVE in NodeStatusView, item discontinued, owner SUSPENDED in SellerStatusView) and moves the listing to the highest active cause: LIVE when none holds (ListingRestored), otherwise SUPPRESSED with that reason (one ListingSuppressed when the reason changes); DISCONTINUED stays final"}
      - {name: ListingsFromReceivedStock, rule: "on InboundShipmentReceived, for each received line with qtyEaches > 0 resolve the item (the line's catalogItemId, else the own GTIN/packaging index, retired levels included) and, when no listing of (catalogItemId, nodeId, ownerRef = sellerId) exists, create one as the system actor: ListingCreated with ownerRef, availability 0 basis UNKNOWN, then ListingSuppressed for the highest cause when the node is not sellable, the item is discontinued or the owner is SUSPENDED. An existing listing is a no-op; availability still comes only from the vendor feed; an unresolvable GTIN, an unknown item or an event without received is skipped and counted, never an error; one transaction per event, inbox-idempotent (offer-availability ADR 0014, gap G51)"}
      - {name: FullFeedZeroing, rule: "a full feed sets availableQty=0 on every listing of the node it omits"}
      - {name: OwnerSuspendedOnCreate, rule: "CreateListing (REST or ListingsFromReceivedStock) for an owner SUSPENDED in SellerStatusView raises ListingCreated then ListingSuppressed(OWNER_SUSPENDED) at version 1, unless a higher cause applies, which wins"}
      - {name: SegregatedByOwner, rule: "availability is per listing and a listing has one owner: quantities of different owners are never summed, merged or moved between listings; commingling stock by GTIN is not designed"}
    inbound:
      - {from: vendor-connectivity, type: cmd, channel: "REST POST /inventory-feeds (in-org)", routes: ["POST /inventory-feeds"], message: "ApplyInventoryFeed", relationship: Customer/Supplier}
      - {from: "network merchandising (human)", type: cmd, channel: "REST POST /catalog-items, POST /catalog-items/{catalogItemId}:discontinue, PUT /catalog-items/{catalogItemId}/packaging/{level}, POST /catalog-items/{catalogItemId}/packaging/{level}:retire, POST /listings", routes: ["POST /catalog-items", "POST /catalog-items/{catalogItemId}:discontinue", "PUT /catalog-items/{catalogItemId}/packaging/{level}", "POST /catalog-items/{catalogItemId}/packaging/{level}:retire", "POST /listings"], message: "CreateCatalogItem, DiscontinueItem, DeclarePackaging, RetirePackLevel, CreateListing", relationship: UI}
      # caller inferred: ADR 0003 names no caller for these plain reads (merchandising; vendor-connectivity has no client for them). There is no separate packaging read: the packaging hierarchy is part of GET /catalog/{catalogItemId} (as built)
      - {from: "network merchandising (human)", type: qry, channel: "REST GET /listings, GET /inventory-feeds/{feedId}", routes: ["GET /listings", "GET /inventory-feeds/{feedId}"], message: "ListListings, GetInventoryFeed", relationship: UI}
      - {from: shopper / storefront, type: qry, channel: "REST GET /catalog, GET /catalog/{catalogItemId}", routes: ["GET /catalog", "GET /catalog/{catalogItemId}"], message: "BrowseCatalog", relationship: OHS}
      - {from: node-topology, type: evt, channel: "Kafka retailnetwork.node-topology.events", message: "NodeRegistered, NodeActivated, NodeSuspended, NodeRetired", relationship: Conformist}
      - {from: seller-inbound, type: evt, channel: "Kafka retailnetwork.seller-inbound.events", message: "SellerSuspended, SellerReinstated, InboundShipmentReceived", relationship: Conformist}
    rest:
      - "POST /catalog-items"
      - "POST /catalog-items/{catalogItemId}:discontinue"
      - "PUT /catalog-items/{catalogItemId}/packaging/{level}"
      - "POST /catalog-items/{catalogItemId}/packaging/{level}:retire"
      - "GET /catalog"
      - "GET /catalog/{catalogItemId}"
      - "POST /listings"
      - "GET /listings?nodeId=&catalogItemId="
      - "POST /inventory-feeds"
      - "GET /inventory-feeds/{feedId}"
    publishes:
      - {event: CatalogItemCreated, entity: catalogitem, data: [catalogItemId, title, lengthMm, widthMm, heightMm, weightG, hazmat, fragile, gtin (optional)], consumers: [delivery-promise, shipping-and-tracking]}
      - {event: CatalogItemDiscontinued, entity: catalogitem, data: [catalogItemId], consumers: [delivery-promise, order-sourcing]}
      - {event: CatalogItemPackagingDeclared, entity: catalogitem, data: [catalogItemId, level, gtin, childGtin (optional), unitsPerPack, declaredAt], consumers: [seller-inbound, vendor-connectivity]}
      - {event: CatalogItemPackLevelRetired, entity: catalogitem, data: [catalogItemId, level, gtin, retiredAt], consumers: [seller-inbound, vendor-connectivity]}
      - {event: ListingCreated, entity: listing, data: [listingId, catalogItemId, nodeId, ownerRef (optional)], consumers: [delivery-promise, order-sourcing, vendor-connectivity]}
      - {event: ListingAvailabilityChanged, entity: listing, data: [listingId, catalogItemId, nodeId, availableQty, basis, asOf, feedId, ownerRef (optional)], consumers: [delivery-promise, order-sourcing, seller-inbound]}
      - {event: ListingSuppressed, entity: listing, data: [listingId, nodeId, reason], consumers: [delivery-promise, order-sourcing]}
      - {event: ListingRestored, entity: listing, data: [listingId, nodeId], consumers: [delivery-promise, order-sourcing]}
      - {event: InventoryFeedApplied, entity: inventoryfeed, data: [feedId, nodeId, fullUpdate, lineCount, appliedAt], consumers: [node-performance]}
    reasons:
      - name: ListingSuppressionReason
        fields: [ListingSuppressed.reason, "rest:SuppressionReason", "rest:Listing.suppressionReason"]
        about: "Why a listing is SUPPRESSED."
        values:
          - {value: NODE_NOT_SELLABLE, meaning: "The listing's node is not ACTIVE; the listing is restored when the node activates."}
          - {value: DISCONTINUED, meaning: "The catalogue item is discontinued; final, the listing is never restored."}
          - {value: OWNER_SUSPENDED, meaning: "The listing's owner (ownerRef) is a suspended seller; the listing is reconciled when the seller is reinstated. Lowest precedence: DISCONTINUED, then NODE_NOT_SELLABLE, then OWNER_SUSPENDED."}
    consumes:
      - {event: NodeRegistered, from: node-topology}
      - {event: NodeActivated, from: node-topology}
      - {event: NodeSuspended, from: node-topology}
      - {event: NodeRetired, from: node-topology}
      - {event: SellerSuspended, from: seller-inbound}
      - {event: SellerReinstated, from: seller-inbound}
      - {event: InboundShipmentReceived, from: seller-inbound}
    sync_calls: []
    ul:
      - {term: Catalog Item, definition: "The network's own entry for a product, independent of who ships it.", code: "catalog.Item"}
      - {term: Listing, definition: "A catalogue item offered from one node.", code: "listing.Listing"}
      - {term: Available Quantity, definition: "What a node claims it can ship now for one listing.", code: "listing.Availability.AvailableQty"}
      - {term: Availability Basis, definition: "Why the node gave that number: PHYSICAL stock, THROUGHPUT_CONSTRAINED by its capacity before the next cutoff, or UNKNOWN.", code: "listing.Basis"}
      - {term: Inventory Feed, definition: "One vendor submission of availability for one node, full or partial.", code: "feed.InventoryFeed"}
      - {term: Full Feed, definition: "A feed that is the complete truth for its node; omitted listings become zero.", code: "feed.InventoryFeed.FullUpdate"}
      - {term: Packaging Hierarchy, definition: "The pack levels of one catalogue item (each, inner pack, case, pallet), each with its own GTIN and a fixed content quantity. Quantities stay in eaches.", code: "catalog.PackagingHierarchy"}
      - {term: Pack Level, definition: "One of EACH, INNER, CASE or PALLET. A level other than EACH knows its child level's GTIN and how many of it it holds.", code: "catalog.PackLevel"}
      - {term: Owner Reference, definition: "The opaque ownerRef on a listing: the seller of record of the stock. Empty means the vendor's own stock.", code: "listing.OwnerRef"}
      - {term: Owner Suspended, definition: "The suppression cause of a listing whose seller is suspended; the lowest of the three causes.", code: "listing.ReasonOwnerSuspended"}

  # =========================================================================
  - id: delivery-promise
    name: Delivery Promise
    code: DP
    tier: commerce
    classification: Core
    chart: {differentiation: 0.92, complexity: 0.85, evolution: Custom-built}
    business_model: Revenue generator (conversion) and cost reducer (no promise the network cannot keep)
    purpose: >-
      Tells a shopper, before and at purchase, the date a package will arrive,
      and makes that date true by construction: a delivery offer is quoted
      only from a feasible witness path (node cutoff, scheduled departures,
      delivery wave) that has remaining capacity, and a promise holds that
      capacity until the order is placed or the hold expires. Judges every
      promise kept or broken.
    roles: [Execution (promising), Analysis (feasibility search), Enforcer (capacity holds)]
    business_decisions:
      - A delivery offer exists only if at least one feasible path exists now; no path means no offer at that tier, with the constraint that blocked it.
      - Fast tiers (SAME_DAY, NEXT_DAY, TWO_DAY) are never quoted from nominal lane times; only STANDARD and CONSOLIDATED may fall back to nominal transit, and the promise records basis NOMINAL. A leg whose measured transit (ADR 0014) exceeds the schedule stretches the arrival and the promise records basis MEASURED.
      - A promise reserves capacity on the node's pickup cutoff (PromiseBook); provisional holds expire if the order is not placed.
      - A promise is per shipment group; a multi-node order gets one promise per group.
      - A poorly performing node is handicapped (later shipBy) by its scorecard grade, never silently excluded.
      - Kept means delivered on or before deliverByLatest.
      - A node that node-performance has suspended from a fast tier is not a candidate for that tier in future quotes and estimates (SAME_DAY and NEXT_DAY only; a missing eligibility row means eligible); promises already made are never touched by it (delivery-promise ADR 0022).
      - An offer reports how full the book behind its window is as a coarse capacityBand; the network publishes the pressure it measures and never computes a fee (delivery-promise ADR 0023).
      - The quote adds a one-sided buffer learned from this service's own kept and broken judgements, and says how sure it is with an optional confidence; with too few judgements it adds nothing and says nothing (delivery-promise ADR 0020).
      - A confirmed promise whose witness-path departure is past its expected arrival with no arrival seen is flagged AT_RISK with reason PREDICTED_LATE while the customer can still be told (delivery-promise ADR 0021).
      - A fifth tier, CONSOLIDATED, is opt-in: a quote returns it only when the request lists it or names a chosen delivery day, so a caller that never asks never sees it; the shopper picks a delivery day at or after the fastest feasible window, and the offer says whether that day leaves the network at least one local day to merge the order with others (consolidationEligible). The estimates route refuses it (delivery-promise ADR 0024).
      - A tracking number may belong to several assignments: one delivery, loss or return of a package judges every promise that shares it, each on its own window (delivery-promise ADR 0025).
    aggregates:
      - name: DeliveryOffer
        root_id: offerId
        description: "A short-lived quote for (catalogue item, quantity, destination postal prefix, tier) with a delivery window, the witness path that proves it, and an expiry."
        states: [QUOTED, EXPIRED, CONSUMED]
        transitions:
          - [QUOTED, CONSUMED, MakePromise]
          - [QUOTED, EXPIRED, ExpireOffers]
        value_objects:
          - "DeliveryWindow{earliest, latest}"
          - "WitnessPath{nodeId, pickupDepartureId, legs[departureId], deliveryWaveId}"
          - "OfferConstraint(DESTINATION_NOT_SERVED|ITEM_QUANTITY_NOT_AVAILABLE|DELIVERY_SLA_UNAVAILABLE|NODE_CAPACITY_EXHAUSTED)"
          - "OfferLine{catalogItemId, quantity, ownerRef ('' = operator-owned)}: the owner OwnerChoice picked at quote time (delivery-promise ADR 0017)"
          - "CapacityBand(AMPLE|TIGHT|SCARCE): utilisation (provisional + confirmed) / share of the book the offer's window would charge, under 60% AMPLE, 60% to under 85% TIGHT, 85% and over SCARCE. A read-only snapshot at quote time: not stored, no column, omitted when the book has no finite capacity and on a stored offer read back; it never changes which offers are produced, their windows or their order (delivery-promise ADR 0023)"
          - "ConsolidatedChoice{consolidatedDeliveryDay (optional request field, a calendar date of the destination station's time zone), consolidationEligible (optional boolean, present only for the tier CONSOLIDATED, never false by default)}: computed locally from the group's own STANDARD candidates, see ConsolidatedTierQuote; stored with the offer (jsonb snapshot) and read back as unknown on a row written before ADR 0024 (delivery-promise ADR 0024)"
          - "Confidence: optional number in [0,1] rounded to 3 decimals, the segment's observed share of judged promises whose lateness was within the buffer the quote carries; present only when the segment has at least minCalibrationObservations in-window judgements, absent means unknown, never zero (delivery-promise ADR 0020)"
        invariants:
          - {rule: "expiresAt <= min(quotedAt + offerTtl, the latest instant the witness pickup cutoff can still be met)", error: ErrOfferExpiryTooLate}
          - {rule: "an expired or consumed offer cannot back a promise", error: ErrOfferNotQuotable}
        commands: [QuoteDeliveryOffers, ExpireOffers, EstimateDeliveries]
        events: []
        notes: "Quotes are high-volume query results; they are persisted with a TTL so checkout can honour them, but publish no integration event (analytics only: DeliveryOfferQuoted on the analytics topic)."
        throughput_estimate: "very high: every product page and cart view"
        size_estimate: "TTL minutes; partitioned by day"
      - name: Promise
        root_id: promiseId
        description: "The network's commitment for one shipment group of one customer order: tier, shipBy at the witness node, deliverBy window, witness path, basis and policy version."
        states: [PROVISIONAL, CONFIRMED, AT_RISK, KEPT, BROKEN, RELEASED, CANCELLED]
        transitions:
          - [PROVISIONAL, CONFIRMED, ConfirmPromise]
          - [PROVISIONAL, RELEASED, ReleaseExpiredHolds]
          - [CONFIRMED, AT_RISK, FlagPromiseAtRisk]
          - [AT_RISK, CONFIRMED, RevisePromise]
          - [CONFIRMED, CONFIRMED, RevisePromise]
          - [CONFIRMED, KEPT, JudgePromise]
          - [AT_RISK, KEPT, JudgePromise]
          - [CONFIRMED, BROKEN, JudgePromise]
          - [AT_RISK, BROKEN, JudgePromise]
          - [CONFIRMED, CANCELLED, CancelPromise]
          - [AT_RISK, CANCELLED, CancelPromise]
        value_objects:
          - "ShipmentGroup{lines[{catalogItemId, quantity, ownerRef ('' = operator-owned; the owner the line was netted against, delivery-promise ADR 0017)}]}"
          - "PromiseTerms{tier (SAME_DAY|NEXT_DAY|TWO_DAY|STANDARD|CONSOLIDATED), shipBy, deliverByEarliest, deliverByLatest, basis(SCHEDULED|MEASURED|NOMINAL), policyVersion, confidence (optional, from the offer's candidate; a revision takes the confidence of the candidate it moves to), consolidationEligible (optional, copied from the offer, CONSOLIDATED only)}"
          - "WitnessPath{nodeId, pickupDepartureId, legs[departureId], deliveryWaveId}"
          - "Revision{revisionNo, previousTerms, reason, revisedAt}"
        invariants:
          - {rule: "deliverByEarliest <= deliverByLatest and shipBy < deliverByEarliest", error: ErrInvalidPromiseTerms}
          - {rule: "a fast-tier promise never has basis NOMINAL (it is SCHEDULED, or MEASURED when ADR 0014 stretched a leg)", error: ErrNominalBasisNotAllowedForTier}
          - {rule: "a provisional promise is confirmed only before holdExpiresAt", error: ErrPromiseHoldExpired}
          - {rule: "a revision never moves deliverByLatest earlier", error: ErrRevisionMovesEarlier}
          - {rule: "KEPT, BROKEN, RELEASED and CANCELLED are terminal", error: ErrPromiseClosed}
          - {rule: "a promise covers lines shippable from one node (ship-complete group)", error: ErrGroupSpansNodes}
        commands: [MakePromise, ConfirmPromise, FlagPromiseAtRisk, RevisePromise, JudgePromise, CancelPromise, ReleaseExpiredHolds]
        events: [PromiseMade, PromiseConfirmed, PromiseAtRisk, PromiseRevised, PromiseKept, PromiseBroken, PromiseReleased, PromiseCancelled]
        throughput_estimate: "medium-high: one per shipment group at checkout"
        size_estimate: "one row per group + revisions"
      - name: PromiseBook
        root_id: "bookId = nodeId + ':' + pickupDepartureId"
        description: "The promise-side capacity ledger of one node pickup cutoff: how many orders the network has promised onto it against the node's declared share. It is opened lazily by the first hold for the pickup, with its share fixed at that moment (policies LazyBookOpening, BookShare), and closed by a clock job at the cutoff (policy CloseBooksAtCutoff)."
        states: [OPEN, CLOSED]
        initial_state: OPEN
        transitions:
          - [OPEN, CLOSED, CloseBook]
        value_objects:
          - "Capacity{share, provisional, confirmed}"
          - "BookTimes{cutoffAt, holdDeadline}; cutoffAt is the pickup departure's cutoff (from DepartureView) and holdDeadline = cutoffAt minus the node's handling time, counted in business minutes"
        invariants:
          - {rule: "provisional + confirmed <= share", error: ErrPromiseCapacityExhausted}
          - {rule: "no hold once the book is CLOSED or from its holdDeadline (the pickup cutoff minus handling time); confirm and release stay legal on a CLOSED book, so an in-flight confirm never fails for the clock", error: ErrBookClosed}
          - {rule: "release never makes provisional or confirmed negative", error: ErrCapacityUnderflow}
        commands: [OpenBook, HoldCapacity, ConfirmCapacity, ReleaseCapacity, CloseBook]
        events: [PromiseBookExhausted]
        throughput_estimate: "high and contended: one hold per promise; one row per (node, cutoff)"
        size_estimate: "nodes x cutoffs x horizon days"
    read_models:
      - {name: NodeProfileView, source: "node-topology NodeRegistered, NodeOperationalProfileDeclared, NodeActivated, NodeSuspended, NodeRetired"}
      - {name: RegionAndServiceAreaView, source: "node-topology ServiceAreaAssigned, RegionDefined"}
      - {name: LaneView, source: "node-topology LaneOpened, LaneClosed"}
      - {name: AvailabilityView, source: "offer-availability ListingCreated, ListingAvailabilityChanged, ListingSuppressed, ListingRestored, CatalogItemCreated, CatalogItemDiscontinued; keyed by (catalogItemId, nodeId, ownerRef), operator-owned stored as '' (absent ownerRef), the asOf monotonic rule per key (delivery-promise ADR 0017)"}
      - {name: DepartureView, source: "linehaul-transportation DepartureScheduled, DepartureCapacityChanged, DepartureCancelled"}
      - {name: TransitActualsView, source: "linehaul-transportation LoadDeparted, LoadArrived (paired by loadId; ADR 0014)"}
      - {name: DeliveryWaveView, source: "last-mile-delivery DeliveryWaveScheduled, DeliveryWaveCapacityChanged"}
      - {name: ScorecardView, source: "node-performance NodeScorecardUpdated"}
      - {name: NodeTierEligibility, source: "node-performance NodeTierEligibilityChanged: rm_node_tier_eligibility(node_id, tier, eligible, changed_at), primary key (node_id, tier), a missing row means ELIGIBLE; an event is applied only when its changedAt is not older than the stored one; an unknown tier or a missing nodeId, tier, eligible or changedAt is ignored and counted, never dead-lettered (delivery-promise ADR 0022)"}
      - {name: DepartureArrival, source: "linehaul-transportation LoadArrived, only when it carries the OPTIONAL departureId (the consumed copy of LoadDeparted and LoadArrived reads departureId when present): rm_departure_arrival(departure_id PK, arrived_at), a first arrival is kept, rows older than the maximum transit window are pruned; an event without departureId writes no row and is counted (delivery-promise ADR 0021)"}
      - {name: PromiseCalibrationView, source: "LOCAL, fed only by this service's own judgements (PromiseKept records 0, PromiseBroken with cause LATE records lateByMinutes; LOST and RETURNED are not recorded), no sibling event and no call: rm_promise_calibration(tier, basis, node_grade, observations), a ring of the last 500 observations per segment key (tier, basis, nodeGrade with the empty grade spelled PROVISIONAL), written in the judgement's unit of work and read pruned to calibrationWindowDays (delivery-promise ADR 0020)"}
      - {name: ShipmentTrackingView, source: "order-sourcing FulfillmentLocked, FulfillmentShipped (tracking numbers per assignment); shipping-and-tracking PackageDelivered, PackageLost, PackageReturned, PackageExceptionRaised, PackageInductionDeferred: rm_trackings is keyed by (tracking_number, assignment_id), so one tracking number may belong to several assignments; AssignmentsOf(trackingNumber) returns their ids ascending, ErrNotFound when there is none; PutShipment adds the pair and never re-owns the number; the outcome row stays one per tracking number and the first final fact wins (delivery-promise ADR 0025)"}
      - {name: PromiseAnalytics, source: "analytical read side (delivery-promise ADR 0018): cmd/dp-projector, the only writer of a SEPARATE analytical database, projects this context's OWN topics only (retailnetwork.delivery-promise.events and .analytics) in one consumer group, deduped in the projection transaction; cmd/dp-reports serves the read-only /reports routes on :8092"}
    policies:
      - {name: PromisePolicy, rule: "earliest feasible witness path; see network-model/promise-model"}
      - {name: ScorecardHandicap, rule: "grade A: +0; B: +handling x 0.25; C: next cutoff; D: two cutoffs later; no scorecard yet: +0"}
      - {name: TierOrderDeadline, rule: "per tier and region a policy-versioned local order deadline (peak control of new workable demand)"}
      - {name: OwnerChoice, rule: "a quoted line must be covered by ONE owner: Available(node, item, owner) >= qty after netting; summing across owners is forbidden. The owner is: operator-owned ('') first if it covers; otherwise the covering seller owner with the highest available after netting; ties go to the lowest ownerRef in byte order; no covering owner means the node is not a candidate for that line (ITEM_QUANTITY_NOT_AVAILABLE). Applied verbatim by order-sourcing too (delivery-promise ADR 0017, gap G47)"}
      - {name: OwnerAwareNetting, rule: "provisional and confirmed holds record the ownerRef they took and net only the figure of their own (node, item, ownerRef) key (ADR 0015 semantics per key); MakePromise re-validates with OwnerChoice and takes another covering owner without a re-quote; on a lock at another node the charge is re-netted with OwnerChoice there, and kept where it was (logged) when no single owner covers"}
      - {name: BatchDeliveryEstimates, rule: "POST /delivery-estimates is SAFE: up to 50 unique items for one destinationPostalPrefix (tiers optional, default the four classic tiers; CONSOLIDATED is refused with 422 validation-failed because an estimate stores nothing), each searched as a single-line group with exactly the quote search (read models, OwnerChoice, netting, scorecard handicap, basis) over one load of the shared inputs per request; answers per item the options (tier, window start/end/timeZone, basis, orderByAt, capacityBand and confidence when known) and constraints in the OfferConstraint vocabulary. Persists nothing (no offer row, hold, outbox row or event); an Idempotency-Key is ignored; an unknown item yields ITEM_QUANTITY_NOT_AVAILABLE. The read-only MCP tool estimate_delivery (authority L1) is bound to the same use case and so carries capacityBand and confidence on each option; there is no MCP quote tool and get_delivery_offer always omits the band (delivery-promise ADR 0019, ADR 0023, gap G60)"}
      - {name: FastTierCandidateFilter, rule: "SAME_DAY and NEXT_DAY candidates are searched only among nodes that NodeTierEligibility does not mark ineligible for that tier; TWO_DAY and STANDARD are never filtered, so the same node stays a candidate for STANDARD including the nominal fallback. The use case loads the ineligible pairs once per search and hands the pure domain a TierIneligible(nodeId, tier) closure (nil never filters). When no candidate remains the tier yields no offer exactly like any infeasible tier (DELIVERY_SLA_UNAVAILABLE; no new constraint code). Applies to quotes and estimates only: re-promising an existing promise (ReviseAtRisk) does not use it and no event moves or flags a promise. The network owns no threshold here: node-performance decides eligibility with hysteresis (delivery-promise ADR 0022, node-performance ADR 0013)"}
      - {name: CapacityBand, rule: "capacityBand = AMPLE | TIGHT | SCARCE from shared.CapacityBandFor(used, share) over the book the offer's chosen window would charge (used = provisional + confirmed): SCARCE when used x 100 >= share x 85, TIGHT when used x 100 >= share x 60, otherwise AMPLE; share of zero or less means no band; a book not yet opened is AMPLE. The thresholds are domain constants, not PromisePolicy fields. Computed at quote time for SCHEDULED, MEASURED and NOMINAL candidates, carried on the offer, on each POST /delivery-estimates option, on the estimate_delivery MCP output and on DeliveryOfferQuoted, not stored, not an input to ranking. The network never computes a fee; the storefront reads the band from the response it already receives (delivery-promise ADR 0023)"}
      - {name: PromiseCalibration, rule: "ADR 0020: for each candidate the search adds the segment's buffer to the final-arrival time BEFORE the delivery window is snapped, so the window width never changes and the offer lands in a later fixed window when needed (a candidate that no longer fits the horizon is dropped like any infeasible one). Buffer = Calibrate(observations, policy): with n at least minCalibrationObservations the smallest b such that at least targetOnTimeProbabilityPercent of the observations have lateBy <= b (nearest rank, kept promises count 0), capped at maxCalibrationBufferMinutes; ONE-SIDED, never earlier; below the minimum the buffer is 0 and the search behaves as before. Applied to every tier including STANDARD. The segment is (tier, basis, nodeGrade of the candidate's node read from ScorecardView); the destination region is not in the key because it is not stored on the promise. One global target value, not one per tier. A store error is logged and means no calibration, never a failed quote. confidence is reported only when n reaches the minimum. Metrics: histogram promising.calibration.buffer (tier) and counter promising.calibration.segments_below_minimum"}
      - {name: FlagPredictedLate, rule: "ADR 0021: the clock-driven sweeper pass FlagPredictedLate(ctx, limit) examines each CONFIRMED promise's witness-path departures (the pickup departure and the legs; a NOMINAL witness has none): expectedArrival = arrivesAt plus the same one-sided measured-transit adjustment the search uses (0 below minTransitObservations); when now is later than expectedArrival plus lateRiskGrace (15 minutes, a constant, not a policy field) and DepartureArrival has no row for the departure, the promise is flagged AT_RISK with reason PREDICTED_LATE through the existing flagAtRisk path, one INFO log and the counter deliverypromise_predicted_late_flagged_total per flag. RepriceAtRisk does NOT re-promise a PREDICTED_LATE promise while its window is still reachable (the latest remaining expected arrival shifted by the late leg's observed lateness, plus the downstream sort dwell and the wave's last-mile allowance, no later than the window end; a missing, cancelled or unscheduled wave means not reachable); otherwise the normal re-promise runs and never moves the window earlier. DELIBERATE LIMIT: the flag is not cleared when the load arrives later (AT_RISK stays Active until the judgement closes the promise); an event without departureId is ignored by the arrival model and counted"}
      - {name: ShipmentGrouping, rule: "prefer one node for the whole cart; split only when no single node covers every line, minimising the number of groups"}
      - {name: RepromiseOnRisk, rule: "on FulfillmentUnsourceable, PackageExceptionRaised, a cancelled departure on the witness path or the FlagPredictedLate sweep (only when the window is no longer reachable, see FlagPredictedLate), recompute and RevisePromise; if nothing is feasible even at STANDARD, report PromiseBroken at judgement time"}
      - {name: JudgeOnDelivery, rule: "on PackageDelivered judge every promise of the package's group, and every promise that shares the package's tracking number (SharedTrackingJudgement)"}
      - {name: ConsolidatedTierQuote, rule: "ADR 0024. CONSOLIDATED is the fifth tier: shared.AllTiers() stays the four classic tiers (the default quote set), shared.KnownTiers() returns five, Rank orders it last, MaxCalendarDays is 14 (MaxConsolidatedCalendarDays), AllowsNominal is true for STANDARD and CONSOLIDATED, and a re-promise never falls through from one of them to the other. It is returned ONLY when the quote request lists it in tiers or names consolidatedDeliveryDay; a present day adds CONSOLIDATED to whatever set tiers names. Local construction with no sibling call: fastest = the minimum window latest of the group's STANDARD candidates (none: the tier is unavailable, DELIVERY_SLA_UNAVAILABLE, or NODE_CAPACITY_EXHAUSTED when the same search without the capacity checks would find one); the chosen local day D of the destination station is the request's day, else DefaultConsolidatedOffsetDays (2) after the local day of fastest, clamped UP to the local day of fastest; a D more than 14 local days from now is DELIVERY_SLA_UNAVAILABLE. Candidates are the usual pickups and paths, with the final wave the earliest usable wave whose induct cutoff is not before the arrival and whose window END falls on local day D (a pickup with none is dropped); with no scheduled candidate the NOMINAL fallback gives the window D 09:00 to 21:00 local. Rank: the usual order, then the LATER shipBy first (the longest hold), then fewer legs, better grade, node id. A CONSOLIDATED promise has no TierOrderDeadline, its calibration segment is its own (buffer 0 until it has minCalibrationObservations) and fast-tier eligibility does not govern it. The read models load MaxConsolidatedCalendarDays plus 1 days instead of the 8-day SearchHorizon when the tier is asked for"}
      - {name: ConsolidationEligibility, rule: "ADR 0024: consolidationEligible = (D is at least MinConsolidationHoldDays (1) local days after the local day of the fastest window). It is false when D is the fastest day, and a false offer is still quotable: the shopper chose the fastest day and the network has nothing to hold. It is computed from this service's own candidate set and never asserts that another order exists. Present on the offer, the promise terms, DeliveryOfferQuoted and PromiseMade only for the tier CONSOLIDATED; omitted otherwise and never false by default"}
      - {name: ConsolidatedRepromise, rule: "ADR 0024: ReviseAtRisk of a CONSOLIDATED promise searches only CONSOLIDATED, with the local date of the promise window latest as a MINIMUM day: the search walks forward day by day up to the horizon and the existing rule takes the first candidate that does not move deliverByLatest earlier and whose book accepts the hold; none is PromiseUnkeepable as today. A day without a scheduled wave falls back to a NOMINAL window of that day, so a cancelled wave is re-promised on the same day on a NOMINAL basis rather than moved to a later day. The chosen day is not a stored field: it is the local day of the promise window"}
      - {name: SharedTrackingJudgement, rule: "ADR 0025: after PutOutcome, recordOutcome judges the union of the event's assignmentId and AssignmentsOf(trackingNumber), each through the existing judge, so one PackageDelivered on a merged package judges every sharing promise and one PackageLost or PackageReturned breaks every one (cause LOST or RETURNED). A group is judged when ALL of its shipped tracking numbers have outcomes. Each promise is judged on its OWN window: one delivery can keep one promise and break the other with LATE. The order of facts does not matter (a delivery recorded against the tracking number judges a member when its own FulfillmentLocked or FulfillmentShipped arrives) and a replay is idempotent. PackageExceptionRaised and PackageInductionDeferred that carry a tracking number flag every assignment that shares it AT_RISK; departure-level signals are untouched. CAPACITY IS DELIBERATELY OVER-CHARGED: each promise keeps its own PromiseBook charge, so a merged package charges one order of capacity per promise while linehaul books one package (a conservative over-charge; the capacity band may read TIGHT a little early)"}
      - {name: LazyBookOpening, rule: "a PromiseBook is opened (OpenBook) by the first HoldCapacity for a (node, pickup departure); MakePromise opens the book, holds it, consumes the offer and creates the promise in one local transaction. The book takes cutoffAt from the pickup departure, holdDeadline = cutoffAt minus handling time (business minutes) and a share computed once by BookShare"}
      - {name: BookShare, rule: "share = ceil(min(CutoffSlot.maxOrders, throughputCap x window) x capacitySharePercent / 100), at least 1. maxOrders applies only when the cutoff slot sets it. window is the node's operating time between its previous cutoff and this one: a HOUR cap gives value x minutes / 60 and a DAY cap value x minutes / operating minutes of the cutoff's day. capacitySharePercent is a PromisePolicy field (default 100). Every hold that makes provisional + confirmed equal to share raises PromiseBookExhausted"}
      - {name: CloseBooksAtCutoff, rule: "a clock job closes every OPEN book at its cutoffAt (CloseBook). Holds are already refused from holdDeadline, before the job runs, and confirm and release stay legal on a CLOSED book"}
      - {name: PromisePolicyParameters, rule: "the versioned PromisePolicy record (POST /promise-policies, event PromisePolicyPublished) carries policyVersion ('v' + version), version, offerTtlMinutes, holdTtlMinutes, packagesPerOrder, capacitySharePercent, transitWindowDays (default 28), transitServiceLevelPercent (default 90), minTransitObservations (default 20), the calibration fields of ADR 0020 targetOnTimeProbabilityPercent (default 95, 50..99, ONE value for every tier), minCalibrationObservations (default 50, 10..10000), calibrationWindowDays (default 28, 1..365) and maxCalibrationBufferMinutes (default 720, 0..2880; 0 switches the buffer off and keeps the confidence), orderDeadlines[{tier, regionId?, localTime}] and publishedAt. The current policy is the highest version. Without a published policy version 0 applies: offerTtl 10, holdTtl 15, packagesPerOrder 1, capacitySharePercent 100, transitWindowDays 28, transitServiceLevelPercent 90, minTransitObservations 20, targetOnTimeProbabilityPercent 95, minCalibrationObservations 50, calibrationWindowDays 28, maxCalibrationBufferMinutes 720, no deadlines. holdExpiresAt = now + holdTtlMinutes; each order needs packagesPerOrder packages of room on the pickup and on every linehaul departure of the witness path"}
      - {name: MeasuredTransit, rule: "ADR 0014: TransitActualsView pairs LoadDeparted/LoadArrived by loadId into observed transits per (origin, destination) (ring of 200, read-side pruned to transitWindowDays). When a pair has at least minTransitObservations in-window observations and its transitServiceLevelPercent nearest-rank transit exceeds a departure leg's scheduled transit (arrivesAt - departsAt), the leg's arrival becomes arrivesAt + (measured - scheduled): one-sided, measured transit never promises earlier than the timetable. A candidate whose witness path used at least one measured adjustment is quoted basis MEASURED; the pickup leg counts as a departure leg; below minTransitObservations the timetable stands"}
    inbound:
      - {from: customer-ordering, type: qry, channel: "REST POST /delivery-quotes (in-org)", routes: ["POST /delivery-quotes"], message: "QuoteDeliveryOffers", relationship: Customer/Supplier}
      - {from: customer-ordering, type: cmd, channel: "REST POST /promises, POST /promises/{promiseId}/confirmations, POST /promises/{promiseId}/cancellations (in-org)", routes: ["POST /promises", "POST /promises/{promiseId}/confirmations", "POST /promises/{promiseId}/cancellations"], message: "MakePromise, ConfirmPromise, CancelPromise", relationship: Customer/Supplier}
      - {from: shopper / storefront, type: qry, channel: "REST POST /delivery-quotes", routes: ["POST /delivery-quotes"], message: "QuoteDeliveryOffers", relationship: OHS}
      - {from: shopper / storefront, type: qry, channel: "REST POST /delivery-estimates (listing pages; safe, non-persisted)", routes: ["POST /delivery-estimates"], message: "EstimateDeliveries", relationship: OHS}
      # caller inferred: ADR 0018 names the report questions, not a client; the routes are served by cmd/dp-reports on :8092, not cmd/api
      - {from: network analysts (human), type: qry, channel: "REST GET /reports/promise-reliability, GET /reports/promise-precision, GET /reports/quote-conversion, GET /reports/freshness (cmd/dp-reports, :8092)", routes: ["GET /reports/promise-reliability", "GET /reports/promise-precision", "GET /reports/quote-conversion", "GET /reports/freshness"], message: "GetPromiseReliabilityReport, GetPromisePrecisionReport, GetQuoteConversionReport, GetReportFreshness", relationship: UI}
      # caller inferred: the spec names no caller for these three reads; attributed to the actor of the sibling quote route
      - {from: shopper / storefront, type: qry, channel: "REST GET /delivery-offers/{offerId}, GET /promises/{promiseId}, GET /promises?orderId=", routes: ["GET /delivery-offers/{offerId}", "GET /promises/{promiseId}", "GET /promises"], message: "GetDeliveryOffer, GetPromise, ListPromisesByOrder", relationship: OHS}
      # caller inferred: the spec and ADR 0002 A21 name no caller; a policy is published by network operations, not by a service or the storefront
      - {from: network-ops planner, type: cmd, channel: "REST POST /promise-policies", routes: ["POST /promise-policies"], message: "PublishPromisePolicy", relationship: UI}
      # caller inferred: the spec names no caller; operational reads of policy and capacity books
      - {from: network-ops planner, type: qry, channel: "REST GET /promise-policies/current, GET /promise-books?nodeId=&date=", routes: ["GET /promise-policies/current", "GET /promise-books"], message: "GetCurrentPromisePolicy, ListPromiseBooks", relationship: UI}
      - {from: customer-ordering, type: evt, channel: "Kafka retailnetwork.customer-ordering.events", message: "CustomerOrderPlaced, CustomerOrderCancelled", relationship: Customer/Supplier}
      - {from: order-sourcing, type: evt, channel: "Kafka retailnetwork.order-sourcing.events", message: "FulfillmentUnsourceable, FulfillmentLocked", relationship: Customer/Supplier}
      - {from: shipping-and-tracking, type: evt, channel: "Kafka retailnetwork.shipping-and-tracking.events", message: "PackageDelivered, PackageExceptionRaised", relationship: Conformist}
      - {from: linehaul-transportation, type: evt, channel: "Kafka retailnetwork.linehaul-transportation.events (the consumed LoadDeparted and LoadArrived read the optional departureId, delivery-promise ADR 0021)", message: "DepartureScheduled, DepartureCapacityChanged, DepartureCancelled, LoadDeparted, LoadArrived", relationship: Conformist}
      - {from: last-mile-delivery, type: evt, channel: "Kafka retailnetwork.last-mile-delivery.events", message: "DeliveryWaveScheduled, DeliveryWaveCapacityChanged", relationship: Conformist}
      - {from: node-topology, type: evt, channel: "Kafka retailnetwork.node-topology.events", message: "NodeRegistered, NodeOperationalProfileDeclared, NodeActivated, NodeSuspended, NodeRetired, LaneOpened, LaneClosed, ServiceAreaAssigned, RegionDefined", relationship: Conformist}
      - {from: offer-availability, type: evt, channel: "Kafka retailnetwork.offer-availability.events", message: "CatalogItemCreated, CatalogItemDiscontinued, ListingCreated, ListingAvailabilityChanged, ListingSuppressed, ListingRestored", relationship: Conformist}
      - {from: node-performance, type: evt, channel: "Kafka retailnetwork.node-performance.events", message: "NodeScorecardUpdated, NodeTierEligibilityChanged", relationship: Conformist}
