      - {event: NodeOperationalProfileDeclared, from: node-topology}
      - {event: NodeActivated, from: node-topology}
      - {event: NodeSuspended, from: node-topology}
      - {event: NodeRetired, from: node-topology}
      - {event: LaneOpened, from: node-topology}
      - {event: LaneClosed, from: node-topology}
      - {event: LaneCostDeclared, from: node-topology}
      - {event: ServiceAreaAssigned, from: node-topology}
      - {event: RegionDefined, from: node-topology}
      - {event: ListingCreated, from: offer-availability}
      - {event: ListingAvailabilityChanged, from: offer-availability}
      - {event: ListingSuppressed, from: offer-availability}
      - {event: ListingRestored, from: offer-availability}
      - {event: CatalogItemDiscontinued, from: offer-availability}
      - {event: DepartureScheduled, from: linehaul-transportation}
      - {event: DepartureCapacityChanged, from: linehaul-transportation}
      - {event: DepartureCancelled, from: linehaul-transportation}
      - {event: DeliveryWaveScheduled, from: last-mile-delivery}
      - {event: WaveCostDeclared, from: last-mile-delivery}
      - {event: DeliveryWaveCapacityChanged, from: last-mile-delivery}
      - {event: NodeScorecardUpdated, from: node-performance}
      - {event: DeliveryWaveCancelled, from: last-mile-delivery}
      - {event: BookingFailed, from: linehaul-transportation}
      - {event: BookingMoved, from: linehaul-transportation}
    sync_calls: []
    ul:
      - {term: Fulfillment Assignment, definition: "The decision of which node and path fulfil one shipment group.", code: "assignment.FulfillmentAssignment"}
      - {term: Virtual Queue, definition: "Where assignments wait, re-optimisable, until their release point.", code: "assignment.VirtualQueue"}
      - {term: Release (to node), definition: "Sending a group to one node; for a vendor node this issues a purchase order.", code: "assignment.Release"}
      - {term: Path Lock, definition: "The point after which an assignment never changes node: the vendor's acceptance.", code: "assignment.Lock"}
      - {term: Reassignment, definition: "Moving a group to another node after a refusal, or while still queued.", code: "assignment.Reassign"}
      - {term: Sourcing Policy, definition: "The operator's versioned lever over cross-region cost and consolidation: a surcharge in cents, a deviation percent and a cap on merged groups; version 0 is the default and changes nothing.", code: "policy.Policy"}
      - {term: Effective Cost, definition: "The estimated cost of a candidate plus the policy's cross-region surcharge; the leading key of the comparator.", code: "sourcing.Option.EffectiveCostCents"}
      - {term: Carrier, definition: "The QUEUED assignment whose release is due and which carries a consolidation merge: one purchase order, one label and one tracking number carry its id.", code: "assignment.Assignment.Members"}
      - {term: Follower, definition: "A QUEUED assignment absorbed into a carrier's release; it keeps its own events and locks, ships and delivers with the carrier.", code: "assignment.Assignment.ConsolidatedInto"}
      - {term: Consolidation Merge, definition: "The carrier and its followers released as one; it exists only from release until the lock or until it is dissolved.", code: "sourcing.Merge"}
      - {term: Unsourceable, definition: "No node can still meet the promise; the group goes back to delivery-promise.", code: "assignment.StateUnsourceable"}

  # =========================================================================
  - id: vendor-connectivity
    name: Vendor Connectivity
    code: VC
    tier: partner
    classification: Supporting
    chart: {differentiation: 0.36, complexity: 0.46, evolution: Product}
    business_model: Revenue-channel enabler (third-party capacity without integration cost)
    purpose: >-
      The network's Open Host Service for vendors that operate fulfillment
      nodes. Publishes the Vendor API and its Published Language: vendors
      register nodes, declare their operational profile, send inventory
      feeds, poll purchase orders, acknowledge them in full inside the
      acknowledgement window, request labels and confirm shipment. It also
      lets a vendor poll the inbound shipments sellers are sending to its
      nodes (a carton manifest) and submit a carton-level receipt for each.
      Every write is an asynchronous transaction a vendor reconciles.
    roles: [Gateway / Open Host Service, Execution (purchase-order protocol and its clock)]
    business_decisions:
      - "Acknowledge once, in full, before ackBy: fill-or-kill; partial acknowledgements are refused."
      - "ackBy = min(issuedAt + vendor ackWindow, requiredShipBy - node handlingTime)."
      - A label is issued only for an ACCEPTED purchase order; a shipment is confirmed only after a label.
      - "Every vendor write returns 202 with a transactionId; the write takes effect when its transaction succeeds."
      - The Vendor API never carries ship-to PII.
      - Rate limits are part of the contract (429 with Retry-After).
    aggregates:
      - name: VendorAccount
        root_id: vendorId
        description: "A vendor organisation, its ack window, rate limits and the nodes it may operate."
        states: [ACTIVE, SUSPENDED]
        transitions: [[ACTIVE, SUSPENDED, SuspendVendor], [SUSPENDED, ACTIVE, ReinstateVendor]]
        invariants:
          - {rule: "ackWindow between 1h and 24h", error: ErrAckWindowOutOfRange}
          - {rule: "a vendor acts only on its own nodes", error: ErrNodeNotOwnedByVendor}
        commands: [OnboardVendor, SuspendVendor, ReinstateVendor]
        events: [VendorOnboarded]
        throughput_estimate: "rare"
        size_estimate: "tens"
      - name: PurchaseOrder
        root_id: poNumber
        description: "The network's instruction to one vendor node to ship one shipment group in full by requiredShipBy."
        states: [ISSUED, ACK_PROCESSING, ACCEPTED, REJECTED, EXPIRED, SHIPMENT_PROCESSING, SHIPPED, CANCELLED]
        transitions:
          - [ISSUED, ACK_PROCESSING, SubmitAcknowledgement]
          - [ACK_PROCESSING, ACCEPTED, ProcessSubmission]
          - [ACK_PROCESSING, REJECTED, ProcessSubmission]
          - [ACK_PROCESSING, ISSUED, ProcessSubmission]
          - [ISSUED, EXPIRED, ExpireUnacknowledgedOrders]
          - [ACCEPTED, SHIPMENT_PROCESSING, SubmitShipmentConfirmation]
          - [SHIPMENT_PROCESSING, SHIPPED, ProcessSubmission]
          - [SHIPMENT_PROCESSING, ACCEPTED, ProcessSubmission]
          - [ISSUED, CANCELLED, CancelPurchaseOrder]
        value_objects:
          - "PoLine{lineNo, listingId, quantity, ownerRef ('' = operator-owned; copied from FulfillmentReleasedToNode lines[].ownerRef, omitted on the Vendor API and PurchaseOrderIssued when empty; vendor-connectivity ADR 0012)}"
          - "AckDecision(ACCEPT|REJECT){reasonCode}"
          - "Label{labelRef, trackingNumber, carrier}"
          - "RejectReason(OUT_OF_STOCK|UNKNOWN_LISTING|CANNOT_MEET_SHIP_BY|DISCONTINUED)"
        invariants:
          - {rule: "an acknowledgement covers every line with one decision (fill-or-kill)", error: ErrPartialAcknowledgement}
          - {rule: "acknowledged at most once", error: ErrAlreadyAcknowledged}
          - {rule: "no acknowledgement after ackBy", error: ErrAckWindowClosed}
          - {rule: "no label before ACCEPTED", error: ErrLabelBeforeAcceptance}
          - {rule: "no shipment confirmation without a label for every package", error: ErrConfirmWithoutLabel}
          - {rule: "cancel only while ISSUED", error: ErrCancelAfterAcknowledgement}
        commands: [IssuePurchaseOrder, SubmitAcknowledgement, RequestLabel, SubmitShipmentConfirmation, ExpireUnacknowledgedOrders, CancelPurchaseOrder]
        events: [PurchaseOrderIssued, PurchaseOrderAccepted, PurchaseOrderRejected, PurchaseOrderExpired, PurchaseOrderCancelled, VendorShipmentConfirmed]
        throughput_estimate: "medium; polling reads dominate"
        size_estimate: "one row per release to a vendor node"
      - name: Submission
        root_id: transactionId
        description: "One asynchronous vendor write (acknowledgement, inventory feed, node registration, profile declaration, shipment confirmation, inbound receipt) and its processing outcome."
        states: [PROCESSING, SUCCESS, FAILURE]
        transitions: [[PROCESSING, SUCCESS, ProcessSubmission], [PROCESSING, FAILURE, ProcessSubmission]]
        value_objects: ["SubmissionKind(ACKNOWLEDGEMENT|INVENTORY|NODE_REGISTRATION|NODE_PROFILE|SHIPMENT_CONFIRMATION|INBOUND_RECEIPT)", "SubmissionError{code, message, path}"]
        invariants:
          - {rule: "outcome set once", error: ErrSubmissionAlreadyProcessed}
          - {rule: "processing never starts before notBefore = receivedAt + simulated processing delay", error: ErrSubmissionNotDue}
          - {rule: "an INBOUND_RECEIPT names a shipment in InboundShipmentView addressed to a node of the submitting vendor; an unknown vendor, shipment or node is not-found (404), a node of another vendor stays ErrNodeNotOwnedByVendor (vendor-connectivity ADR 0005)", error: ErrNotFound}
        commands: [ReceiveSubmission, ProcessSubmission, SubmitInboundReceipt]
        events: [SubmissionProcessed, InboundReceiptSubmitted]
        throughput_estimate: "medium-high"
        size_estimate: "retained 30 days"
    read_models:
      - {name: VendorNodeView, source: "node-topology NodeRegistered, NodeActivated, NodeSuspended, NodeRetired"}
      - {name: ListingView, source: "offer-availability ListingCreated"}
      - {name: InboundShipmentView, source: "seller-inbound InboundShipmentLabelled, InboundShipmentShipped, InboundShipmentReceived"}
      - {name: CatalogPackagingView, source: "offer-availability CatalogItemPackagingDeclared, CatalogItemPackLevelRetired"}
    policies:
      - {name: IssueOnRelease, rule: "on FulfillmentReleasedToNode for a VENDOR node, issue a purchase order (poNumber is idempotent on assignmentId + releaseNo)"}
      - {name: PurchaseOrderOfMergedRelease, rule: "a merged FulfillmentReleasedToNode (carrier id, the union lines in member order with no lineNo, an optional members array and a per-line assignmentId) needs no code change: the tolerant decoder ignores members and the per-line assignmentId, so ONE purchase order is issued under the carrier's assignmentId, orderId, groupNo and tier, its lines are numbered by position (1..n), a listingId that two members both ordered appears on two lines (duplicates are legal) and each line keeps its own ownerRef. The release carries the carrier's fulfilment class (STANDARD for a consolidated group), so the tier validator never sees a fifth tier. The vendor sees one package; the Vendor API is unchanged (vendor-connectivity ADR 0013)"}
      - {name: CancelOnReleaseWithdrawn, rule: "on FulfillmentReleaseWithdrawn (assignmentId, releaseNo, orderId, groupNo, reason, withdrawnAt) look the order up by (assignmentId, releaseNo), never by the latest release, so a withdraw that arrives after the carrier was released again cannot cancel the new order: not found is a no-op; an ISSUED order is cancelled (CancelPurchaseOrder) with the reason 'release withdrawn: ' + the event reason (sanitised and capped at 200 characters like every cancel reason) and raises PurchaseOrderCancelled in the same transaction; any other state is logged at INFO and acknowledged (ErrCancelAfterAcknowledgement when the vendor already accepted, ErrIllegalTransition for rejected, expired or cancelled). The reason is carried as an opaque string; this context does not branch on it. The existing FulfillmentCancelled policy cannot serve because a withdrawn release does not cancel the carrier assignment, which is released again under the next release number (vendor-connectivity ADR 0013)"}
      - {name: PoLineNamesTheOwner, rule: "each purchase-order line carries the ownerRef of its released line (absent or empty = operator-owned), persisted on the line and exposed, optional and additive, on GET /vendor/purchase-orders, GET /vendor/purchase-orders/{poNumber} and PurchaseOrderIssued. Acknowledgement, cancellation, labels and shipment confirmation ignore it. KNOWN RESIDUAL: the fleet's network-fulfillment does not read it yet, so seller-owned lines are still picked without owner segregation (vendor-connectivity ADR 0012, gap G47)"}
      - {name: CancelOnSourcingCancel, rule: "on FulfillmentCancelled cancel the purchase order of the assignment's highest releaseNo (CancelPurchaseOrder; no order is a no-op). If the vendor has already acknowledged it, CancelPurchaseOrder fails with ErrCancelAfterAcknowledgement, which is logged at INFO: nothing is published and the event is not retried, because order-sourcing decides the cancel and learns the order's fate from PurchaseOrderAccepted. Known residual: an acceptance that arrives after order-sourcing cancelled a RELEASED assignment is only logged there (order-sourcing policy AcceptanceAfterCancelOnlyLogged)"}
      - {name: ExpireUnacknowledged, rule: "sweep: ISSUED past ackBy -> EXPIRED"}
      - {name: ReceiptRelay, rule: "when an INBOUND_RECEIPT submission is accepted, append InboundReceiptSubmitted (subject and key shipmentId) to the outbox in the same unit of work, so a 202 always has its event (vendor-connectivity ADR 0005); SubmissionProcessed still reports the processing. The receipt is not applied to the shipment here, seller-inbound owns that"}
      - {name: SimulationKnobs, rule: "TX_PROCESSING_DELAY, TX_FAILURE_RATE, RATE_LIMIT_RPS, PO_REDELIVERY_RATE; all default to well-behaved"}
    inbound:
      - {from: "network-fulfillment (warehouse-systems, vendor V-WS)", type: cmd, channel: "Vendor API POST /vendor/nodes, PUT /vendor/nodes/{nodeId}/profile, POST /vendor/inventory, POST /vendor/acknowledgements, POST /vendor/shipping-labels, POST /vendor/shipment-confirmations, POST /vendor/inbound-receipts", routes: ["POST /vendor/nodes", "PUT /vendor/nodes/{nodeId}/profile", "POST /vendor/inventory", "POST /vendor/acknowledgements", "POST /vendor/shipping-labels", "POST /vendor/shipment-confirmations", "POST /vendor/inbound-receipts"], message: "RegisterVendorNode, DeclareNodeProfile, SubmitInventory, SubmitAcknowledgement, RequestLabel, SubmitShipmentConfirmation, SubmitInboundReceipt", relationship: "OHS + PL (downstream is Conformist + ACL)"}
      - {from: "network-fulfillment (warehouse-systems, vendor V-WS)", type: qry, channel: "Vendor API GET /vendor/purchase-orders, GET /vendor/purchase-orders/{poNumber}, GET /vendor/transactions/{transactionId}, GET /vendor/nodes, GET /vendor/nodes/{nodeId}, GET /vendor/nodes/{nodeId}/scorecard, GET /vendor/inbound-shipments, GET /vendor/inbound-shipments/{shipmentId}", routes: ["GET /vendor/purchase-orders", "GET /vendor/purchase-orders/{poNumber}", "GET /vendor/transactions/{transactionId}", "GET /vendor/nodes", "GET /vendor/nodes/{nodeId}", "GET /vendor/nodes/{nodeId}/scorecard", "GET /vendor/inbound-shipments", "GET /vendor/inbound-shipments/{shipmentId}"], message: "PollPurchaseOrders, GetPurchaseOrder, GetTransaction, ListVendorNodes, GetNode, GetScorecard, PollInboundShipments, GetInboundShipment", relationship: "OHS + PL"}
      - {from: "network partner managers (human)", type: cmd, channel: "REST POST /vendors, POST /vendors/{vendorId}:suspend, POST /vendors/{vendorId}:reinstate", routes: ["POST /vendors", "POST /vendors/{vendorId}:suspend", "POST /vendors/{vendorId}:reinstate"], message: "OnboardVendor, SuspendVendor, ReinstateVendor", relationship: UI}
      - {from: "network partner managers (human)", type: qry, channel: "REST GET /vendors/{vendorId}", routes: ["GET /vendors/{vendorId}"], message: "GetVendor", relationship: UI}
      - {from: order-sourcing, type: evt, channel: "Kafka retailnetwork.order-sourcing.events", message: "FulfillmentReleasedToNode, FulfillmentCancelled, FulfillmentReleaseWithdrawn", relationship: Customer/Supplier}
      - {from: node-topology, type: evt, channel: "Kafka retailnetwork.node-topology.events", message: "NodeRegistered, NodeActivated, NodeSuspended, NodeRetired", relationship: Conformist}
      - {from: offer-availability, type: evt, channel: "Kafka retailnetwork.offer-availability.events", message: "ListingCreated", relationship: Conformist}
      - {from: offer-availability, type: evt, channel: "Kafka retailnetwork.offer-availability.events", message: "CatalogItemPackagingDeclared, CatalogItemPackLevelRetired", relationship: Conformist}
      - {from: seller-inbound, type: evt, channel: "Kafka retailnetwork.seller-inbound.events", message: "InboundShipmentLabelled, InboundShipmentShipped, InboundShipmentReceived", relationship: Customer/Supplier}
    rest:
      - "GET /vendor/purchase-orders?createdAfter=&nodeId=&nextToken="
      - "GET /vendor/purchase-orders/{poNumber}"
      - "POST /vendor/acknowledgements"
      - "POST /vendor/inventory"
      - "POST /vendor/nodes"
      - "GET /vendor/nodes/{nodeId}"
      - "PUT /vendor/nodes/{nodeId}/profile"
      - "GET /vendor/nodes/{nodeId}/scorecard"
      - "POST /vendor/shipping-labels"
      - "POST /vendor/shipment-confirmations"
      - "GET /vendor/inbound-shipments?nodeId=&createdAfter=&nextToken="
      - "GET /vendor/inbound-shipments/{shipmentId}"
      - "POST /vendor/inbound-receipts"
      - "GET /vendor/transactions/{transactionId}"
      - "POST /vendors"
      - "GET /vendor/nodes"
      - "GET /vendors/{vendorId}"
      - "POST /vendors/{vendorId}:suspend"
      - "POST /vendors/{vendorId}:reinstate"
    publishes:
      - {event: VendorOnboarded, entity: vendoraccount, data: [vendorId, name, ackWindowMinutes], consumers: [node-performance]}
      - {event: PurchaseOrderIssued, entity: purchaseorder, data: [poNumber, vendorId, nodeId, assignmentId, releaseNo, requiredShipBy, ackBy, "lines(lineNo, listingId, quantity, ownerRef (optional, omitted when operator-owned))"], consumers: [node-performance]}
      - {event: PurchaseOrderAccepted, entity: purchaseorder, data: [poNumber, assignmentId, releaseNo, nodeId, acceptedAt, transactionId], consumers: [order-sourcing, node-performance]}
      - {event: PurchaseOrderRejected, entity: purchaseorder, data: [poNumber, assignmentId, releaseNo, nodeId, reasonCode, rejectedAt], consumers: [order-sourcing, node-performance]}
      - {event: PurchaseOrderExpired, entity: purchaseorder, data: [poNumber, assignmentId, releaseNo, nodeId, ackBy], consumers: [order-sourcing, node-performance]}
      - {event: PurchaseOrderCancelled, entity: purchaseorder, data: [poNumber, assignmentId, reason], consumers: [analytics only]}
      - {event: VendorShipmentConfirmed, entity: purchaseorder, data: [poNumber, assignmentId, nodeId, trackingNumbers, shippedAt, requiredShipBy], consumers: [order-sourcing, shipping-and-tracking, node-performance]}
      - {event: SubmissionProcessed, entity: submission, data: [transactionId, vendorId, kind, status, errorCount], consumers: [node-performance]}
      - {event: InboundReceiptSubmitted, entity: inboundreceipt, data: [transactionId, vendorId, nodeId, shipmentId, receivedAt, cartons(sscc, status, items(gtin, qtyEaches), complianceCodes)], consumers: [seller-inbound, node-performance]}
      - {event: VendorSuspended, entity: vendoraccount, data: [vendorId, suspendedAt, reason], consumers: [analytics only]}
      - {event: VendorReinstated, entity: vendoraccount, data: [vendorId, reinstatedAt], consumers: [analytics only]}
    reasons:
      - name: RejectReason
        fields: [PurchaseOrderRejected.reasonCode, "rest:RejectReason", "rest:Acknowledgement.reasonCode"]
        about: "Why a vendor node rejected a purchase order. Required when the decision is REJECT."
        values:
          - {value: OUT_OF_STOCK, meaning: "The node cannot cover the ordered quantity."}
          - {value: UNKNOWN_LISTING, meaning: "The node does not know the ordered listing."}
          - {value: CANNOT_MEET_SHIP_BY, meaning: "The node cannot hand the package over by the required ship-by instant."}
          - {value: DISCONTINUED, meaning: "The item is discontinued at the node."}
    consumes:
      - {event: FulfillmentReleasedToNode, from: order-sourcing}
      - {event: FulfillmentCancelled, from: order-sourcing}
      - {event: FulfillmentReleaseWithdrawn, from: order-sourcing}
      - {event: NodeRegistered, from: node-topology}
      - {event: NodeActivated, from: node-topology}
      - {event: NodeSuspended, from: node-topology}
      - {event: NodeRetired, from: node-topology}
      - {event: ListingCreated, from: offer-availability}
      - {event: NodeOperationalProfileDeclared, from: node-topology}
      - {event: InboundShipmentLabelled, from: seller-inbound}
      - {event: InboundShipmentShipped, from: seller-inbound}
      - {event: InboundShipmentReceived, from: seller-inbound}
      - {event: CatalogItemPackagingDeclared, from: offer-availability}
      - {event: CatalogItemPackLevelRetired, from: offer-availability}
    sync_calls:
      - {to: node-topology, type: cmd, message: "RegisterNode, DeclareOperationalProfile", channel: "REST POST /nodes, PUT /nodes/{nodeId}/operational-profile"}
      - {to: offer-availability, type: cmd, message: ApplyInventoryFeed, channel: "REST POST /inventory-feeds"}
      - {to: shipping-and-tracking, type: cmd, message: IssueLabel, channel: "REST POST /labels"}
      - {to: node-performance, type: qry, message: GetScorecard, channel: "REST GET /scorecards/{nodeId}"}
    ul:
      - {term: Vendor, definition: "An organisation operating fulfillment nodes for the network (the warehouse-systems fleet is vendor V-WS).", code: "vendor.VendorAccount"}
      - {term: Purchase Order (PO), definition: "The instruction to one vendor node to ship one shipment group in full by requiredShipBy.", code: "po.PurchaseOrder"}
      - {term: Acknowledgement, definition: "The vendor's single, whole-order accept or reject.", code: "po.AckDecision"}
      - {term: Ack Window / ackBy, definition: "The deadline for the acknowledgement.", code: "po.PurchaseOrder.AckBy"}
      - {term: Required Ship-By, definition: "The pickup cutoff the PO must be ready for; the fleet calls it the CPT.", code: "po.PurchaseOrder.RequiredShipBy"}
      - {term: Submission / Transaction, definition: "An asynchronous vendor write and its outcome, reconciled by transactionId.", code: "submission.Submission"}
      - {term: Label, definition: "labelRef + trackingNumber + carrier; never the address.", code: "po.Label"}
      - {term: Vendor API, definition: "The Open Host Service of this context; its JSON schemas are the Published Language.", code: "apis/vendor-connectivity/openapi.yaml"}
      - {term: Inbound Receipt, definition: "A vendor's carton-level report of what arrived for one inbound shipment: per SSCC a status, the eaches received per GTIN and any compliance codes.", code: "inbound.Receipt"}

  # =========================================================================
  - id: linehaul-transportation
    name: Linehaul Transportation
    code: LH
    tier: logistics
    classification: Supporting
    chart: {differentiation: 0.47, complexity: 0.48, evolution: Custom-built}
    business_model: Cost reducer (cost-to-serve) and speed enabler
    purpose: >-
      Runs the middle mile: turns lanes into scheduled departures (including
      a pickup departure at every vendor node cutoff), keeps each departure's
      remaining capacity, builds loads of packages onto departures, and
      reports when loads depart and arrive.
    roles: [Execution (schedules and loads), Specification (capacity)]
    business_decisions:
      - Every declared cutoff of an ACTIVE vendor fulfillment node gets one pickup departure per operating day.
      - A departure's booked packages never exceed its capacity.
      - A package is on at most one open load at a time.
      - A cancelled departure is announced before its cutoff wherever possible, so promises can be revised.
    aggregates:
      - name: Departure
        root_id: departureId
        description: "One scheduled trip on one lane: cutoff, departure, arrival and package capacity. A PICKUP departure starts at a vendor node."
        states: [SCHEDULED, CLOSED, DEPARTED, ARRIVED, CANCELLED]
        transitions:
          - [SCHEDULED, CLOSED, CloseDeparture]
          - [CLOSED, DEPARTED, RecordDeparture]
          - [DEPARTED, ARRIVED, RecordArrival]
          - [SCHEDULED, CANCELLED, CancelDeparture]
        value_objects: ["DepartureKind(PICKUP|LINEHAUL|AIR)", "Capacity{packages, booked}", "Times{cutoffAt, departsAt, arrivesAt}", "NodeTypes{originNodeType, destinationNodeType}; stored when the departure is scheduled (policy NodeTypeSnapshot)"]
        invariants:
          - {rule: "cutoffAt <= departsAt < arrivesAt", error: ErrInvalidDepartureTimes}
          - {rule: "booked <= capacity", error: ErrDepartureFull}
          - {rule: "the lane is OPEN when scheduling", error: ErrLaneClosed}
          - {rule: "no booking after cutoffAt", error: ErrDepartureClosed}
        commands: [ScheduleDeparture, BookCapacity, ReleaseCapacity, CloseDeparture, RecordDeparture, RecordArrival, CancelDeparture]
        events: [DepartureScheduled, DepartureCapacityChanged, DepartureCancelled, DepartureDeparted, DepartureArrived]
        throughput_estimate: "high on capacity changes"
        size_estimate: "lanes x trips/day x horizon (14 days)"
      - name: LaneSchedule
        root_id: laneId
        description: "The weekly template that generates departures for one lane (or the node cutoffs for a pickup lane)."
        states: [ACTIVE, RETIRED]
        transitions: [[ACTIVE, RETIRED, RetireLaneSchedule]]
        invariants:
          - {rule: "template slots do not overlap on the same lane", error: ErrOverlappingSlots}
        commands: [DefineLaneSchedule, RetireLaneSchedule, GenerateDepartures]
        events: []
        throughput_estimate: "low"
        size_estimate: "one per lane"
      - name: Load
        root_id: loadId
        description: "The packages physically consolidated onto one departure at its origin node."
        states: [OPEN, CLOSED, DEPARTED, ARRIVED]
        transitions:
          - [OPEN, CLOSED, CloseLoad]
          - [CLOSED, DEPARTED, DispatchLoad]
          - [DEPARTED, ARRIVED, ReceiveLoad]
        value_objects: ["DepartureSnapshot{departureKind, originNodeType, destinationNodeType, capacity}; copied from the departure by OpenLoad and never changed (policy NodeTypeSnapshot)"]
        invariants:
          - {rule: "a package is on at most one OPEN or CLOSED load", error: ErrPackageAlreadyLoaded}
          - {rule: "package count <= the capacity snapshot taken at OpenLoad", error: ErrLoadOverCapacity}
        commands: [OpenLoad, AddPackage, CloseLoad, DispatchLoad, ReceiveLoad]
        events: [LoadClosed, LoadDeparted, LoadArrived]
        throughput_estimate: "high (per package add)"
        size_estimate: "one per departure"
    read_models:
      - {name: NodeProfileView, source: "node-topology NodeRegistered, NodeOperationalProfileDeclared, NodeActivated, NodeSuspended, NodeRetired"}
      - {name: LaneView, source: "node-topology LaneOpened, LaneClosed"}
      - {name: ExpectedVolumeView, source: "order-sourcing FulfillmentReleasedToNode, FulfillmentReassigned, FulfillmentLocked, FulfillmentCancelled; shipping-and-tracking LabelIssued. A FulfillmentLocked that carries consolidatedInto (a follower of a merge) writes no row"}
    policies:
      - {name: PickupFromCutoffs, rule: "on NodeOperationalProfileDeclared (re)generate PICKUP departures for every cutoff of the horizon; on NodeSuspended/NodeRetired cancel future pickups"}
      - {name: BookOnLock, rule: "on FulfillmentLocked book one package on the pickup departure; on FulfillmentCancelled or reassignment release it. A lock that carries consolidatedInto books nothing (FollowerLockBooksNothing)"}
      - {name: FollowerLockBooksNothing, rule: "order-sourcing publishes one FulfillmentLocked per member of a merge; a follower's lock carries the optional consolidatedInto (the carrier's assignment id) and every merged member carries mergedAssignmentIds. HandleLocked decodes consolidatedInto tolerantly; when it is set the CloudEvents id is claimed in the inbox (same transaction as every consumer) and nothing else happens: no ExpectedVolume row, no booking, no DepartureCapacityChanged, BookingMoved or BookingFailed, and a redelivery stops at the inbox claim. The carrier's lock books ONE package like an unmerged assignment, and rebooking, BookingMoved and BookingFailed are raised for the carrier id only (order-sourcing fans BookingMoved out to the followers on its side). mergedAssignmentIds is ignored: consolidatedInto alone decides. Absence means unmerged, and no order between the follower's and the carrier's lock is assumed. A follower dissolved from its merge before the lock is re-queued and books as any other assignment later. One merged package therefore occupies one package of pickup capacity (linehaul-transportation ADR 0014)"}
      - {name: HorizonRoll, rule: "nightly GenerateDepartures keeps a 14-day horizon"}
      - {name: NodeTypeSnapshot, rule: "a departure stores the node types of its origin and destination when it is scheduled, and OpenLoad copies departureKind, both node types and the capacity onto the load. LoadDeparted therefore carries departureKind and nodeType = the type of the origin node, and LoadArrived carries departureKind and nodeType = the type of the destination node, with no lookup. The wire field is nodeType, not destinationNodeType; shipping-and-tracking uses it to tell a pickup departure from a linehaul one and a delivery station from a sort centre"}
      - {name: DefaultOutboundLane, rule: "node-topology declares no default outbound lane, so the pickup's lane is the node's OPEN GROUND lane that ranks first by destination type (SORTATION_CENTER before any other known type, before an unknown one), then lowest nominalTransitMinutes, then lowest laneId. With no such lane no pickup is planned until a lane opens"}
      - {name: PickupCapacity, rule: "a pickup departure's capacityPackages = capacityOrders x packagesPerOrder. capacityOrders = max(1, min(CutoffSlot.maxOrders if set, throughputCap over the window)), where the window runs from the node's previous cutoff of the same day (its opening time for the first) to this cutoff, at least 60 minutes: a HOUR cap gives value x minutes / 60 and a DAY cap value x minutes / operating minutes of the day, rounded down. packagesPerOrder is linehaul-transportation's own setting (default 1, 1..1000), because node-topology declares none"}
    inbound:
      # caller inferred for POST /lane-schedules/{laneId}:retire only (sibling of DefineLaneSchedule); change-capacity is named a planner command in the spec
      - {from: network-ops planner, type: cmd, channel: "REST POST /lane-schedules, POST /lane-schedules/{laneId}:retire, POST /departures/{departureId}:cancel, POST /departures/{departureId}:change-capacity", routes: ["POST /lane-schedules", "POST /lane-schedules/{laneId}:retire", "POST /departures/{departureId}:cancel", "POST /departures/{departureId}:change-capacity"], message: "DefineLaneSchedule, RetireLaneSchedule, CancelDeparture, ChangeDepartureCapacity", relationship: UI}
      - {from: "sort-centre and station operators (human/scanner)", type: cmd, channel: "REST POST /loads, POST /loads/{loadId}/packages, POST /loads/{loadId}:close, POST /loads/{loadId}:dispatch, POST /loads/{loadId}:receive", routes: ["POST /loads", "POST /loads/{loadId}/packages", "POST /loads/{loadId}:close", "POST /loads/{loadId}:dispatch", "POST /loads/{loadId}:receive"], message: "OpenLoad, AddPackage, CloseLoad, DispatchLoad, ReceiveLoad", relationship: UI}
      # caller inferred for GET /departures/{departureId} only (sibling of the any-context list read)
      - {from: any context, type: qry, channel: "REST GET /departures?origin=&destination=&from=&to=, GET /departures/{departureId}", routes: ["GET /departures", "GET /departures/{departureId}"], message: "ListDepartures, GetDeparture", relationship: OHS}
      - {from: node-topology, type: evt, channel: "Kafka retailnetwork.node-topology.events", message: "NodeRegistered, NodeOperationalProfileDeclared, NodeActivated, NodeSuspended, NodeRetired, LaneOpened, LaneClosed", relationship: Conformist}
      - {from: order-sourcing, type: evt, channel: "Kafka retailnetwork.order-sourcing.events", message: "FulfillmentReleasedToNode, FulfillmentReassigned, FulfillmentLocked, FulfillmentCancelled", relationship: Customer/Supplier}
      - {from: shipping-and-tracking, type: evt, channel: "Kafka retailnetwork.shipping-and-tracking.events", message: "LabelIssued", relationship: Conformist}
    rest:
      - "POST /lane-schedules"
      - "POST /lane-schedules/{laneId}:retire"
      - "GET /departures?origin=&destination=&from=&to="
      - "GET /departures/{departureId}"
      - "POST /departures/{departureId}:cancel"
      - "POST /loads"
      - "POST /loads/{loadId}/packages"
      - "POST /loads/{loadId}:close"
      - "POST /loads/{loadId}:dispatch"
      - "POST /loads/{loadId}:receive"
      - "POST /departures/{departureId}:change-capacity"
    publishes:
      - {event: DepartureScheduled, entity: departure, data: [departureId, laneId, kind, originNodeId, destinationNodeId, cutoffAt, departsAt, arrivesAt, capacityPackages], consumers: [delivery-promise, order-sourcing]}
      - {event: DepartureCapacityChanged, entity: departure, data: [departureId, capacityPackages, bookedPackages, remainingPackages], consumers: [delivery-promise, order-sourcing]}
      - {event: DepartureCancelled, entity: departure, data: [departureId, reason, cancelledAt], consumers: [delivery-promise, order-sourcing]}
      - {event: DepartureDeparted, entity: departure, data: [departureId, departedAt], consumers: [analytics only]}
      - {event: DepartureArrived, entity: departure, data: [departureId, arrivedAt], consumers: [analytics only]}
      - {event: LoadClosed, entity: load, data: [loadId, departureId, packageCount], consumers: [analytics only]}
      - {event: LoadDeparted, entity: load, data: [loadId, departureId, originNodeId, trackingNumbers, departedAt, departureKind, nodeType], consumers: [shipping-and-tracking, delivery-promise]}
      - {event: LoadArrived, entity: load, data: [loadId, departureId, destinationNodeId, trackingNumbers, arrivedAt, departureKind, nodeType], consumers: [shipping-and-tracking, last-mile-delivery, delivery-promise]}
      - {event: BookingMoved, entity: departure, data: [assignmentId, fromDepartureId, toDepartureId], consumers: [delivery-promise, order-sourcing]}
      - {event: BookingFailed, entity: departure, data: [assignmentId, departureId, reason], consumers: [delivery-promise, order-sourcing]}
    reasons:
      - name: BookingFailedReason
        fields: [BookingFailed.reason]
        about: "Why a package could not be booked on a departure (ADR 0002 A14); the value is the reason of the first failure."
        values:
          - {value: DEPARTURE_UNKNOWN, meaning: "The departure named by the lock is not known to the service."}
          - {value: DEPARTURE_CANCELLED, meaning: "The departure is CANCELLED."}
          - {value: DEPARTURE_CLOSED, meaning: "The departure is no longer SCHEDULED, or its cutoff has passed."}
          - {value: DEPARTURE_FULL, meaning: "The departure has no remaining capacity."}
    consumes:
      - {event: NodeRegistered, from: node-topology}
      - {event: NodeOperationalProfileDeclared, from: node-topology}
      - {event: NodeActivated, from: node-topology}
      - {event: NodeSuspended, from: node-topology}
      - {event: NodeRetired, from: node-topology}
      - {event: LaneOpened, from: node-topology}
      - {event: LaneClosed, from: node-topology}
      - {event: FulfillmentReleasedToNode, from: order-sourcing}
      - {event: FulfillmentReassigned, from: order-sourcing}
      - {event: FulfillmentLocked, from: order-sourcing}
      - {event: FulfillmentCancelled, from: order-sourcing}
      - {event: LabelIssued, from: shipping-and-tracking}
      - {event: LabelVoided, from: shipping-and-tracking}
    sync_calls: []
    ul:
      - {term: Middle Mile, definition: "Transport between nodes: vendor node to sortation centre, sortation centre to delivery station, air.", code: "(context)"}
      - {term: Departure, definition: "One scheduled trip on a lane with a cutoff and a capacity.", code: "departure.Departure"}
      - {term: Pickup Departure, definition: "The departure that collects packages at a vendor node at one of its declared cutoffs.", code: "departure.KindPickup"}
      - {term: Default Outbound Lane, definition: "The lane a pickup departure uses, chosen by linehaul-transportation among the node's open ground lanes (sort centre first, then shortest nominal transit, then lowest lane id); node-topology declares none.", code: "schedule.DefaultOutboundLane"}
      - {term: Load, definition: "The packages consolidated onto one departure.", code: "load.Load"}
      - {term: Lane Schedule, definition: "The weekly template that generates a lane's departures.", code: "schedule.LaneSchedule"}

  # =========================================================================
  - id: last-mile-delivery
    name: Last-Mile Delivery
    code: LM
    tier: logistics
    classification: Supporting
    chart: {differentiation: 0.40, complexity: 0.40, evolution: Custom-built}
    business_model: Cost reducer and experience creator (the doorstep)
    purpose: >-
      Runs each delivery station: publishes delivery waves (induct cutoff,
      delivery window, stop capacity) that the promise relies on, plans routes
      for delivery service partners, and records every delivery attempt.
    roles: [Execution (routes and attempts), Specification (wave capacity)]
    business_decisions:
      - A package joins the earliest wave whose induct cutoff it arrived before and that has stop capacity left.
      - A route never exceeds its van's stop capacity.
      - A package is delivered at most once; a failed attempt returns it to the station for the next wave.
      - At route start every stop gets a day-of ETA window of at most two hours, spread linearly over what is left of the wave's delivery window. It is a deterministic spread, not a prediction (this context holds no travel-time data and no stop sequencer), it never revises a promise, and it is never retracted.
      - A delivery point that accumulates two counted failed attempts inside 60 days is flagged to the network. The point is identified only by the opaque stopKey; the flag changes no route, no ETA and no promise (last-mile-delivery ADR 0014).
    aggregates:
      - name: DeliveryWave
        root_id: waveId
        description: "One dispatch wave of one delivery station on one service date."
        states: [OPEN, INDUCTION_CLOSED, DISPATCHED, COMPLETED, CANCELLED]
        transitions:
          - [OPEN, INDUCTION_CLOSED, CloseInduction]
          - [INDUCTION_CLOSED, DISPATCHED, DispatchWave]
          - [DISPATCHED, COMPLETED, CompleteWave]
          - [OPEN, CANCELLED, CancelWave]
        value_objects: ["Window{start, end}", "StopCapacity{stops, assigned}"]
        invariants:
          - {rule: "inductCutoffAt < windowStart < windowEnd", error: ErrInvalidWaveTimes}
          - {rule: "assigned stops <= stops, where assigned stops counts the distinct stopKeys among the wave's inductions", error: ErrWaveFull}
          - {rule: "no package joins after induction closes", error: ErrInductionClosed}
        commands: [ScheduleWave, InductPackage, CloseInduction, DispatchWave, CompleteWave, CancelWave]
        events: [DeliveryWaveScheduled, DeliveryWaveCapacityChanged, DeliveryWaveCancelled]
        throughput_estimate: "medium"
        size_estimate: "stations x waves/day x horizon"
      - name: Route
        root_id: routeId
        description: "One delivery service partner's van route within one wave: ordered stops."
        states: [PLANNED, OUT_FOR_DELIVERY, COMPLETED]
        transitions: [[PLANNED, OUT_FOR_DELIVERY, StartRoute], [OUT_FOR_DELIVERY, COMPLETED, CompleteRoute]]
        entities: ["Stop{stopNo, trackingNumbers[], outcome}", "Attempt{trackingNumber, outcome, outcomeDetail (optional), failureReason, at}"]
        invariants:
          - {rule: "stops <= van capacity of the partner", error: ErrRouteOverCapacity}
          - {rule: "an attempt is recorded only on an OUT_FOR_DELIVERY route", error: ErrRouteNotStarted}
          - {rule: "a package is delivered at most once", error: ErrAlreadyDelivered}
          - {rule: "the packages of one stop share one stopKey", error: ErrStopKeyMismatch}
          - {rule: "outcomeDetail, when reported, pairs with the outcome: FAILED carries NOT_HOME, ACCESS_PROBLEM or OTHER, DELIVERED carries SAFE_PLACE_USED; empty means not reported (a legacy client) and never replaces failureReason", error: ErrValidation}
        commands: [PlanRoute, StartRoute, RecordAttempt, CompleteRoute]
        events: [RoutePlanned, PackageOutForDelivery, StopEtaWindowAssigned, DeliveryAttempted]
        throughput_estimate: "high (per stop)"
        size_estimate: "routes per wave"
      - name: DeliveryServicePartner
        root_id: dspId
        description: An independent delivery business contracted to a station, with its vans.
        states: [ACTIVE, INACTIVE]
        invariants:
          - {rule: "van capacity > 0", error: ErrInvalidVanCapacity}
        commands: [ContractPartner]
        events: []
        throughput_estimate: "rare"
        size_estimate: "small"
      - name: DeliveryPointProfile
        root_id: stopKey
        description: "The learning record of one delivery point, keyed by the opaque stopKey of the label (never an address): outcome tallies and a ring of counted-failure strikes, folded in inside RecordAttempt's unit of work (last-mile-delivery ADR 0014). Dormant until the driver client reports outcomeDetail."
        value_objects:
          - "Strike{routeId, trackingNumber, category, at, notified}: one counted failure of one route visit; at most MaxStrikes (5) in the ring"
        invariants:
          - {rule: "attempts = delivered + failedNotHome + failedAccess + failedOther, where OTHER and not reported both tally as failedOther (ErrValidation on Observe, ErrInvalidSnapshot on Restore)", error: ErrValidation}
          - {rule: "safePlaceUsed <= delivered; at most MaxStrikes (5) strikes, each a counted category (NOT_HOME or ACCESS_PROBLEM), no two with one routeId", error: ErrValidation}
          - {rule: "flaggedAt is non-zero exactly when FlagAfterStrikes (2) or more strikes are open inside the StrikeWindow (60 days); a DELIVERED attempt ends the episode unless the delivering visit itself has a strike", error: ErrValidation}
          - {rule: "the stopKey is valid and does not start with pkg: (a package with no label data has no address key and gets no profile)", error: ErrValidation}
        commands: [Observe]
        events: [DeliveryPointFlagged]
        throughput_estimate: "one Observe per attempt"
        size_estimate: "one small row per distinct delivery point"
    read_models:
      - {name: StationView, source: "node-topology NodeRegistered, ServiceAreaAssigned"}
      - {name: InboundPackagesView, source: "linehaul-transportation LoadArrived"}
      - {name: PackageStopView, source: "shipping-and-tracking LabelIssued (trackingNumber, stopKey, destinationPostalPrefix, assignmentId)"}
      - {name: LastMileAnalytics, source: "analytical read side (last-mile-delivery ADR 0012): cmd/lm-projector, the only writer of a SEPARATE analytical database, projects this context's OWN topics only (retailnetwork.last-mile-delivery.events and .analytics, RoutePlanned included) in one consumer group, deduped in the projection transaction; cmd/lm-reports serves the read-only /reports routes on :8092. ADR 0013 adds the stop_eta_windows fact (one row per package of a StopEtaWindowAssigned, migration 0002) and the GET /reports/eta-window report: per UTC day of the DELIVERED attempt and per station, deliveriesWithEta, deliveriesInsideEta, deliveriesBeforeEta, deliveriesAfterEta and etaHitRate = inside / withEta (null when no delivery had an ETA); only the attempt that DELIVERED counts, and a delivered package whose ETA row was never projected is not in the denominator. DeliveryPointFlagged is acknowledged without a fact"}
    policies:
      - {name: InductOnArrival, rule: "on LoadArrived at a delivery station induct every package into the earliest eligible wave"}
      - {name: RetryNextWave, rule: "a FAILED attempt re-inducts the package into the next wave; three failures return it to sender"}
      - {name: GroupByStopKey, rule: "packages are grouped into stops by the stopKey of LabelIssued, never by an address. Wave capacity counts stops: assignedStops is the number of distinct stopKeys among the wave's inductions, so a package for a stop already in the wave adds no stop and raises no DeliveryWaveCapacityChanged. A package with no label data is its own stop (key pkg: followed by the tracking number)"}
      - {name: NoAddressAtLastMile, rule: "last-mile-delivery never receives an address: it holds a stopKey and a postal prefix only, and no address route exists (shipping-and-tracking policy NoAddressRoute). How the driver learns the address is not decided"}
      - {name: EtaWindowAtRouteStart, rule: "StartRoute raises one StopEtaWindowAssigned per stop, after every PackageOutForDelivery, in the same transaction and under the same Kafka key (the routeId): the stops are spread linearly over what is left of the wave's delivery window (from max(now, windowStart) to windowEnd), each stop a window of at most two hours truncated to the minute; when less than 30 minutes of the wave window is left at the start instant no event is raised (counted skipped, reason window_elapsed) and the route starts normally. The CloudEvents time is the route start instant; an ETA is never retracted, never re-raised for the same start, and a re-inducted package gets a new one from its next StartRoute. Nothing is persisted on the route and GET /routes/{routeId} shows no window: the events and the analytics read side are the record (last-mile-delivery ADR 0013)"}
      - {name: DeliveryPointProfileLearns, rule: "RecordAttempt folds the attempt, in the same unit of work, into the DeliveryPointProfile of the stop's stopKey: the outcome detail is tallied, only NOT_HOME and ACCESS_PROBLEM count as failures (one strike per route visit, however many packages failed), strikes decay lazily 60 days back at the next observation, and while two or more are open the packages not yet told are marked notified and raise ONE DeliveryPointFlagged carrying only their tracking numbers. The feature is dormant until the driver client reports outcomeDetail: until then every attempt is tallied as not reported, no strike is counted and no event is raised. A flagged point changes no route, no ETA and no promise, and no address, name, phone or free text is copied into the profile (failureReason stays out). The read-only exposure decided in ADR 0014 (a delivery-point route and a summary on the wave stops) is not built yet"}
    inbound:
      # caller inferred for close-induction, cancel, POST /partners and :deactivate (ADR 0003 names only the station planner and the driver app as UI callers; sibling of the wave and route commands)
      - {from: "station planner (human)", type: cmd, channel: "REST POST /waves, POST /waves/{waveId}:close-induction, POST /waves/{waveId}:dispatch, POST /waves/{waveId}:cancel, POST /routes, POST /partners, POST /partners/{dspId}:deactivate", routes: ["POST /waves", "POST /waves/{waveId}:close-induction", "POST /waves/{waveId}:dispatch", "POST /waves/{waveId}:cancel", "POST /routes", "POST /partners", "POST /partners/{dspId}:deactivate"], message: "ScheduleWave, CloseInduction, DispatchWave, CancelWave, PlanRoute, ContractPartner, DeactivatePartner", relationship: UI}
      # caller inferred for GET /waves; the spec says the planner builds PlanRoute from the stops list
      - {from: "station planner (human)", type: qry, channel: "REST GET /waves, GET /waves/{waveId}/stops", routes: ["GET /waves", "GET /waves/{waveId}/stops"], message: "ListWaves, GetWaveStops", relationship: UI}
      - {from: delivery service partner driver app, type: cmd, channel: "REST POST /routes/{routeId}:start, POST /routes/{routeId}/attempts", routes: ["POST /routes/{routeId}:start", "POST /routes/{routeId}/attempts"], message: "StartRoute, RecordAttempt", relationship: UI}
      # caller inferred: the spec names no caller; the driver app records the attempts the route read returns
      - {from: delivery service partner driver app, type: qry, channel: "REST GET /routes/{routeId}", routes: ["GET /routes/{routeId}"], message: "GetRoute", relationship: UI}
      - {from: linehaul-transportation, type: evt, channel: "Kafka retailnetwork.linehaul-transportation.events", message: "LoadArrived", relationship: Customer/Supplier}
      - {from: node-topology, type: evt, channel: "Kafka retailnetwork.node-topology.events", message: "NodeRegistered, ServiceAreaAssigned", relationship: Conformist}
      # caller inferred: ADR 0012 names the report questions, not a client; the routes are served by cmd/lm-reports on :8092, not cmd/api
      - {from: network analysts (human), type: qry, channel: "REST GET /reports/route-efficiency, GET /reports/attempt-outcomes, GET /reports/eta-window, GET /reports/wave-utilisation, GET /reports/freshness (cmd/lm-reports, :8092)", routes: ["GET /reports/route-efficiency", "GET /reports/attempt-outcomes", "GET /reports/eta-window", "GET /reports/wave-utilisation", "GET /reports/freshness"], message: "GetRouteEfficiencyReport, GetAttemptOutcomesReport, GetEtaWindowReport, GetWaveUtilisationReport, GetReportFreshness", relationship: UI}
    rest:
      - "POST /waves"
      - "GET /waves?stationNodeId=&serviceDate="
      - "POST /waves/{waveId}:close-induction"
      - "POST /waves/{waveId}:dispatch"
      - "POST /routes"
      - "POST /routes/{routeId}:start"
      - "POST /routes/{routeId}/attempts"
      - "POST /partners"
      - "GET /waves/{waveId}/stops"
      - "POST /waves/{waveId}:cancel"
      - "GET /routes/{routeId}"
      - "POST /partners/{dspId}:deactivate"
      - "GET /reports/route-efficiency?from=&to="
      - "GET /reports/attempt-outcomes?from=&to="
      - "GET /reports/eta-window?from=&to="
      - "GET /reports/wave-utilisation?from=&to="
      - "GET /reports/freshness"
    publishes:
      - {event: DeliveryWaveScheduled, entity: wave, data: [waveId, stationNodeId, serviceDate, inductCutoffAt, windowStart, windowEnd, stopCapacity], consumers: [delivery-promise, order-sourcing]}
      - {event: WaveCostDeclared, entity: wave, data: [waveId, costPerStopCents, declaredAt], consumers: [order-sourcing]}
      - {event: DeliveryWaveCapacityChanged, entity: wave, data: [waveId, stopCapacity, assignedStops, remainingStops], consumers: [delivery-promise, order-sourcing]}
      - {event: DeliveryWaveCancelled, entity: wave, data: [waveId, reason], consumers: [delivery-promise, order-sourcing]}
      - {event: RoutePlanned, entity: route, data: [routeId, waveId, dspId, stopCount], consumers: [analytics only]}
      - {event: PackageOutForDelivery, entity: route, data: [routeId, trackingNumber, stationNodeId, at], consumers: [shipping-and-tracking]}
      - {event: StopEtaWindowAssigned, entity: route, data: [routeId, stopNo, stopKey, trackingNumbers, etaStart, etaEnd], consumers: [shipping-and-tracking]}
      - {event: DeliveryAttempted, entity: route, data: [routeId, trackingNumber, outcome, outcomeDetail, failureReason, at], consumers: [shipping-and-tracking]}
      - {event: PackageInductionDeferred, entity: packageattempthistory, data: [trackingNumber, assignmentId], consumers: [delivery-promise]}
      - {event: PackageReturnInitiated, entity: packageattempthistory, data: [trackingNumber], consumers: [shipping-and-tracking]}
      - {event: DeliveryPointFlagged, entity: deliverypointprofile, data: [stopKey, reason, failures, trackingNumbers, flaggedAt], consumers: [shipping-and-tracking]}
    reasons:
      - name: DeliveryAttemptOutcome
        fields: [DeliveryAttempted.outcome, "rest:Outcome", "rest:Attempt.outcome"]
        about: "The result of one delivery attempt of one package. A FAILED attempt carries a failureReason of free text, which is not listed here; the optional category is the DeliveryAttemptOutcomeDetail vocabulary below."
        values:
          - {value: DELIVERED, meaning: "The package was handed over."}
          - {value: FAILED, meaning: "The package was not handed over; failureReason is required."}
        consumers:
          - {context: shipping-and-tracking, uses: [DELIVERED, FAILED], rule: "DELIVERED becomes a DELIVERED scan; any other outcome becomes a DELIVERY_FAILED scan."}
      - name: DeliveryAttemptOutcomeDetail
        fields: [DeliveryAttempted.outcomeDetail, "rest:OutcomeDetail", "rest:RecordAttemptRequest.outcomeDetail", "rest:Attempt.outcomeDetail"]
        about: "The optional category of an attempt, reported by the driver client and dormant until one does (last-mile-delivery ADR 0014). Empty means not reported (a legacy client), which is not the same as OTHER; a detail never replaces failureReason. FAILED carries NOT_HOME, ACCESS_PROBLEM or OTHER; DELIVERED carries SAFE_PLACE_USED; any other pairing is 422 validation-failed. Only NOT_HOME and ACCESS_PROBLEM count as failures on the DeliveryPointProfile."
        values:
          - {value: NOT_HOME, meaning: "Failed: nobody was at the point to receive the package. A counted failure."}
          - {value: ACCESS_PROBLEM, meaning: "Failed: the point could not be reached or entered. A counted failure."}
          - {value: SAFE_PLACE_USED, meaning: "Delivered: the package was left in an agreed safe place."}
          - {value: OTHER, meaning: "Failed: a category outside the closed list. Tallied, never counted as a strike."}
        consumers: []   # no consumer reads it: shipping-and-tracking's tolerant decoding ignores the unknown field, and the profile that counts it is last-mile-delivery's own
    consumes:
      - {event: LoadArrived, from: linehaul-transportation}
      - {event: NodeRegistered, from: node-topology}
      - {event: ServiceAreaAssigned, from: node-topology}
      - {event: LabelIssued, from: shipping-and-tracking}
    sync_calls: []
    ul:
      - {term: Last Mile, definition: "From the delivery station to the customer's door.", code: "(context)"}
      - {term: Delivery Wave, definition: "A station's dispatch slot: induct cutoff, delivery window and stop capacity.", code: "wave.DeliveryWave"}
      - {term: Induction, definition: "Placing an arrived package into a wave.", code: "wave.InductPackage"}
      - {term: Route, definition: "One van's ordered stops in one wave.", code: "route.Route"}
      - {term: Stop, definition: "The packages of one route that share one stop key; wave capacity is counted in stops.", code: "route.Stop"}
      - {term: Delivery Service Partner (DSP), definition: "An independent delivery business working for a station.", code: "partner.DeliveryServicePartner"}
      - {term: Delivery Attempt, definition: "One try to hand a package over: DELIVERED or FAILED with a reason, and an optional outcomeDetail category the driver client reports (ADR 0014).", code: "route.Attempt"}
      - {term: Stop ETA Window, definition: "The day-of delivery window of one stop of a started route: at most two hours, spread linearly over what is left of the wave's delivery window at the start instant. A deterministic spread, not a prediction; never retracted.", code: "route.StopEta"}
      - {term: Delivery Point Profile, definition: "The learning record of one delivery point (an opaque stop key, never an address): outcome tallies and counted-failure strikes. Two counted failures inside 60 days flag the point; the flag changes no route, no ETA and no promise.", code: "deliverypoint.DeliveryPointProfile"}

  # =========================================================================
  - id: shipping-and-tracking
    name: Shipping & Tracking
    code: ST
    tier: logistics
    classification: Generic
    chart: {differentiation: 0.22, complexity: 0.62, evolution: Commodity}
    business_model: Compliance / experience (labels and the tracking timeline)
    purpose: >-
      Issues shipping labels (the only place outside customer-ordering that
      ever sees a ship-to address) and owns each package's journey: one
      customer-visible timeline consolidated from vendor handover, load and
      delivery facts, ending in delivered, returned or lost.
    roles: [Execution (labels), Analysis (timeline)]
    business_decisions:
      - A tracking number is unique network-wide and is issued once per package.
      - The address printed on the label is fetched from customer-ordering at issue time and never published. Only an opaque stopKey and a postal prefix leave this context.
      - The ship-to snapshot is purged 30 days after its journey closes.
      - The journey only moves forward; a duplicate or out-of-order scan is recorded, not applied.
      - A package not scanned within its expected window is raised as an exception.
    aggregates:
      - name: ShippingLabel
        root_id: labelRef
        description: "The label for one package: tracking number, service tier, and the encrypted ship-to snapshot needed to print it. The snapshot is kept apart from the label row and purged 30 days after the journey closes (policy ShipToRetention)."
        states: [ISSUED, VOIDED]
        transitions: [[ISSUED, VOIDED, VoidLabel]]
        value_objects:
          - "StopKey: opaque hex keyed hash (HMAC-SHA-256 under a service secret) of the normalized ship-to address, derived at IssueLabel (policy StopKeyAtLabelTime)"
          - "DestinationPostalPrefix: the first 5 letters or digits of the normalized postal code (the whole code when shorter)"
          - "ShipToSnapshot{labelRef, nonce, ciphertext, keyId, createdAt}; AES-256-GCM, never returned or published, purged by PurgeShipTo"
        invariants:
          - {rule: "one label per (poNumber, packageNo)", error: ErrLabelAlreadyIssued}
          - {rule: "trackingNumber unique", error: ErrTrackingNumberTaken}
        commands: [IssueLabel, VoidLabel, PurgeShipTo]
        events: [LabelIssued, LabelVoided]
        throughput_estimate: "medium"
        size_estimate: "one per package"
      - name: PackageJourney
        root_id: trackingNumber
        description: "The customer-visible timeline of one package."
        states: [LABELLED, HANDED_OVER, IN_TRANSIT, AT_STATION, OUT_FOR_DELIVERY, DELIVERED, RETURNED, LOST]
        transitions:
          - [LABELLED, HANDED_OVER, RecordScan]
          - [HANDED_OVER, IN_TRANSIT, RecordScan]
          - [HANDED_OVER, AT_STATION, RecordScan]
          - [IN_TRANSIT, IN_TRANSIT, RecordScan]
          - [IN_TRANSIT, AT_STATION, RecordScan]
          - [AT_STATION, OUT_FOR_DELIVERY, RecordScan]
          - [OUT_FOR_DELIVERY, AT_STATION, RecordScan]
          - [OUT_FOR_DELIVERY, DELIVERED, RecordScan]
          - [AT_STATION, RETURNED, ReturnToSender]
          - [IN_TRANSIT, LOST, DeclareLost]
        entities: ["Scan{scanId, nodeId, scanType, at}"]
        value_objects:
          - "EtaWindow{etaStart, etaEnd, etaAssignedAt}: the day-of window stored by AssignEta (migration 0003) and the point flag {pointFlagReason, pointFlaggedAt} stored by FlagDeliveryPoint (migration 0004); neither is a scan, neither moves the state, and no terminal journey carries a current one"
        invariants:
          - {rule: "scans apply in time order; an older scan is stored but does not move the state", error: ErrScanOutOfOrder}
          - {rule: "a scanId is applied once", error: ErrDuplicateScan}
          - {rule: "DELIVERED, RETURNED and LOST are terminal", error: ErrJourneyClosed}
          - {rule: "the stored ETA window is empty or has etaStart < etaEnd and a non-zero etaAssignedAt; an assignment not strictly newer than the stored one is refused (ErrEtaStale) and a terminal journey refuses AssignEta (ErrJourneyClosed)", error: ErrEtaStale}
          - {rule: "pointFlagReason and pointFlaggedAt are null together and the reason is NOT_HOME or ACCESS_PROBLEM; a flag not strictly newer than the stored one is refused (ErrPointFlagStale) and a terminal journey refuses FlagDeliveryPoint (ErrJourneyClosed)", error: ErrPointFlagStale}
        commands: [StartJourney, RecordScan, AssignEta, FlagDeliveryPoint, RaiseException, ReturnToSender, DeclareLost]
        events: [PackageScanned, PackageHandedOver, PackageDelivered, PackageExceptionRaised, PackageReturned, PackageLost, PackageEtaWindowAssigned, PackageDeliveryPointFlagged]
        throughput_estimate: "very high (every scan)"
        size_estimate: "one per package + scans"
    read_models:
      - {name: CatalogDimensionsView, source: "offer-availability CatalogItemCreated"}
      - {name: DeliveryAnalytics, source: "analytical read side (shipping-and-tracking ADR 0012, the pilot): cmd/st-projector, the only writer of a SEPARATE analytical database, projects this context's OWN integration topic only (retailnetwork.shipping-and-tracking.events; the analytics topic is not subscribed while nothing is published on it), deduped in the projection transaction; cmd/st-reports serves the read-only /reports routes on :8092"}
    policies:
      - {name: HandoverOnFirstScan, rule: "the first PICKUP_DEPARTURE scan, made from a LoadDeparted whose departureKind is PICKUP, moves LABELLED to HANDED_OVER; its origin node and departedAt are the handover node and instant used by node-performance. A LoadDeparted with no departureKind counts as a pickup only while the journey is still LABELLED"}
      - {name: ScanTypeFromLoadFacts, rule: "LoadDeparted of kind PICKUP is a PICKUP_DEPARTURE scan (LABELLED to HANDED_OVER) and of any other kind a DEPARTURE scan (HANDED_OVER or IN_TRANSIT to IN_TRANSIT). LoadArrived whose nodeType is DELIVERY_STATION is a STATION_ARRIVAL scan (HANDED_OVER or IN_TRANSIT to AT_STATION) and any other or absent nodeType a TRANSIT_ARRIVAL scan (HANDED_OVER or IN_TRANSIT to IN_TRANSIT). HANDED_OVER to AT_STATION is direct injection: a package that goes from a fulfillment centre straight to a delivery station, the SAME_DAY path, has no IN_TRANSIT step. A scan with no edge from the current state is stored with applied=false and answers ErrIllegalTransition"}
      - {name: ExceptionOnSilence, rule: "no scan within expected leg time + tolerance raises PackageExceptionRaised(NO_SCAN)"}
      - {name: StopKeyAtLabelTime, rule: "at IssueLabel the address is read from customer-ordering (GetShipTo), normalized (upper case, letters and digits only; line1, line2, city, region, postalCode and countryCode, not the recipient name or phone) and hashed with a service secret into the stopKey, so neighbours at one address share a stop. stopKey and destinationPostalPrefix go on LabelIssued; the address is then encrypted into the ship-to snapshot and dropped from memory"}
      - {name: NoAddressRoute, rule: "no address leaves shipping-and-tracking and customer-ordering: no route, event or read model carries it, and no restricted label route is built. How a delivery partner learns the address at the door is not decided"}
      - {name: ShipToRetention, rule: "a periodic job (PurgeShipTo) deletes a ship-to snapshot 30 days after its journey closed: DELIVERED, RETURNED or LOST, or VOIDED when the label was voided before handover. A journey still open keeps its snapshot"}
      - {name: EtaWindowOnJourney, rule: "the use case ApplyEtaWindows (same shape as ApplyScans: inbox claim, then per tracking number) consumes StopEtaWindowAssigned and stores etaStart/etaEnd/etaAssignedAt on each journey of the stop via AssignEta; the stopKey is received and dropped (this context keeps no address-derived value of a stop). Each journey then publishes PackageEtaWindowAssigned with its own orderId. EtaCurrent() is the one currency rule, shared with customer-ordering: the window shows only while the state is OUT_FOR_DELIVERY, etaAssignedAt is non-zero and not before lastScanAt, so a newer scan, a failed attempt (back to AT_STATION) or any terminal state hides it; yesterday's window never survives a newer OUT_FOR_DELIVERY scan. The window is relayed as received, never clipped to the promised window (shipping-and-tracking ADR 0013)"}
      - {name: DeliveryPointFlagRelay, rule: "FlagDeliveryPoint consumes DeliveryPointFlagged, drops the stopKey and the failure count (no address-derived value of a stop is kept), stores pointFlagReason and pointFlaggedAt on each journey of the stop, and publishes PackageDeliveryPointFlagged per journey with that journey's own orderId, so customer-ordering can show the advisory per order. Not a scan: the state never moves. A flag for an unknown or terminal journey is counted and acknowledged. There is no cleared event: the advisory ends when the package ends, which the consumer decides (shipping-and-tracking ADR 0014)"}
    inbound:
      - {from: vendor-connectivity, type: cmd, channel: "REST POST /labels (in-org)", routes: ["POST /labels"], message: "IssueLabel", relationship: Customer/Supplier}
      # caller inferred: the spec names no caller for either route; both are ground-operations actions (a scan is recorded at a scanner, a label is voided before handover); no sibling service has a client for them
      - {from: "sort-centre and station operators (human/scanner)", type: cmd, channel: "REST POST /labels/{labelRef}:void, POST /journeys/{trackingNumber}/scans", routes: ["POST /labels/{labelRef}:void", "POST /journeys/{trackingNumber}/scans"], message: "VoidLabel, RecordScan", relationship: UI}
      - {from: shopper / customer-ordering, type: qry, channel: "REST GET /journeys/{trackingNumber}", routes: ["GET /journeys/{trackingNumber}"], message: "GetJourney", relationship: OHS}
      - {from: vendor-connectivity, type: evt, channel: "Kafka retailnetwork.vendor-connectivity.events", message: "VendorShipmentConfirmed", relationship: Customer/Supplier}
      - {from: linehaul-transportation, type: evt, channel: "Kafka retailnetwork.linehaul-transportation.events", message: "LoadDeparted, LoadArrived", relationship: Conformist}
      - {from: last-mile-delivery, type: evt, channel: "Kafka retailnetwork.last-mile-delivery.events", message: "PackageOutForDelivery, DeliveryAttempted, StopEtaWindowAssigned, DeliveryPointFlagged", relationship: Conformist}
      - {from: offer-availability, type: evt, channel: "Kafka retailnetwork.offer-availability.events", message: "CatalogItemCreated", relationship: Conformist}
      # caller inferred: ADR 0012 names the report questions, not a client; the routes are served by cmd/st-reports on :8092, not cmd/api
      - {from: network analysts (human), type: qry, channel: "REST GET /reports/package-touches, GET /reports/delivery-outcomes, GET /reports/freshness (cmd/st-reports, :8092)", routes: ["GET /reports/package-touches", "GET /reports/delivery-outcomes", "GET /reports/freshness"], message: "GetPackageTouchesReport, GetDeliveryOutcomesReport, GetReportFreshness", relationship: UI}
    rest:
      - "POST /labels"
      - "POST /labels/{labelRef}:void"
      - "GET /journeys/{trackingNumber}"
      - "POST /journeys/{trackingNumber}/scans"
      - "GET /reports/package-touches?from=&to="
      - "GET /reports/delivery-outcomes?from=&to="
      - "GET /reports/freshness"
    publishes:
      - {event: LabelIssued, entity: label, data: [labelRef, trackingNumber, poNumber, assignmentId, packageNo, tier, carrier, orderId, stopKey, destinationPostalPrefix], consumers: [linehaul-transportation, customer-ordering, last-mile-delivery]}
      - {event: LabelVoided, entity: label, data: [labelRef, trackingNumber, reason], consumers: [customer-ordering, linehaul-transportation]}
      - {event: PackageScanned, entity: journey, data: [trackingNumber, scanId, nodeId, scanType, at, state], consumers: [customer-ordering]}
      - {event: PackageHandedOver, entity: journey, data: [trackingNumber, poNumber, nodeId, handedOverAt], consumers: [node-performance]}
      - {event: PackageDelivered, entity: journey, data: [trackingNumber, assignmentId, orderId, deliveredAt], consumers: [delivery-promise, order-sourcing, customer-ordering]}
      - {event: PackageExceptionRaised, entity: journey, data: [trackingNumber, assignmentId, orderId, reason, at], consumers: [delivery-promise, customer-ordering]}
      - {event: PackageReturned, entity: journey, data: [trackingNumber, orderId, returnedAt], consumers: [delivery-promise, customer-ordering]}
      - {event: PackageLost, entity: journey, data: [trackingNumber, orderId, declaredAt], consumers: [delivery-promise, customer-ordering]}
      - {event: PackageEtaWindowAssigned, entity: journey, data: [trackingNumber, assignmentId, orderId, etaStart, etaEnd, assignedAt], consumers: [customer-ordering]}
      - {event: PackageDeliveryPointFlagged, entity: journey, data: [trackingNumber, assignmentId, orderId, reason, flaggedAt], consumers: [customer-ordering]}
    reasons:
      - name: PackageExceptionReason
        fields: [PackageExceptionRaised.reason]
        about: "Why a package exception was raised (ADR 0002 A30: the only reason; a failed delivery attempt is not an exception)."
        values:
          - {value: NO_SCAN, meaning: "No applied scan inside the silence window of the journey's leg (ExceptionOnSilence); raised once per silence."}
    consumes:
      - {event: VendorShipmentConfirmed, from: vendor-connectivity}
      - {event: LoadDeparted, from: linehaul-transportation}
      - {event: LoadArrived, from: linehaul-transportation}
      - {event: PackageOutForDelivery, from: last-mile-delivery}
      - {event: DeliveryAttempted, from: last-mile-delivery}
      - {event: CatalogItemCreated, from: offer-availability}
      - {event: PackageReturnInitiated, from: last-mile-delivery}
      - {event: StopEtaWindowAssigned, from: last-mile-delivery}
      - {event: DeliveryPointFlagged, from: last-mile-delivery}
    sync_calls:
      - {to: customer-ordering, type: qry, message: GetShipTo, channel: "REST GET /orders/{orderId}/ship-to"}
    ul:
      - {term: Tracking Number, definition: "The network-wide unique id of one package.", code: "journey.TrackingNumber"}
      - {term: Shipping Label, definition: "What is printed on the package; the only artefact outside customer-ordering that carries the address.", code: "label.ShippingLabel"}
      - {term: Package Journey, definition: "The customer-visible timeline of one package.", code: "journey.PackageJourney"}
      - {term: Scan, definition: "One observation of a package at a node.", code: "journey.Scan"}
      - {term: Handover, definition: "The instant a vendor node's package enters the network.", code: "journey.HandedOver"}
      - {term: Stop Key, definition: "An opaque keyed hash of the normalized ship-to address, put on the label event so last-mile-delivery can group packages into stops without ever receiving an address.", code: "label.StopKey"}
      - {term: Ship-To Snapshot, definition: "The encrypted copy of the ship-to address kept to print a label; never published and purged 30 days after the journey closes.", code: "label.ShipToSnapshot"}
      - {term: Day-of ETA Window, definition: "The at-most-two-hours delivery window consumed from last-mile-delivery at route start and stored on the journey (etaStart, etaEnd, etaAssignedAt). Not a scan: it never moves the state, and it shows on the journey view only while EtaCurrent holds (OUT_FOR_DELIVERY, assigned at or after the last applied scan).", code: "journey.PackageJourney"}
      - {term: Delivery-Point Flag, definition: "The pointFlagReason and pointFlaggedAt stored on each journey of a flagged delivery point (consumed from last-mile-delivery without the stop key) and republished per package by orderId. Not a scan; there is no cleared event, so it ends when the package ends.", code: "journey.PackageJourney"}

  # =========================================================================
  - id: node-performance
    name: Node Performance
    code: NP
    tier: partner
    classification: Supporting
    chart: {differentiation: 0.45, complexity: 0.34, evolution: Custom-built}
    business_model: Risk reducer (promises rest on measured, not just declared, capability)
    purpose: >-
      Measures every node against what it declared and what was asked of it:
      acknowledgement latency, rejections, on-time handover against
      requiredShipBy, promise-kept rate and inventory feed freshness, over
      rolling windows, and grades the node.
    roles: [Analysis (scorecard), Audit]
    business_decisions:
      - A scorecard is computed only from observed facts, never from the vendor's declaration.
      - A node with fewer than the minimum observations in the window is graded PROVISIONAL, not A.
      - Grades drive the promise handicap (owned by delivery-promise); this context never suspends a node.
      - The 7-day scorecard also decides fast-tier eligibility (policy FastTierEligibility): below 0.90 graded on-time handover a node is suspended from SAME_DAY and NEXT_DAY, reinstated after three successive recompute days at 0.95 or more. The decision is published as NodeTierEligibilityChanged and acted on by delivery-promise; it never changes the node's status in node-topology (node-performance ADR 0013).
    aggregates:
      - name: NodeScorecard
        root_id: "scorecardId = nodeId + ':' + window"
        description: "Rolling-window performance of one node (7-day and 30-day)."
        states: [PROVISIONAL, GRADED]
        transitions: [[PROVISIONAL, GRADED, Recompute], [GRADED, GRADED, Recompute], [GRADED, PROVISIONAL, Recompute]]
        value_objects:
          - "Metrics{onTimeHandoverRate, lateAckRate, rejectRate, expiryRate, promiseKeptRate, feedFreshnessP95Minutes, inboundTimelinessP95Minutes, inboundAccuracyRate, observations}; the two inbound metrics are informational: they are not an input to Grading and are not on NodeScorecardUpdated"
          - "Grade(A|B|C|D)"
          - "FastTierState{eligible, reinstatementStreakDays, streakLastUtcDay}: held on the 7d scorecard only (migration 0004), every node starts eligible; the 30d scorecard never evaluates it and keeps the defaults (node-performance ADR 0013)"
        invariants:
          - {rule: "rates are in [0,1]", error: ErrRateOutOfRange}
          - {rule: "grade requires observations >= minObservations", error: ErrInsufficientObservations}
          - {rule: "an observation is counted once (idempotent on source event id)", error: ErrDuplicateObservation}
        commands: [RecordObservation, Recompute]
        events: [NodeScorecardUpdated, NodeThresholdBreached, NodeTierEligibilityChanged]
        throughput_estimate: "medium; recompute batched per minute"
        size_estimate: "nodes x 2 windows + observations (30 days)"
    read_models: []
    policies:
      - {name: Grading, rule: "A: onTimeHandover>=0.98 and promiseKept>=0.97 and lateAck<=0.01; B: >=0.95/0.94/0.03; C: >=0.90/0.90/0.05; else D"}
      - {name: FastTierEligibility, rule: "evaluated by Recompute on the 7d scorecard only, for SAME_DAY and NEXT_DAY together (one eligibility flag per node, one event per tier). Every node starts ELIGIBLE and a PROVISIONAL scorecard never changes eligibility. Suspension: a GRADED 7d onTimeHandoverRate below 0.90 makes the node ineligible. Reinstatement: an ineligible node whose GRADED 7d onTimeHandoverRate is 0.95 or more on three consecutive distinct UTC calendar days of recompute becomes eligible; a GRADED recompute below 0.95 resets the streak, a PROVISIONAL one neither advances nor resets it, a second recompute on the same UTC day counts once, and a quiet calendar day on which no recompute ran is not a miss. The 0.90 and 0.95 gap is the hysteresis; the numbers are domain constants in the style of the grading bars. The flag, the streak and its last UTC day persist on the 7d aggregate (node-performance ADR 0013)"}
      - {name: ThresholdAlert, rule: "publish NodeThresholdBreached when a metric crosses its threshold downward"}
      - {name: InboundObservations, rule: "light, informational. The shipped time of each shipment is kept from InboundShipmentShipped.shippedAt; each InboundReceiptSubmitted is then one observation: timeliness is the receipt's receivedAt minus the shipment's shippedAt, accuracy is the share of reported cartons with status RECEIVED; both are shown on the scorecard and never graded"}
    inbound:
      - {from: vendor-connectivity, type: evt, channel: "Kafka retailnetwork.vendor-connectivity.events", message: "VendorOnboarded, PurchaseOrderIssued, PurchaseOrderAccepted, PurchaseOrderRejected, PurchaseOrderExpired, VendorShipmentConfirmed, SubmissionProcessed, InboundReceiptSubmitted", relationship: Conformist}
      - {from: seller-inbound, type: evt, channel: "Kafka retailnetwork.seller-inbound.events", message: InboundShipmentShipped, relationship: Conformist}
      - {from: vendor-connectivity, type: qry, channel: "REST GET /scorecards/{nodeId} (in-org)", routes: ["GET /scorecards/{nodeId}"], message: "GetScorecard", relationship: Customer/Supplier}
      # caller inferred: the spec says the model names no caller; ADR 0002 A18 only adds filters and pagination
      - {from: network-ops planner, type: qry, channel: "REST GET /scorecards?grade=", routes: ["GET /scorecards"], message: "ListScorecardsByGrade", relationship: UI}
      - {from: shipping-and-tracking, type: evt, channel: "Kafka retailnetwork.shipping-and-tracking.events", message: "PackageHandedOver", relationship: Conformist}
      - {from: delivery-promise, type: evt, channel: "Kafka retailnetwork.delivery-promise.events", message: "PromiseKept, PromiseBroken", relationship: Conformist}
      - {from: offer-availability, type: evt, channel: "Kafka retailnetwork.offer-availability.events", message: "InventoryFeedApplied", relationship: Conformist}
      - {from: node-topology, type: evt, channel: "Kafka retailnetwork.node-topology.events", message: "NodeRegistered, NodeOperationalProfileDeclared", relationship: Conformist}
    rest:
      - "GET /scorecards/{nodeId}"
      - "GET /scorecards?grade="
    publishes:
      - {event: NodeScorecardUpdated, entity: scorecard, data: [nodeId, window, grade, onTimeHandoverRate, lateAckRate, rejectRate, expiryRate, promiseKeptRate, feedFreshnessP95Minutes, observations, computedAt], consumers: [delivery-promise, order-sourcing]}
      - {event: NodeThresholdBreached, entity: scorecard, data: [nodeId, metric, value, threshold, window], consumers: [analytics only]}
      - {event: NodeTierEligibilityChanged, entity: scorecard, data: [nodeId, tier, eligible, metric, value, threshold, window, changedAt], consumers: [delivery-promise]}
    reasons:
      - name: FastTierGoverned
        fields: [NodeTierEligibilityChanged.tier]
        about: "The tiers whose eligibility node-performance judges; raised only when the node's flag flips, one event per tier with the same changedAt, in the same transaction as the scorecard save (outbox). No event for the initial ELIGIBLE state: a consumer that never saw one treats the node as eligible."
        values:
          - {value: SAME_DAY, meaning: "Governed by the same eligibility flag as NEXT_DAY."}
          - {value: NEXT_DAY, meaning: "Governed by the same eligibility flag as SAME_DAY."}
        consumers:
          - {context: delivery-promise, uses: [SAME_DAY, NEXT_DAY], rule: "Filters the node out of the tier's candidates while ineligible; any other tier value is ignored and counted (delivery-promise ADR 0022)."}
      - name: ObservationKind
        fields: ["stored:NodeScorecard"]
        about: "The measured outcomes a scorecard counts, stored per node and keyed by the CloudEvents id of the source event (ADR 0002 A2)."
        values:
          - {value: ACK_ACCEPTED, meaning: "The node accepted a purchase order (PurchaseOrderAccepted)."}
          - {value: ACK_REJECTED, meaning: "The node rejected a purchase order (PurchaseOrderRejected)."}
          - {value: ACK_EXPIRED, meaning: "The node did not acknowledge a purchase order in time (PurchaseOrderExpired)."}
          - {value: HANDOVER, meaning: "A package entered the network (PackageHandedOver); on time when not after requiredShipBy."}
          - {value: PROMISE_KEPT, meaning: "A promise on the node was kept (PromiseKept)."}
          - {value: PROMISE_BROKEN, meaning: "A promise on the node was broken for a node-attributable cause (PromiseBroken, see PromiseBrokenCause)."}
          - {value: FEED_APPLIED, meaning: "An inventory feed of the node was applied (InventoryFeedApplied); the gaps between feeds give the freshness metric."}
    consumes:
      - {event: VendorOnboarded, from: vendor-connectivity}
      - {event: PurchaseOrderIssued, from: vendor-connectivity}
      - {event: PurchaseOrderAccepted, from: vendor-connectivity}
      - {event: PurchaseOrderRejected, from: vendor-connectivity}
      - {event: PurchaseOrderExpired, from: vendor-connectivity}
      - {event: VendorShipmentConfirmed, from: vendor-connectivity}
      - {event: SubmissionProcessed, from: vendor-connectivity}
      - {event: InboundReceiptSubmitted, from: vendor-connectivity}
      - {event: InboundShipmentShipped, from: seller-inbound}
      - {event: PackageHandedOver, from: shipping-and-tracking}
      - {event: PromiseKept, from: delivery-promise}
      - {event: PromiseBroken, from: delivery-promise}
      - {event: InventoryFeedApplied, from: offer-availability}
      - {event: NodeRegistered, from: node-topology}
      - {event: NodeOperationalProfileDeclared, from: node-topology}
    sync_calls: []
    ul:
      - {term: Scorecard, definition: "A node's measured performance over a rolling window, with a grade.", code: "scorecard.NodeScorecard"}
      - {term: On-Time Handover Rate, definition: "Share of packages handed over before requiredShipBy.", code: "scorecard.Metrics.OnTimeHandoverRate"}
      - {term: Late Ack Rate, definition: "Share of purchase orders acknowledged in the last 10% of the window or expired.", code: "scorecard.Metrics.LateAckRate"}
      - {term: Grade, definition: "A, B, C or D; PROVISIONAL below the observation minimum.", code: "scorecard.Grade"}
      - {term: Fast-Tier Eligibility, definition: "Whether a node may be offered SAME_DAY and NEXT_DAY: suspended when the graded 7-day on-time handover rate falls below 0.90, reinstated after three successive recompute days at 0.95 or more.", code: "scorecard.FastTierEligibility"}
      - {term: Hysteresis, definition: "The gap between the suspension bar (0.90) and the reinstatement bar (0.95), with the three-day streak, that stops a node at the boundary from flapping.", code: "scorecard.FastTierEligibility"}
      - {term: Declared vs Measured, definition: "What a vendor says (profile) against what the network observes (scorecard).", code: "(principle)"}

  # =========================================================================
  - id: seller-inbound
    name: Seller Inbound
    code: SI
    tier: partner
    classification: Supporting
    chart: {differentiation: 0.34, complexity: 0.48, evolution: Custom-built}
    business_model: Supply enabler (seller stock arrives planned, labelled, countable and attributable to its owner)
    purpose: >-
      The seller-facing front door for stock coming into the
      network: a seller is onboarded, plans an inbound shipment to a
      vendor node in eaches (loose or case-packed), packs it into cartons
      each identified by an SSCC and a printed label, and ships it. The
      context checks the plan against the destination node's declared
      inbound limits and the catalogue item's packaging hierarchy, hands
      the vendor the shipment as a carton manifest through the Vendor API,
      and closes the shipment from the vendor's carton-level receipt,
      recording every discrepancy and compliance violation instead of
      correcting it. It absorbs the idea reserved earlier as the
      inventory-placement context; placement advice is advisory only
      (PlacementPlan, seller-inbound ADR 0012).
    roles: [Execution (inbound plans and shipments), Gateway for sellers (Open Host Service), Enforcer (carton and label compliance)]
    business_decisions:
      - "Eaches are the ledger unit: every quantity on a plan, a carton and a receipt is in eaches; pack fields are additive and named cases, unitsPerPack, qtyOfChild."
      - A CASE_PACKED carton holds one catalogue item at the quantity of its declared CASE level; a mixed carton is a logistic unit only and has no pack GTIN.
      - "SSCC rule: a seller-supplied SSCC is accepted only if it is a valid 18-digit code and unique network-wide; otherwise the network issues one from its own GS1 company prefix and returns the label."
      - A shipment cannot ship until every carton has a label, and cannot be labelled outside the destination node's declared carton weight and size limits.
      - Stock a seller sends is owned by that seller (ownerRef = sellerId) and stays segregated from every other owner's; commingling is not designed.
      - A receipt discrepancy or compliance violation is recorded as a fact; the context never edits the manifest to match what arrived.
    aggregates:
      - name: PlacementPlan
        description: "One placement advisory for a (seller, item): where forward stock belongs, computed from the DemandHeatView (ADR 0012, F6). States SUGGESTED/ACCEPTED/SUPERSEDED; a new plan for the same (seller, item) supersedes the previous; acceptance is advisory-only in v1."
        events: [PlacementPlanSuggested]

      - name: SellerAccount
        root_id: sellerId
        description: "A seller organisation allowed to send stock to the network; the seller of record (owner) of the stock it sends."
        states: [ACTIVE, SUSPENDED]
        transitions: [[ACTIVE, SUSPENDED, SuspendSeller], [SUSPENDED, ACTIVE, ReinstateSeller]]
        value_objects: ["OwnerRef (opaque string, at most 64 characters of A-Z a-z 0-9 . _ -; on the network equal to sellerId)"]
        invariants:
          - {rule: "sellerId is unique", error: ErrSellerExists}
          - {rule: "a suspended seller creates no plan, shipment or carton and ships nothing", error: ErrSellerSuspended}
        commands: [OnboardSeller, SuspendSeller, ReinstateSeller]
        events: [SellerOnboarded, SellerSuspended, SellerReinstated]
        throughput_estimate: "rare"
        size_estimate: "tens to thousands"
      - name: InboundPlan
        root_id: planId
        description: "A seller's declaration of what it intends to send to one vendor node, in eaches, and how it will pack it."
        states: [DRAFT, CONFIRMED, CANCELLED]
        transitions:
          - [DRAFT, CONFIRMED, ConfirmInboundPlan]
          - [DRAFT, CANCELLED, CancelInboundPlan]
        value_objects:
          - "PackingOption(INDIVIDUAL|CASE_PACKED)"
          - "PlanLine{catalogItemId, gtin, qtyEaches}"
        invariants:
          - {rule: "the destination node is ACTIVE and has the INBOUND capability (and accepts pallets when the shipment is palletised)", error: ErrNodeCannotReceive}
          - {rule: "the seller is ACTIVE when the plan is created and confirmed", error: ErrSellerSuspended}
          - {rule: "1 to 500 lines, one per catalogue item; every line names a catalogItemId, a valid GTIN (8, 12, 13 or 14 digits, mod-10 check digit) and qtyEaches > 0. Whether the item is live is not checked: the context consumes no CatalogItemCreated or CatalogItemDiscontinued (seller-inbound ADR 0003)", error: ErrValidation}
        commands: [CreateInboundPlan, ConfirmInboundPlan, CancelInboundPlan]
        events: [InboundPlanConfirmed]
        throughput_estimate: "low-medium: one per seller replenishment"
        size_estimate: "one row per plan + lines"
      - name: InboundShipment
        root_id: shipmentId
        description: "One physical consignment of a plan to one node: its cartons (each an SSCC logistic unit with its contents), their labels and its receipt outcome."
        states: [DRAFT, LABELLED, SHIPPED, RECEIVING, CLOSED, CLOSED_WITH_DISCREPANCY]
        transitions:
          - [DRAFT, LABELLED, LabelShipment]
          - [LABELLED, SHIPPED, ShipInboundShipment]
          - [SHIPPED, RECEIVING, RecordInboundReceipt]
          - [RECEIVING, RECEIVING, RecordInboundReceipt]
          - [SHIPPED, CLOSED, RecordInboundReceipt]
          - [SHIPPED, CLOSED_WITH_DISCREPANCY, RecordInboundReceipt]
          - [RECEIVING, CLOSED, RecordInboundReceipt]
          - [RECEIVING, CLOSED_WITH_DISCREPANCY, RecordInboundReceipt]
        entities: [Carton]
        value_objects:
          - "Carton{sscc, parentSscc?, kind(HOMOGENEOUS_CASE|MIXED), contents[CartonContent{catalogItemId, gtin, qtyEaches, lot?, expiry?}], grossWeightG, dimsMm{l,w,h}, sealed}"
          - "Sscc (18 digits, mod-10 check digit; unique network-wide)"
          - "Gtin (stored as 14 digits, zero-left-padded; accepted lengths 8, 12, 13, 14)"
          - "CartonReceiptStatus(RECEIVED|MISSING|UNEXPECTED|DAMAGED)"
          - "Label{sscc, labelRef}"
        invariants:
          - {rule: "a HOMOGENEOUS_CASE carton holds exactly one item, one GTIN and one quantity", error: ErrCasePackNotUniform}
          - {rule: "a HOMOGENEOUS_CASE carton's qtyEaches equals unitsPerPack of the catalogue item's declared, active CASE level for the carton's gtin", error: ErrCaseQtyMismatchesGtin}
          - {rule: "carton gross weight is within the destination node's maxCartonWeightG", error: ErrCartonOverweight}
          - {rule: "carton dimensions are within the destination node's maxCartonDimsMm", error: ErrCartonOversize}
          - {rule: "an SSCC is unique network-wide", error: ErrSsccNotUnique}
          - {rule: "an SSCC has 18 digits and a valid mod-10 check digit", error: ErrInvalidSscc}
          - {rule: "at labelling, the eaches per item and GTIN over the cartons of this shipment equal the confirmed plan's lines (every line exactly, no extra item)", error: ErrCartonContentsMismatchPlan}
          - {rule: "the destination node is ACTIVE with the INBOUND capability when the shipment is created and when it ships", error: ErrNodeCannotReceive}
          - {rule: "the seller is ACTIVE when the shipment is created, labelled and shipped", error: ErrSellerSuspended}
          - {rule: "no ship without a label for every carton", error: ErrShipmentNotLabelled}
        commands: [CreateInboundShipment, AddCarton, LabelShipment, ShipInboundShipment, RecordInboundReceipt]
        events: [InboundShipmentLabelled, InboundShipmentShipped, InboundShipmentReceived, InboundDiscrepancyRecorded, SellerComplianceViolationRecorded]
        throughput_estimate: "medium: cartons dominate (tens to thousands per shipment)"
        size_estimate: "one row per shipment + one per carton + contents; retained for audit"
    read_models:
      - {name: DemandHeatView, source: "order-sourcing FulfillmentReleasedToNode and FulfillmentCancelled (the released lines per item+region over a 28-day window, the node region from node-topology events), offer-availability ListingAvailabilityChanged (declared availability per item+node); seller-inbound ADR 0012"}
      - {name: NodeInboundView, source: "node-topology NodeRegistered, NodeOperationalProfileDeclared, NodeActivated, NodeSuspended, NodeRetired"}
      - {name: CatalogPackagingView, source: "offer-availability CatalogItemPackagingDeclared, CatalogItemPackLevelRetired"}
      - {name: SellerScorecard, source: "own facts only (no consumer, no event): one row per closed shipment and one per InboundDiscrepancyRecorded or SellerComplianceViolationRecorded, written in the receipt's unit of work (seller-inbound ADR 0005)"}
    policies:
      - {name: SsccIssuance, rule: "a carton added with an sscc is accepted only if valid and unique network-wide; a carton added without one gets an SSCC issued from the network's GS1 company prefix; either way a Label is returned"}
      - {name: NodeMustBeAbleToReceive, rule: "the destination node, its INBOUND capability, acceptsPallets and carton limits are read from NodeInboundView; a node that is not ACTIVE receives nothing; a node whose profile declares no inbound limits is treated as accepting cartons with limits unchecked"}
      - {name: OwnerSegregation, rule: "every carton of a plan is owned by the plan's seller (ownerRef = sellerId); ownership travels on InboundShipmentShipped and the Vendor API and is never merged with another owner's"}
      - {name: ReceiveOnVendorReceipt, rule: "on InboundReceiptSubmitted run RecordInboundReceipt for the shipment: the shipment closes when every carton has a final status, CLOSED if nothing differs from the manifest and CLOSED_WITH_DISCREPANCY otherwise"}
      - {name: SellerStatusIsIntegration, rule: "SellerSuspended and SellerReinstated are integration events on retailnetwork.seller-inbound.events (subject and key sellerId), consumed by offer-availability to suppress and restore the seller's listings; SellerOnboarded stays analytics-only (seller-inbound ADR 0013, gap G48)"}
      - {name: ReceivedStockPerItem, rule: "when a shipment closes, InboundShipmentReceived carries received[{catalogItemId?, gtin, qtyEaches}]: only manifest cartons answered RECEIVED count (discrepant or not; MISSING, DAMAGED and UNEXPECTED do not); a counted carton uses the vendor's counted quantities, otherwise its manifest contents, both already in eaches; the gtin is the EACH-level GTIN when CatalogPackagingView resolves the childGtin chain, else the carton GTIN; catalogItemId is omitted when unresolved; summed per published gtin, zero lines omitted, sorted by gtin, always present (an empty array is legal). Events closed before the change carry no received (seller-inbound ADR 0014, gap G51)"}
      - {name: RecordDiscrepancies, rule: "a MISSING, UNEXPECTED or DAMAGED carton, or a received quantity different from the manifest, raises InboundDiscrepancyRecorded; each complianceCode on the receipt raises SellerComplianceViolationRecorded; the manifest is never edited"}
    inbound:
      - {from: seller / seller portal, type: cmd, channel: "REST POST /sellers", routes: ["POST /sellers"], message: OnboardSeller, relationship: OHS}
      - {from: network partner managers (human), type: cmd, channel: "REST POST /sellers/{sellerId}:suspend, POST /sellers/{sellerId}:reinstate", routes: ["POST /sellers/{sellerId}:suspend", "POST /sellers/{sellerId}:reinstate"], message: "SuspendSeller, ReinstateSeller", relationship: UI}
      - {from: seller / seller portal, type: cmd, channel: "REST POST /inbound-plans, POST /inbound-plans/{planId}:confirm, POST /inbound-plans/{planId}:cancel", routes: ["POST /inbound-plans", "POST /inbound-plans/{planId}:confirm", "POST /inbound-plans/{planId}:cancel"], message: "CreateInboundPlan, ConfirmInboundPlan, CancelInboundPlan", relationship: OHS}
      - {from: seller / seller portal, type: cmd, channel: "REST POST /inbound-plans/{planId}/shipments, POST /inbound-shipments/{shipmentId}/cartons, POST /inbound-shipments/{shipmentId}:label, POST /inbound-shipments/{shipmentId}:ship", routes: ["POST /inbound-plans/{planId}/shipments", "POST /inbound-shipments/{shipmentId}/cartons", "POST /inbound-shipments/{shipmentId}:label", "POST /inbound-shipments/{shipmentId}:ship"], message: "CreateInboundShipment, AddCarton, LabelShipment, ShipInboundShipment", relationship: OHS}
      - {from: seller / seller portal, type: qry, channel: "REST GET /inbound-plans/{planId}, GET /inbound-shipments/{shipmentId}, GET /inbound-shipments/{shipmentId}/labels", routes: ["GET /inbound-plans/{planId}", "GET /inbound-shipments/{shipmentId}", "GET /inbound-shipments/{shipmentId}/labels"], message: "GetInboundPlan, GetInboundShipment, GetLabels", relationship: OHS}
      - {from: "seller / seller portal, network partner managers (human)", type: qry, channel: "REST GET /sellers/{sellerId}/scorecard?window=", routes: ["GET /sellers/{sellerId}/scorecard"], message: "GetSellerScorecard (informational, seller-inbound ADR 0005)", relationship: OHS}
      - {from: seller / network partner manager, type: cmd, channel: "REST POST /placement-plans (compute), GET /placement-plans, GET /placement-plans/{planId}, POST /placement-plans/{planId}/acceptances", routes: ["POST /placement-plans", "GET /placement-plans", "GET /placement-plans/{planId}", "POST /placement-plans/{planId}/acceptances"], message: "ComputePlacementPlan, ListPlacementPlans, GetPlacementPlan, AcceptPlacementPlan", relationship: OHS}
      - {from: vendor-connectivity, type: evt, channel: "Kafka retailnetwork.vendor-connectivity.events", message: InboundReceiptSubmitted, relationship: Customer/Supplier}
      - {from: node-topology, type: evt, channel: "Kafka retailnetwork.node-topology.events", message: "NodeRegistered, NodeOperationalProfileDeclared, NodeActivated, NodeSuspended, NodeRetired", relationship: Conformist}
      - {from: offer-availability, type: evt, channel: "Kafka retailnetwork.offer-availability.events", message: "CatalogItemPackagingDeclared, CatalogItemPackLevelRetired, ListingAvailabilityChanged", relationship: Conformist}
      - {from: order-sourcing, type: evt, channel: "Kafka retailnetwork.order-sourcing.events", message: "FulfillmentReleasedToNode, FulfillmentCancelled", relationship: Conformist}
    rest:
      - "POST /sellers"
      - "POST /sellers/{sellerId}:suspend"
      - "POST /sellers/{sellerId}:reinstate"
      - "GET /sellers/{sellerId}/scorecard?window="
      - "POST /inbound-plans"
      - "GET /inbound-plans/{planId}"
      - "POST /inbound-plans/{planId}:confirm"
      - "POST /inbound-plans/{planId}:cancel"
      - "POST /inbound-plans/{planId}/shipments"
      - "POST /inbound-shipments/{shipmentId}/cartons"
      - "POST /inbound-shipments/{shipmentId}:label"
      - "GET /inbound-shipments/{shipmentId}/labels"
      - "POST /inbound-shipments/{shipmentId}:ship"
      - "GET /inbound-shipments/{shipmentId}"
      - "POST /placement-plans"
      - "GET /placement-plans"
      - "GET /placement-plans/{planId}"
      - "POST /placement-plans/{planId}/acceptances"
    publishes:
      - {event: SellerOnboarded, entity: seller, data: [sellerId, name, onboardedAt], consumers: [analytics only]}
      - {event: PlacementPlanSuggested, entity: placementplan, data: [planId, sellerId, catalogItemId, basis, suggestions(nodeId, regionId, suggestedUnits, regionDemandUnits, nodeAvailabilityUnits), createdAt], consumers: [analytics only in v1 (ADR 0012)]}
      - {event: SellerSuspended, entity: seller, data: [sellerId, suspendedAt, reason (optional)], consumers: [offer-availability]}
      - {event: SellerReinstated, entity: seller, data: [sellerId, reinstatedAt], consumers: [offer-availability]}
      - {event: InboundPlanConfirmed, entity: inboundplan, data: [planId, sellerId, destinationNodeId, packingOption, lines(catalogItemId, gtin, qtyEaches), confirmedAt], consumers: [analytics only]}
      - {event: InboundShipmentLabelled, entity: inboundshipment, data: [shipmentId, planId, sellerId, nodeId, cartons(sscc, parentSscc, kind, contents(catalogItemId, gtin, qtyEaches, lot, expiry), grossWeightG, dimsMm), labelledAt], consumers: [vendor-connectivity]}
      - {event: InboundShipmentShipped, entity: inboundshipment, data: [shipmentId, planId, sellerId, nodeId, shippedAt], consumers: [vendor-connectivity, node-performance]}
      - {event: InboundShipmentReceived, entity: inboundshipment, data: [shipmentId, sellerId, nodeId, status, "cartons(sscc, status)", receivedAt, "received(catalogItemId (optional), gtin, qtyEaches)"], consumers: [vendor-connectivity, offer-availability]}
      - {event: InboundDiscrepancyRecorded, entity: inboundshipment, data: [shipmentId, sellerId, nodeId, sscc (optional), kind, expected (optional), actual (optional), recordedAt], consumers: [analytics only]}
      - {event: SellerComplianceViolationRecorded, entity: seller, data: [sellerId, shipmentId (optional), code, recordedAt], consumers: [analytics only]}
    reasons:
      # InboundDiscrepancyRecorded.kind is deliberately NOT a closed vocabulary here: it is the
      # fleet's carton discrepancy kind string, passed through unchanged from the vendor's receipt
      # (contracts section 10, P3). The network branches on none of its values.
      - name: InboundShipmentStatus
        fields: [InboundShipmentReceived.status]
        about: "How a shipment closed after the vendor's carton-level receipt."
        values:
          - {value: CLOSED, meaning: "Every carton has a final status and nothing differs from the manifest."}
          - {value: CLOSED_WITH_DISCREPANCY, meaning: "At least one carton or quantity differs from the manifest; each difference is also published as InboundDiscrepancyRecorded."}
      - name: CartonReceiptStatus
        fields: ["InboundShipmentReceived.cartons(sscc, status)"]
        about: "The vendor's per-carton receipt status, reported on the receipt and carried on the shipment's closing event."
        values:
          - {value: RECEIVED, meaning: "The carton was received."}
          - {value: MISSING, meaning: "A manifest carton was not received."}
          - {value: UNEXPECTED, meaning: "A carton was received that the manifest does not list."}
          - {value: DAMAGED, meaning: "A carton was received damaged."}
      - name: ComplianceTier
        fields: ["rest:SellerScorecard.complianceTier"]
        about: "The informational tier of a seller's compliance scorecard: the worst of three signals over the window (seller-inbound ADR 0005 A3). Nothing acts on it."
        values:
          - {value: GOOD, meaning: "No signal reaches WATCH, or nothing was observed in the window."}
          - {value: WATCH, meaning: "Receipt accuracy below 0.98, or at least 0.5 discrepancies per shipment, or at least one compliance violation."}
          - {value: AT_RISK, meaning: "Receipt accuracy below 0.90, or at least 2.0 discrepancies per shipment, or at least five compliance violations."}
    consumes:
      - {event: InboundReceiptSubmitted, from: vendor-connectivity}
      - {event: NodeRegistered, from: node-topology}
      - {event: NodeOperationalProfileDeclared, from: node-topology}
      - {event: NodeActivated, from: node-topology}
      - {event: NodeSuspended, from: node-topology}
      - {event: NodeRetired, from: node-topology}
      - {event: CatalogItemPackagingDeclared, from: offer-availability}
      - {event: CatalogItemPackLevelRetired, from: offer-availability}
      - {event: ListingAvailabilityChanged, from: offer-availability}
      - {event: FulfillmentReleasedToNode, from: order-sourcing}
      - {event: FulfillmentCancelled, from: order-sourcing}
    sync_calls: []
    ul:
      - {term: Seller, definition: "An organisation that sends its own stock to the network. Distinct from a Vendor, which operates fulfillment nodes.", code: "seller.Account"}
      - {term: "Owner / Seller of Record", definition: "Whose stock it is. On the network ownerRef equals the sellerId; stock, listings and reservations are segregated by it.", code: "seller.ID (shared.ValidOwnerRef)"}
      - {term: Inbound Plan, definition: "A seller's declaration, in eaches, of what it will send to one node and with which packing option.", code: "inboundplan.Plan"}
      - {term: Inbound Shipment, definition: "One physical consignment of a plan to a node: its cartons, labels and receipt outcome.", code: "inboundshipment.Shipment"}
      - {term: Carton, definition: "One physical outer carton of a shipment, identified by an SSCC and holding the contents it declares.", code: "inboundshipment.Carton"}
      - {term: Packing Option, definition: "INDIVIDUAL (eaches packed freely) or CASE_PACKED (cartons are case packs of a declared CASE level).", code: "inboundplan.PackingOption"}
      - {term: Each, definition: "The lowest packaging level, intended for individual resale and the unit of every quantity in the network's ledgers.", code: "catalog.PackLevel.EACH"}
      - {term: Inner Pack, definition: "An intermediate package of several eaches of one item. In the model but not used by any flow in the first version.", code: "catalog.PackLevel.INNER"}
      - {term: Case Pack, definition: "The quantity of eaches in one case of an item (unitsPerPack). Fixed by the case's GTIN; a different quantity needs a different GTIN.", code: "catalog.PackLevelDef.UnitsPerPack"}
      - {term: Master Carton, definition: "An outer carton holding one case: identical sellable units of one item, labelled with an SSCC. A HOMOGENEOUS_CASE carton in the model.", code: "inboundshipment.Carton (kind HOMOGENEOUS_CASE)"}
      - {term: Mixed Carton, definition: "A carton holding more than one item. It has no pack GTIN: it is a logistic unit identified by its SSCC and carton manifest only.", code: "inboundshipment.Carton (kind MIXED)"}
      - {term: GTIN, definition: "The global trade item number identifying an item at one packaging level. Stored as 14 digits, zero-left-padded; accepted as 8, 12, 13 or 14 digits with a valid check digit.", code: "gs1.GTIN"}
      - {term: EAN, definition: "A 13-digit GTIN as printed on a consumer unit. Treated as a GTIN input like any other length.", code: "gs1.GTIN"}
      - {term: SSCC, definition: "The 18-digit serial shipping container code identifying one logistic unit. Unique network-wide, with a mod-10 check digit.", code: "gs1.SSCC"}
      - {term: Logistic Unit, definition: "Any combination of items packed for transport or storage and identified by an SSCC, such as a carton or a pallet.", code: "inboundshipment.Carton"}
      - {term: Break Case, definition: "Opening a sealed case at a vendor node to release its eaches. A vendor-node operation, not a network event; quantities stay in eaches.", code: "(vendor node operation, not modelled)"}

# ---------------------------------------------------------------------------
# Out-of-scope / future contexts (named so the map is complete).
# inventory-placement, reserved here earlier, is absorbed by seller-inbound
# (ADR 0009): the seller names the destination node on its inbound plan.
# Automated advice on which node should hold which item is not modelled
# (see the gap register).
# ---------------------------------------------------------------------------
future_contexts:
  - {id: customer-returns, classification: Supporting, note: "Return authorisation and routing to a RETURNS_CENTER node; on the fleet side returns-processing receives it."}
  - {id: customer-notification, classification: Generic, note: "Emails/push on PromiseRevised and delivery; buy, do not build."}
  - {id: payments-and-invoicing, classification: Generic, note: "Vendor invoices and settlement; out of scope as in the original plan."}

# ---------------------------------------------------------------------------
# External actors
# ---------------------------------------------------------------------------
external:
  - {id: network-fulfillment, org: warehouse-systems, kind: downstream vendor system, note: "Conformist + ACL to the Vendor API. The ONLY fleet context that talks to the network."}
  - {id: shopper, kind: person (synthetic) via storefront / e2e-tests}
  - {id: network-ops planner, kind: person}
  - {id: delivery service partner, kind: external organisation (driver app)}
  - {id: sort-centre and station operators, kind: person / scanner}

# ---------------------------------------------------------------------------
# Decisions (proposed ADRs, docs/adr/)
# ---------------------------------------------------------------------------
decisions:
  - {id: RN-0001, title: "The retail network is its own domain of ten bounded contexts (supersedes the one-context D1)"}
  - {id: RN-0002, title: "Promise and order assignment are separate contexts; the promise carries a witness path, assignment re-optimises until lock"}
  - {id: RN-0003, title: "Capability is declared (operational profile) and measured (scorecard); both feed the promise"}
  - {id: RN-0004, title: "Parcel nodes are network-operated; vendors register fulfillment, cross-dock and returns nodes only"}
  - {id: RN-0005, title: "The vendor node's acceptance is the path lock"}
  - {id: RN-0006, title: "PII is confined to customer-ordering and shipping-and-tracking; the Vendor API never carries it"}
  - {id: RN-0007, title: "CloudEvents namespace com.retailnetwork.<tier>.<context>; no topic is shared with the fleet"}
  - {id: RN-0008, title: "Fast tiers are never promised from nominal times; capacity is held at promise time in a PromiseBook"}
  - {id: RN-0009, title: "Seller inbound and case-packed shipments: SSCC-identified cartons, owner-segregated stock, eaches as the ledger unit, GS1 pack immutability, boundary unchanged"}
  - {id: RN-0010, title: "Carrier handoff delivery for low-density service areas (amends RN-0004: the carrier operates a delivery mode, never a node)"}
  - {id: RN-0011, title: "Pickup points and lockers: a PICKUP_POINT node type operated NETWORK or PARTNER; a checkout destination that shrinks PII; collection states on the package"}
