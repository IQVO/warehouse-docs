    sync_calls: []
    ul:
      - {term: Delivery Offer, definition: "A quoted delivery window for an item, quantity, destination and tier, valid until it expires.", code: "offer.DeliveryOffer"}
      - {term: Service Tier, definition: "SAME_DAY, NEXT_DAY, TWO_DAY, STANDARD or the opt-in CONSOLIDATED.", code: "promise.Tier"}
      - {term: Promise, definition: "The network's commitment of a delivery window for one shipment group.", code: "promise.Promise"}
      - {term: Ship-By, definition: "The pickup cutoff at the witness node the package must be ready for.", code: "promise.PromiseTerms.ShipBy"}
      - {term: Deliver-By Window, definition: "deliverByEarliest..deliverByLatest shown to the customer.", code: "promise.PromiseTerms"}
      - {term: Witness Path, definition: "The concrete node, pickup, departures and delivery wave that prove a promise is feasible; order-sourcing may choose a different path later.", code: "promise.WitnessPath"}
      - {term: Promise Basis, definition: "SCHEDULED (from real departures and waves), MEASURED (a leg stretched by its measured P-serviceLevel transit, ADR 0014) or NOMINAL (STANDARD tier from nominal lane times).", code: "promise.Basis"}
      - {term: Promise Book, definition: "Capacity ledger of one node pickup cutoff on the promise side.", code: "book.PromiseBook"}
      - {term: Capacity Hold, definition: "A provisional reservation on a promise book released if the order is not placed in time.", code: "book.Capacity.Provisional"}
      - {term: Book Share, definition: "The number of orders a promise book may hold for one pickup cutoff: the node's declared limit for the window, scaled by the policy's capacitySharePercent, at least 1.", code: "book.Capacity.Share"}
      - {term: Hold Deadline, definition: "The instant from which a promise book accepts no new hold: the pickup cutoff minus the node's handling time.", code: "book.BookTimes.HoldDeadline"}
      - {term: Handicap, definition: "The scorecard-driven delay applied to a node's shipBy.", code: "promise.ScorecardHandicap"}
      - {term: Re-promise, definition: "Revising a confirmed promise to a later window when its path is no longer feasible.", code: "promise.Promise.Revise"}
      - {term: Promise Kept / Broken, definition: "The judgement at delivery against deliverByLatest.", code: "promise.Judgement"}
      - {term: Shipment Group, definition: "The lines of an order promised and shipped together from one node.", code: "promise.ShipmentGroup"}
      - {term: Capacity Band, definition: "AMPLE, TIGHT or SCARCE: how full the promise book behind an offer's window is at quote time (under 60%, 60% to under 85%, 85% and over of its share). A signal, never a price.", code: "shared.CapacityBand"}
      - {term: Calibration Buffer, definition: "The minutes a quote adds to its arrival, learned from the lateness of this service's own judged promises in the same segment; one-sided and capped.", code: "search.Calibration.BufferMinutes"}
      - {term: Confidence, definition: "The observed share of a segment's judged promises that were within the quote's buffer; present only with enough judgements, absence means unknown.", code: "search.Calibration.Confidence"}
      - {term: Predicted Late, definition: "The at-risk reason of a confirmed promise whose witness-path departure is past its expected arrival with no arrival seen.", code: "promise.ReasonPredictedLate"}
      - {term: Consolidated Tier, definition: "The opt-in fifth tier: a delivery on a day the shopper chooses, at or after the fastest feasible window, so the network can merge the order with others. Quoted only when requested.", code: "shared.TierConsolidated"}
      - {term: Chosen Delivery Day, definition: "The local calendar date of the destination station the shopper wants a CONSOLIDATED order delivered on; a day before the fastest window is moved up to it.", code: "search.Input.ConsolidatedDay"}
      - {term: Consolidation Eligible, definition: "True when the chosen day leaves the network at least one local day after the fastest window to merge the order with others, false when the day is that window itself; it never says another order exists.", code: "search.Candidate.ConsolidationEligible"}
      - {term: Fast-Tier Eligibility, definition: "Whether a node may be offered SAME_DAY and NEXT_DAY, as decided by node-performance and held locally; a missing row means eligible.", code: "NodeTierEligibility"}

  # =========================================================================
  - id: customer-ordering
    name: Customer Ordering
    code: CO
    tier: commerce
    classification: Generic
    chart: {differentiation: 0.15, complexity: 0.58, evolution: Commodity}
    business_model: Engagement (the storefront transaction)
    purpose: >-
      Turns a shopper's cart into a customer order: obtains a promise for
      every shipment group at checkout, records the order with the shopper and
      ship-to address (synthetic PII, held only here), shows status and
      tracking, and handles customer cancellation.
    roles: [Execution (checkout), Gateway (storefront)]
    business_decisions:
      - No order is placed unless every line belongs to exactly one confirmed-able promise.
      - "Checkout takes exactly one of an inline shipTo and a saved shipToAddressId (the address is copied into the order). When a selected offer is no longer quotable, nothing is placed: the response is 409 offer-not-quotable carrying requotedOffers (one per feasible tier of each failed group) for the shopper to re-confirm."
      - "POST /checkout and the other state-changing routes are idempotent on (route, Idempotency-Key) inside a 24-hour window; a replay with the same body returns the stored response, which is how an in-doubt placement is settled."
      - The ship-to address never leaves this context except to shipping-and-tracking for a label.
      - A customer may cancel until every shipment group is locked; after that, cancellation is a return.
      - A cancel is a request: order-sourcing decides for each group, and its answer (FulfillmentCancelled or FulfillmentCancelRefused) is what this context shows.
      - The shopper's choice of a CONSOLIDATED delivery day needs no checkout field: the choice is the offerId of the group. The group stores the tier, the chosen local delivery day and delivery-promise's consolidationEligible answer, and the placed order carries them (customer-ordering ADR 0013).
      - Only this context owns both the shopper and the ship-to, so it derives an opaque consolidation key that lets order-sourcing merge the groups of one shopper and one address without ever seeing the address (customer-ordering ADR 0012).
      - One package may carry several groups: a tracking number belongs to a set of groups, and one package event closes every group that shares it (customer-ordering ADR 0012).
    aggregates:
      - name: CustomerOrder
        root_id: orderId
        description: "A shopper's order: lines, ship-to (PII), the promise per shipment group and the customer-facing status."
        states: [PLACED, IN_FULFILLMENT, PARTIALLY_SHIPPED, SHIPPED, DELIVERED, CANCELLED]
        transitions:
          - [PLACED, IN_FULFILLMENT, MarkInFulfillment]
          - [IN_FULFILLMENT, PARTIALLY_SHIPPED, MarkGroupShipped]
          - [IN_FULFILLMENT, SHIPPED, MarkGroupShipped]
          - [PARTIALLY_SHIPPED, SHIPPED, MarkGroupShipped]
          - [SHIPPED, DELIVERED, MarkGroupDelivered]
          - [PLACED, CANCELLED, CancelOrder]
          - [IN_FULFILLMENT, CANCELLED, CancelOrder]
        value_objects:
          - "ShipTo{name, line1, line2, city, region, postalCode, countryCode, phone} (PII, synthetic)"
          - "OrderLine{lineNo, catalogItemId, quantity}"
          - "GroupPromise{groupNo, promiseId, tier (SAME_DAY|NEXT_DAY|TWO_DAY|STANDARD|CONSOLIDATED), deliverByEarliest, deliverByLatest, lineNos[], chosenDeliveryDay (optional, YYYY-MM-DD: the LOCAL calendar date of deliverByLatest in the group's time zone at placement, CONSOLIDATED only, never recomputed by a later PromiseRevised), consolidationEligible (optional boolean, delivery-promise's answer, CONSOLIDATED only, unknown is nil and never false)}"
          - "ConsolidationKey: empty or 64 lower-case hex characters, hex(HMAC-SHA-256(secret, 'consolidation-key/v1' + shopperId + the normalised ship-to)); the recipient name and the phone are excluded (the stop-key rule), so two orders of one shopper to one stop share a key under one secret. A keyed hash: it carries no PII and is not reversible without the secret; rows written before it read back empty and never merge (customer-ordering ADR 0012)"
        invariants:
          - {rule: "every line is in exactly one group, and every group has a promise", error: ErrLineWithoutPromise}
          - {rule: "the promise's destination postal prefix matches the ship-to", error: ErrPromiseDestinationMismatch}
          - {rule: "cancel only while some group is unlocked; advisory, because order-sourcing decides and its FulfillmentCancelRefused wins. A request when every group is locked, shipped or delivered is answered with ErrCancelAfterLock", error: ErrCancelAfterLock}
          - {rule: "status moves forward only", error: ErrStatusRegression}
          - {rule: "chosenDeliveryDay and consolidationEligible are allowed only on a CONSOLIDATED group, and the day must be a valid calendar date (ErrValidation on Place, ErrInvalidSnapshot on Restore)", error: ErrValidation}
          - {rule: "consolidationKey is empty or 64 lower-case hex characters (ErrValidation on Place, ErrInvalidSnapshot on Restore)", error: ErrValidation}
        commands: [PlaceOrder, MarkInFulfillment, MarkGroupShipped, MarkGroupDelivered, CancelOrder, ConfirmGroupCancelled, RefuseGroupCancellation, UpdateGroupPromise]
        events: [CustomerOrderPlaced, CustomerOrderCancelled]
        throughput_estimate: "medium"
        size_estimate: "one row per order + lines"
      - name: Shopper
        root_id: shopperId
        description: A synthetic customer account with saved addresses (at most 20).
        states: [ACTIVE]
        invariants:
          - {rule: "email unique", error: ErrShopperExists}
        commands: [RegisterShopper, AddShopperAddress]
        events: []
        throughput_estimate: "low"
        size_estimate: "small"
    read_models:
      - {name: OrderTrackingView, source: "shipping-and-tracking LabelIssued, PackageScanned, PackageDelivered, PackageExceptionRaised; order-sourcing FulfillmentLocked, FulfillmentShipped; delivery-promise PromiseAtRisk, PromiseRevised, PromiseKept, PromiseBroken. A tracking number belongs to a SET of groups: tracking_package_groups(tracking_number, order_id, group_no) with a primary key on all three, written only by adding (ON CONFLICT DO NOTHING) and read through for DeliveredPackages, OutcomePackages and the tracking view; the package facts stay one row per tracking number (customer-ordering ADR 0012). The row also carries the day-of window (etaStart, etaEnd, etaAssignedAt, upserted by ApplyEta, newest wins, migration 0009) and the delivery-point flag (pointFlagReason, pointFlaggedAt, upserted by ApplyPointFlag, newest wins, migration 0010), both stored only as read-model facts: no aggregate, no outbox event (customer-ordering ADR 0014/0015)"}
    policies:
      - {name: CheckoutPromising, rule: "for each shipment group call MakePromise with the offer the shopper saw; if the offer expired, re-quote and show the new window before placing"}
      - {name: EtaWindowOnTracking, rule: "views.TrackingFrom shows a package's etaStart and etaEnd only while its state is OUT_FOR_DELIVERY, etaAssignedAt is non-zero and not before lastScanAt, the same currency rule as shipping-and-tracking's EtaCurrent; a newer scan, a failed attempt (back to AT_STATION) or any terminal state omits both. The window is shown as received, never clipped to the group's deliverByLatest (hiding a late window would contradict the judgement the promise still uses), and a window event never touches the group promise, status or verdict: they are byte-identical before and after (customer-ordering ADR 0014)"}
      - {name: DeliveryPointAdvisory, rule: "views.TrackingFrom carries deliveryPointAdvisory{reason, flaggedAt} on a package while its state is not DELIVERED, RETURNED, LOST or VOIDED and a flag is stored: the advisory ends when the package ends, because no cleared event exists. The API carries the reason code and the instant only, the words belong to the storefront. It is not an address change (the ship-to stays as placed), not delivery instructions (nothing the shopper types reaches the driver) and not a notification; it changes no ETA window, no group, no promise field and no status (customer-ordering ADR 0015)"}
      - {name: ConsolidationKeyDerivation, rule: "PlaceOrder computes the key after resolveAddress through the ConsolidationKeyer port (an HMAC adapter) with the secret from the environment (at least 16 bytes); with no secret configured no key is computed, the event omits the field and the order never merges. Rotating the secret only stops merges between orders keyed under different secrets. The key is not in REST, MCP or A2A, and the placed event still carries no address field. A new normalisation rule is a new derivation version, never an edit of the old one (customer-ordering ADR 0012)"}
      - {name: ConsolidatedChoiceStored, rule: "the Tier enum accepts CONSOLIDATED (aggregate, constraint and OpenAPI); PlaceOrder copies tier, window and consolidationEligible from the made promise and derives chosenDeliveryDay with the time zone database in the use case (the domain only checks the SHAPE of a zone). GroupPromise on POST /checkout 201, GET /orders/{orderId} and GET /orders gains the two optional fields, omitted when unknown. A re-quote after an expired offer asks for the default tiers, so the 409 offer-not-quotable answer never offers CONSOLIDATED (an accepted limitation). Nothing here asks delivery-promise for the tier: it stays invisible until a caller opts in (customer-ordering ADR 0013)"}
      - {name: SharedTrackingNumbers, rule: "AttachTrackingNumbers and the assignment link only ADD a link row, never overwrite or remove one; tracking_packages.order_id and group_no keep meaning the first group that named the package. ApplyPackageDelivered, ApplyPackageLost and ApplyPackageReturned record the package fact once, then run MarkGroupDelivered, MarkGroupLost or MarkGroupReturned for EVERY group of GroupsOfTracking plus the group the event itself resolves, each in its own mutate inside the event's unit of work. A group that has not shipped yet is not in the set and is replayed by reconcile when its own FulfillmentShipped arrives. The tracking view of a follower order shows the shared package under the follower's group; the package's assignmentId stays the carrier's (customer-ordering ADR 0012)"}
      - {name: CancelOnUnfulfillable, rule: "when a group is unsourceable and no revised promise is feasible, cancel the group and the order if nothing remains"}
      - {name: CancelIsARequest, rule: "CancelOrder moves every unlocked group to a cancellation-requested state and publishes CustomerOrderCancelled for exactly those groups; locked, shipped and delivered groups are untouched. FulfillmentCancelled (ConfirmGroupCancelled) makes the group CANCELLED, and the order becomes CANCELLED when no group remains outside CANCELLED. FulfillmentCancelRefused (RefuseGroupCancellation) returns the group to LOCKED with the refusal reason, because the vendor ships and the shopper's path is then a return"}
    inbound:
      - {from: shopper / storefront, type: cmd, channel: "REST POST /checkout", routes: ["POST /checkout"], message: "PlaceOrder", relationship: OHS}
      - {from: shopper / storefront, type: cmd, channel: "REST POST /orders/{orderId}:cancel", routes: ["POST /orders/{orderId}:cancel"], message: "CancelOrder", relationship: OHS}
      - {from: shopper / storefront, type: cmd, channel: "REST POST /shoppers", routes: ["POST /shoppers"], message: "RegisterShopper", relationship: OHS}
      - {from: shopper / storefront, type: cmd, channel: "REST POST /shoppers/{shopperId}/addresses", routes: ["POST /shoppers/{shopperId}/addresses"], message: "AddShopperAddress", relationship: OHS}
      - {from: shopper / storefront, type: qry, channel: "REST GET /shoppers/{shopperId}, GET /shoppers?email=", routes: ["GET /shoppers/{shopperId}", "GET /shoppers?email="], message: "GetShopper, FindShopperByEmail", relationship: OHS}
      - {from: shopper / storefront, type: qry, channel: "REST GET /orders?shopperId=", routes: ["GET /orders?shopperId="], message: "ListOrders", relationship: OHS}
      - {from: shopper / storefront, type: qry, channel: "REST GET /orders/{orderId}, GET /orders/{orderId}/tracking", routes: ["GET /orders/{orderId}", "GET /orders/{orderId}/tracking"], message: "GetOrder, GetTracking", relationship: OHS}
      - {from: shipping-and-tracking, type: qry, channel: "REST GET /orders/{orderId}/ship-to (in-org, restricted)", routes: ["GET /orders/{orderId}/ship-to"], message: "GetShipTo", relationship: Customer/Supplier}
      - {from: order-sourcing, type: evt, channel: "Kafka retailnetwork.order-sourcing.events", message: "FulfillmentLocked, FulfillmentShipped, FulfillmentUnsourceable", relationship: Conformist}
      - {from: delivery-promise, type: evt, channel: "Kafka retailnetwork.delivery-promise.events", message: "PromiseAtRisk, PromiseRevised, PromiseKept, PromiseBroken", relationship: Customer/Supplier}
      - {from: shipping-and-tracking, type: evt, channel: "Kafka retailnetwork.shipping-and-tracking.events", message: "LabelIssued, PackageScanned, PackageDelivered, PackageExceptionRaised, PackageEtaWindowAssigned, PackageDeliveryPointFlagged", relationship: Conformist}
    rest:
      - "POST /checkout"
      - "GET /orders/{orderId}"
      - "GET /orders/{orderId}/tracking"
      - "POST /orders/{orderId}:cancel"
      - "GET /orders/{orderId}/ship-to"
      - "POST /shoppers"
      - "POST /shoppers/{shopperId}/addresses"
      - "GET /shoppers/{shopperId}"
      - "GET /shoppers?email="
      - "GET /orders?shopperId="
    publishes:
      - {event: CustomerOrderPlaced, entity: customerorder, data: [orderId, shopperId, destinationPostalPrefix, placedAt, consolidationKey (optional), groups(groupNo, promiseId, tier, witnessNodeId, shipBy, deliverByEarliest, deliverByLatest, chosenDeliveryDay (optional), consolidationEligible (optional), lines(lineNo, catalogItemId, quantity))], consumers: [order-sourcing, delivery-promise]}
      - {event: CustomerOrderCancelled, entity: customerorder, data: [orderId, reason, cancelledAt, groupNos], consumers: [order-sourcing, delivery-promise]}
    reasons: []   # no closed vocabulary: CustomerOrderCancelled.reason and the cancel-refused reason are free text
    consumes:
      - {event: FulfillmentLocked, from: order-sourcing}
      - {event: FulfillmentShipped, from: order-sourcing}
      - {event: FulfillmentUnsourceable, from: order-sourcing}
      - {event: PromiseAtRisk, from: delivery-promise}
      - {event: PromiseRevised, from: delivery-promise}
      - {event: PromiseKept, from: delivery-promise}
      - {event: PromiseBroken, from: delivery-promise}
      - {event: LabelIssued, from: shipping-and-tracking}
      - {event: PackageScanned, from: shipping-and-tracking}
      - {event: PackageDelivered, from: shipping-and-tracking}
      - {event: PackageExceptionRaised, from: shipping-and-tracking}
      - {event: PromiseUnkeepable, from: delivery-promise}
      - {event: FulfillmentCancelRefused, from: order-sourcing}
      - {event: FulfillmentCancelled, from: order-sourcing}
      - {event: LabelVoided, from: shipping-and-tracking}
      - {event: PackageLost, from: shipping-and-tracking}
      - {event: PackageReturned, from: shipping-and-tracking}
      - {event: PackageEtaWindowAssigned, from: shipping-and-tracking}
      - {event: PackageDeliveryPointFlagged, from: shipping-and-tracking}
    sync_calls:
      - {to: delivery-promise, type: qry, message: QuoteDeliveryOffers, channel: "REST POST /delivery-quotes"}
      - {to: delivery-promise, type: cmd, message: "MakePromise, ConfirmPromise, CancelPromise", channel: "REST POST /promises, POST /promises/{promiseId}/confirmations, POST /promises/{promiseId}/cancellations"}
    ul:
      - {term: Shopper, definition: "The (synthetic) customer placing orders.", code: "shopper.Shopper"}
      - {term: Customer Order, definition: "What the shopper bought, with a promise per shipment group.", code: "order.CustomerOrder"}
      - {term: Ship-To, definition: "The delivery address; synthetic PII held only here.", code: "order.ShipTo"}
      - {term: Consolidation Key, definition: "An opaque keyed hash of one shopper and one ship-to, derived here and carried on the placed order so order-sourcing can merge the groups of one stop without seeing the address; absent means the order never merges.", code: "order.ConsolidationKey"}
      - {term: Chosen Delivery Day, definition: "The local calendar date a shopper picked for a CONSOLIDATED group, stored on the group at placement.", code: "order.GroupPromise.ChosenDeliveryDay"}
      - {term: Day-of Delivery Window, definition: "The at-most-two-hours window consumed from shipping-and-tracking and stored on the tracking package row (a read-model fact, never an order fact). Shown on the tracking view only while the package is OUT_FOR_DELIVERY and the window was assigned at or after the last scan; never clipped to the promised window, and never touching the promise.", code: "readmodel.Package.EtaStart"}
      - {term: Delivery-Point Advisory, definition: "The reason-and-flaggedAt pair shown on the tracking view while the package has not ended and its delivery point is flagged (two counted failed attempts). A code for the storefront to word: not an address change, not delivery instructions, not a notification.", code: "readmodel.Package.PointFlagReason"}
      - {term: Checkout, definition: "The act of turning a cart into a customer order, promising every group.", code: "order.PlaceOrder"}

  # =========================================================================
  - id: order-sourcing
    name: Order Sourcing
    code: OS
    tier: commerce
    classification: Core
    chart: {differentiation: 0.85, complexity: 0.8, evolution: Custom-built}
    business_model: Cost reducer (cost-to-serve) and speed protector
    purpose: >-
      Decides, as late as the promise allows, which node and path will
      actually fulfil each shipment group. Keeps assignments in a virtual
      queue, re-optimises them against current capacity and cost until the
      release point, sends the group to the node, reassigns on rejection or
      expiry, and locks the assignment once the node commits.
    roles: [Execution (assignment), Analysis (optimisation), Enforcer (path lock)]
    business_decisions:
      - The assigned node may differ from the promise's witness node; the only hard constraint is that the assigned path still meets deliverByLatest.
      - An assignment is free to move while QUEUED; after release it moves only on rejection or expiry; after the node commits it is LOCKED for good.
      - A group goes to one node in full (fill-or-kill); a partial answer is not a thing.
      - If no node can still meet deliverByLatest, the group is UNSOURCEABLE and delivery-promise re-promises; sourcing never breaks a promise silently.
      - In-region nodes are preferred as a bounded trade, never as a filter: the effective cost of a candidate is its estimate plus the published cross-region surcharge, and an in-region candidate within the cheapest effective cost plus the policy's deviation percent beats a cross-region one. With no policy published the ordering is by cost and then the ordinal penalties, unchanged (order-sourcing ADR 0011, ADR 0014, gap G26).
      - Groups of one shopper and one address that chose a CONSOLIDATED delivery day may be merged at release into ONE carrier release with followers, when the published policy allows it; every member keeps its own events. Only CONSOLIDATED groups merge, a merge never moves the carrier's node, and a merge is an optimisation, never a blocker: a group that does not fit releases alone (order-sourcing ADR 0015).
      - A CONSOLIDATED group is searched inside the window the shopper's day allows and released at the latest pickup that still reaches that day, so it stays QUEUED, and reachable for a merge, as long as possible (order-sourcing ADR 0016).
    aggregates:
      - name: FulfillmentAssignment
        root_id: assignmentId
        description: "One shipment group of one customer order, its promise constraints, the current candidate node and path, and the history of releases. From release until the end of its life or until the merge is dissolved it may be a member of a consolidation merge: the carrier (the due assignment) or a follower absorbed into the carrier's release."
        states: [QUEUED, RELEASED, LOCKED, SHIPPED, DELIVERED, UNSOURCEABLE, CANCELLED]
        transitions:
          - [QUEUED, QUEUED, ReoptimiseAssignment]
          - [QUEUED, RELEASED, ReleaseToNode]
          - [RELEASED, QUEUED, HandleNodeRefusal]
          - [QUEUED, RELEASED, ReleaseConsolidated]
          - [QUEUED, RELEASED, ReleaseAsFollower]
          - [RELEASED, QUEUED, Requeue]
          - [RELEASED, LOCKED, LockAssignment]
          - [LOCKED, SHIPPED, MarkShipped]
          - [SHIPPED, DELIVERED, MarkDelivered]
          - [QUEUED, UNSOURCEABLE, ReleaseToNode]
          - [RELEASED, UNSOURCEABLE, HandleNodeRefusal]
          - [QUEUED, CANCELLED, CancelAssignment]
          - [RELEASED, CANCELLED, CancelAssignment]
          - [UNSOURCEABLE, CANCELLED, CancelAssignment]
          - [UNSOURCEABLE, QUEUED, ApplyRevisedPromise]
          - [LOCKED, LOCKED, RefuseCancel]
          - [SHIPPED, SHIPPED, RefuseCancel]
          - [DELIVERED, DELIVERED, RefuseCancel]
        value_objects:
          - "PromiseConstraint{promiseId, tier (SAME_DAY|NEXT_DAY|TWO_DAY|STANDARD|CONSOLIDATED), deliverByEarliest (optional, zero = unknown, never after deliverByLatest), deliverByLatest, witnessNodeId}: the tier carries a FulfilmentClass, and CONSOLIDATED maps to STANDARD so the tier on FulfillmentReleasedToNode never carries the fifth value (order-sourcing ADR 0015)"
          - "Candidate{nodeId, pickupDepartureId, legs[], deliveryWaveId, eta, cost, estimatedCostCents, effectiveCostCents (estimate plus the cross-region surcharge), policyVersion (the SourcingPolicy version the search read, stamped on the candidate and so on the release)}"
          - "ConsolidationLink{consolidationKey ('' or 64 lower-case hex, from CustomerOrderPlaced), consolidatedInto (a follower only: the carrier's id), members (a carrier only: follower ids ascending, non-empty exactly while it is the carrier of a merge)}: a follower is RELEASED, LOCKED, SHIPPED or DELIVERED and its candidate is a copy of the carrier's (order-sourcing ADR 0015)"
          - "Release{releaseNo, nodeId, releasedAt, requiredShipBy, outcome(ACCEPTED|REJECTED|EXPIRED|PENDING|WITHDRAWN), reasonCode}"
          - "ExcludedNode{nodeId, reason}"
          - "AssignmentLine{catalogItemId, listingId, quantity, ownerRef ('' = operator-owned)}: the owner chosen by OwnerChoice at the node actually released (order-sourcing ADR 0012)"
        invariants:
          - {rule: "a released candidate's eta <= deliverByLatest", error: ErrCandidateBreaksPromise}
          - {rule: "no change of node after LOCKED", error: ErrAssignmentLocked}
          - {rule: "a node that refused this group is never released to again for the same promise revision", error: ErrNodeExcluded}
          - {rule: "at most one release PENDING at a time", error: ErrReleaseInFlight}
          - {rule: "assignmentVersion strictly increases", error: ErrStaleAssignmentVersion}
          - {rule: "cancel only before LOCKED: a cancel request on a LOCKED, SHIPPED or DELIVERED assignment is refused, the assignment keeps its state and raises FulfillmentCancelRefused (reason CANCEL_AFTER_LOCK) instead of FulfillmentCancelled", error: ErrCancelAfterLock}
          - {rule: "a member of a live merge (carrier or follower, state RELEASED, not yet LOCKED) is not cancelled: the cancel is refused through RefuseCancel with reason CANCEL_WHILE_MERGED, the state does not change, nothing is withdrawn and the merge stays intact; the cancel can be retried after the carrier's lock (then CANCEL_AFTER_LOCK) or after the merge is dissolved (then the group is QUEUED again and cancels). A cancel of a QUEUED group or of an unmerged RELEASED group is unchanged", error: ErrCancelWhileMerged}
        commands: [QueueAssignment, ReoptimiseAssignment, ReleaseToNode, ReleaseConsolidated, ReleaseAsFollower, HandleNodeRefusal, LockAssignment, MarkShipped, MarkDelivered, CancelAssignment, RefuseCancel, ApplyRevisedPromise, Requeue]
        events: [FulfillmentQueued, FulfillmentReleasedToNode, FulfillmentReleaseWithdrawn, FulfillmentReassigned, FulfillmentLocked, FulfillmentShipped, FulfillmentDelivered, FulfillmentUnsourceable, FulfillmentCancelled, FulfillmentCancelRefused, FulfillmentSourcingDecided, AssignmentsConsolidated, AssignmentsDeconsolidated]
        notes: "Known residual (G12): an acceptance that reaches order-sourcing after it cancelled a RELEASED assignment is only recorded and logged (policy AcceptanceAfterCancelOnlyLogged); the vendor may still ship a cancelled group."
        throughput_estimate: "medium-high; re-optimisation sweeps touch QUEUED rows only"
        size_estimate: "one row per shipment group + releases"
      - name: SourcingPolicy
        root_id: "version (a single document: one current version, every publish creates version n+1, version 0 is the built-in default)"
        description: "The operator's versioned lever over the comparator and over consolidation, copied from delivery-promise's PromisePolicy. Read once per search through the repository and handed to the pure search as an input; the domain makes no call."
        states: [PUBLISHED]
        value_objects:
          - "SourcingPolicyFields{crossRegionSurchargeCents (0..100000, default 0), maxCostDeviationPercent (0..200, default 0), consolidationMaxAssignments (0..10, default 0; 0 and 1 both mean consolidation is off)}: all integers (order-sourcing ADR 0014, ADR 0015)"
        invariants:
          - {rule: "a publish creates version current + 1; a publish that loses a race for the same version is retried once, then refused 409 concurrent-update", error: ErrVersionNotNext}
          - {rule: "every field is inside its range; the body is the whole document, an omitted field is 0 and an empty body is 400", error: ErrValidation}
        commands: [PublishSourcingPolicy]
        events: [SourcingPolicyPublished]
        notes: "The split surcharge and the single-node-beats-split preference of the original contract are NOT built: order-sourcing never splits an order, because customer-ordering decides the shipment groups and each group is assigned on its own (order-sourcing ADR 0014)."
        throughput_estimate: "rare"
        size_estimate: "one row per published version"
    read_models:
      - {name: NodeProfileView, source: "node-topology NodeRegistered, NodeOperationalProfileDeclared, NodeActivated, NodeSuspended, NodeRetired"}
      - {name: NetworkGraphView, source: "node-topology LaneOpened, LaneClosed, ServiceAreaAssigned, RegionDefined; linehaul-transportation DepartureScheduled, DepartureCapacityChanged, DepartureCancelled; last-mile-delivery DeliveryWaveScheduled, DeliveryWaveCapacityChanged"}
      - {name: AvailabilityView, source: "offer-availability ListingCreated, ListingAvailabilityChanged, ListingSuppressed, ListingRestored, CatalogItemDiscontinued; keyed by (catalogItemId, nodeId, ownerRef), operator-owned stored as '' (absent ownerRef), a suppressed key covers nothing (order-sourcing ADR 0012)"}
      - {name: ScorecardView, source: "node-performance NodeScorecardUpdated"}
      - {name: PromiseBookPressureView, source: "delivery-promise PromiseBookExhausted"}
      - {name: SourcingAnalytics, source: "analytical read side (order-sourcing ADR 0013): cmd/os-projector, the only writer of a SEPARATE analytical database, projects this context's OWN topics only (retailnetwork.order-sourcing.events and .analytics: FulfillmentReleasedToNode, FulfillmentQueued, FulfillmentSourcingDecided, ...) in one consumer group, deduped in the projection transaction; cmd/os-reports serves the read-only /reports routes on :8092"}
    policies:
      - {name: VirtualQueue, rule: "releaseAt = pickup cutoff of the best candidate - node handling time - vendor ack budget; release immediately for SAME_DAY"}
      - {name: AssignmentCost, rule: "estimatedCostCents = lane costPerUnitCents over the path legs + the final wave costPerStopCents (planner-declared, consumed from LaneCostDeclared and WaveCostDeclared; a cost arriving before its lane or wave is known is kept); an undeclared component contributes 0 and marks the estimate incomplete; the comparator leads with the effective cost (the estimate plus the SourcingPolicy cross-region surcharge, see RegionalBudget; lower wins) and the ordinal penalties (legs, crossRegionPenalty, scorecardPenalty, bookPressurePenalty) are tie-breakers, then the witness node; for a CONSOLIDATED group the later pickup (ConsolidatedHold) sits after the money keys and before the ordinal penalties; FulfillmentReleasedToNode carries estimatedCostCents only when the estimate is complete (ADR 0011, F7)"}
      - {name: OwnerChoice, rule: "a line is feasible at a node only when ONE owner covers its quantity (availableQty of that key; summing across owners is forbidden, a line never spans owners). The owner is: operator-owned ('') first if it covers the line; otherwise the covering seller owner with the highest availableQty; ties go to the lowest ownerRef in byte order; no covering owner means the node is not a candidate (NO_CANDIDATE path). Recomputed on every search; the owner at the released node is persisted on the line and published on FulfillmentReleasedToNode lines[].ownerRef. The same rule, verbatim, is applied by delivery-promise (order-sourcing ADR 0012, gap G47)"}
      - {name: SourcingDecisionFact, rule: "every release also appends the analytics-only FulfillmentSourcingDecided (one per assignment and releaseNo: node and destination regions, inRegion, legs, estimated cost and its completeness, units, candidate count), read only by this context's own analytics projector (order-sourcing ADR 0013)"}
      - {name: RegionalBudget, rule: "ADR 0014 (gap G26): effectiveCostCents = estimatedCostCents + crossRegionSurchargeCents for a candidate whose node region differs from the delivery area region (both known; an unknown region counts as in-region), also when the estimate is incomplete. Let cheapest be the minimum effective cost among the candidates and budget = cheapest + floor(cheapest x maxCostDeviationPercent / 100). Among candidates within the budget an IN-REGION candidate beats a cross-region one; then effective cents, then the legacy ordinal tie-break and the id tie-breaks; candidates over the budget follow by effective cents. The budget rule is active only when maxCostDeviationPercent is above 0: with 0 and a surcharge of 0 the ordering is byte-identical to the one before the policy (a table test over the search fixtures proves it). The policy version read is stamped on the candidate and so on the release; FulfillmentReleasedToNode, FulfillmentSourcingDecided and the REST candidate view carry optional policyVersion (only when a version of 1 or more was in force) and optional effectiveCostCents (only when the surcharge changed the cost). Metrics: gauge ordersourcing_sourcing_policy_version and counter ordersourcing_budget_preferred_total with kind region, incremented once per release when the budget changed the winner (order-sourcing ADR 0014)"}
      - {name: SourcingPolicyPublication, rule: "GET /sourcing-policy returns the current version, or the defaults with version 0 when nothing was published; PUT /sourcing-policy validates the ranges (422 validation-failed), publishes version n + 1 and returns it. Because every call publishes a new version the route sits behind the Idempotency-Key middleware like a POST. The body is the WHOLE document, so a PUT that omits consolidationMaxAssignments switches consolidation off again. SourcingPolicyPublished is analytics-only, raised in the same transaction as the save; the projector ignores it. No MCP change (order-sourcing ADR 0014, ADR 0015)"}
      - {name: ConsolidatedHold, rule: "ADR 0016: for a CONSOLIDATED promise every search (QueueAssignment, ReoptimiseAssignment, ReleaseToNode, the refusal re-search, the revision and the dissolution) is built in one place and sets NotBefore to the promise's deliverByEarliest and HoldLatestPickup true. The searcher skips every delivery wave that ends before NotBefore (a wave ending exactly at it is allowed) and takes the earliest of the rest; an unknown window start is no bound, so a group queued before consolidation is searched as it was; no wave inside the window means UNSOURCEABLE. The comparator puts, after the budget tier and the effective cost and BEFORE the legacy tie-break score, the option with the LATER pickup cutoff, so among equal money the group is released at the latest pickup that still reaches the chosen wave and the VirtualQueue holds it until then (releaseAt follows the pickup cutoff; no new timer, state or table). Money and the budget tier still come first. A group released at the latest pickup has no slack: after a refusal the re-search may find no later wave inside the window and the group goes UNSOURCEABLE where an eager release would still have had time"}
      - {name: ConsolidationAtRelease, rule: "ADR 0015: nothing is merged before release. ReleaseToNode runs in one unit of work: when the policy has consolidationMaxAssignments of 2 or more and the due carrier has a key and is CONSOLIDATED it reads QueuedByKey (ordered by deliverByLatest then id, at most twice the cap), loads the union world once and runs the pure sourcing.Merge, which adds candidates greedily in deliverByLatest then id order if they satisfy c1 identity (not the carrier, QUEUED, same non-empty key and destination postal prefix, both tiers CONSOLIDATED), c2 node (the merge never moves the carrier), c3 overlap (the merged eta lies inside the max of the earliests and the min of the latests of the trial member set, with NotBefore as the latest window start and HoldLatestPickup set), c4 stock (lines are grouped by catalogue item, quantities summed and OwnerChoice must pick one covering owner for each sum; each member line takes that listing and owner; owners may differ between items) and c5 caps. With at least one follower the carrier calls ReleaseConsolidated and each follower ReleaseAsFollower, each saved with the optimistic version check so two concurrent releases are safe (the loser re-runs once and finds the follower already RELEASED); otherwise the carrier calls Release as before. FulfillmentReleasedToNode then carries members (carrier first, then ascending id), per-line assignmentId, the union lines in member order, tier = the fulfilment class and promisedDeliverByLatest = the minimum; the analytics projection counts the cost of a merged package once, on the carrier. Switching the policy off later does not affect live merges, only future releases"}
      - {name: MergedFanOut, rule: "ADR 0015: the id the vendor side knows is the carrier's. LockAssignment, MarkShipped, MarkDelivered and the pickup move apply the same command to every follower in the same transaction, and each member raises its OWN FulfillmentLocked (a follower with consolidatedInto, every member with mergedAssignmentIds), FulfillmentShipped and FulfillmentDelivered, so delivery-promise, customer-ordering and customer payments keep working per group; a repeat on a locked member is a no-op. The vendor API is unchanged: a purchase order already has lines"}
      - {name: ConsolidationDissolution, rule: "ADR 0015: there is no member-cancelled reason (a cancel of a merged member is refused). VENDOR REFUSAL OR EXPIRY of the carrier's release: the carrier takes the existing RefuseRelease and each follower RefuseRelease with its own pending release number, all exclude the node and are re-searched independently (they may re-merge at their next release); AssignmentsDeconsolidated is raised with reason PURCHASE_ORDER_REJECTED or PURCHASE_ORDER_EXPIRED and no withdraw event, because the vendor side already holds the terminal state. PROMISE REVISION of a RELEASED member: applied as today, and when the new window excludes the merged eta (after the new latest, or before the new earliest when known) the merge dissolves with reason PROMISE_REVISED: FulfillmentReleaseWithdrawn is raised (vendor-connectivity cancels the issued purchase order), every member's pending release gets outcome WITHDRAWN, every member returns to QUEUED with consolidatedInto and members cleared and is re-searched with NO node exclusion (FulfillmentReassigned with reason CONSOLIDATION_WITHDRAWN only if its node changed), then AssignmentsDeconsolidated. A due member is released again by the next sweep, alone or re-merged with whatever is QUEUED then, so there is no loop. AFTER THE LOCK nothing dissolves. KNOWN RESIDUAL: between order-sourcing dissolving and vendor-connectivity cancelling, the vendor may acknowledge the purchase order; Lock then returns ErrReleaseNotPending, which is acknowledged and counted (ordersourcing_stale_accept_total), and the vendor holds an accepted order for the old union while the survivors also get a new one. The window is one Kafka hop and exists today for a plain cancel after release. A shopper cannot cancel a merged group between the merge and the vendor's acknowledgement (order-sourcing ADR 0015)"}
      - {name: ReassignOnRefusal, rule: "on PurchaseOrderRejected or PurchaseOrderExpired, exclude the node and re-queue; if no candidate meets deliverByLatest, UNSOURCEABLE"}
      - {name: LockOnCommit, rule: "on PurchaseOrderAccepted the assignment is LOCKED (the vendor-node equivalent of the item being picked)"}
      - {name: CancelDecision, rule: "CustomerOrderCancelled is a request, and order-sourcing decides per group. From QUEUED, UNSOURCEABLE or an unmerged RELEASED assignment it cancels (CancelAssignment) and publishes FulfillmentCancelled. From a RELEASED member of a live merge (carrier or follower, before the lock) it publishes FulfillmentCancelRefused with reason CANCEL_WHILE_MERGED, changes no state and withdraws nothing (counter ordersourcing_merged_cancel_refused_total). From LOCKED, SHIPPED or DELIVERED it publishes FulfillmentCancelRefused with reason CANCEL_AFTER_LOCK and changes no state; the lock is the vendor's acceptance of the purchase order, so after a refusal the vendor ships and the shopper's refusal becomes a return. A repeated request on a CANCELLED assignment is a no-op. customer-ordering consumes both events and vendor-connectivity consumes FulfillmentCancelled"}
      - {name: AcceptanceAfterCancelOnlyLogged, rule: "KNOWN RESIDUAL, OPEN: a PurchaseOrderAccepted that arrives for a CANCELLED assignment (the cancel hit a RELEASED assignment while the vendor was acknowledging its purchase order) is recorded and logged and nothing else. No event or compensation undoes the vendor's acceptance, so the vendor may still ship a cancelled group"}
    inbound:
      - {from: customer-ordering, type: evt, channel: "Kafka retailnetwork.customer-ordering.events", message: "CustomerOrderPlaced, CustomerOrderCancelled", relationship: Customer/Supplier}
      - {from: delivery-promise, type: evt, channel: "Kafka retailnetwork.delivery-promise.events", message: "PromiseRevised, PromiseBookExhausted", relationship: Customer/Supplier}
      - {from: vendor-connectivity, type: evt, channel: "Kafka retailnetwork.vendor-connectivity.events", message: "PurchaseOrderAccepted, PurchaseOrderRejected, PurchaseOrderExpired, VendorShipmentConfirmed", relationship: Customer/Supplier}
      - {from: shipping-and-tracking, type: evt, channel: "Kafka retailnetwork.shipping-and-tracking.events", message: "PackageDelivered", relationship: Conformist}
      - {from: node-topology, type: evt, channel: "Kafka retailnetwork.node-topology.events", message: "NodeRegistered, NodeOperationalProfileDeclared, NodeActivated, NodeSuspended, NodeRetired, LaneOpened, LaneClosed, ServiceAreaAssigned, RegionDefined", relationship: Conformist}
      - {from: offer-availability, type: evt, channel: "Kafka retailnetwork.offer-availability.events", message: "ListingCreated, ListingAvailabilityChanged, ListingSuppressed, ListingRestored, CatalogItemDiscontinued", relationship: Conformist}
      - {from: linehaul-transportation, type: evt, channel: "Kafka retailnetwork.linehaul-transportation.events", message: "DepartureScheduled, DepartureCapacityChanged, DepartureCancelled", relationship: Conformist}
      - {from: last-mile-delivery, type: evt, channel: "Kafka retailnetwork.last-mile-delivery.events", message: "DeliveryWaveScheduled, DeliveryWaveCapacityChanged", relationship: Conformist}
      - {from: node-performance, type: evt, channel: "Kafka retailnetwork.node-performance.events", message: "NodeScorecardUpdated", relationship: Conformist}
      - {from: network-ops planner, type: qry, channel: "REST GET /assignments, GET /assignments/{assignmentId}", routes: ["GET /assignments", "GET /assignments/{assignmentId}"], message: "ListAssignments, GetAssignment", relationship: UI}
      # caller inferred: ADR 0013 names the report questions, not a client; the routes are served by cmd/os-reports on :8092, not cmd/api
      - {from: network analysts (human), type: qry, channel: "REST GET /reports/sourcing-mix, GET /reports/order-splits, GET /reports/cost-to-serve, GET /reports/freshness (cmd/os-reports, :8092)", routes: ["GET /reports/sourcing-mix", "GET /reports/order-splits", "GET /reports/cost-to-serve", "GET /reports/freshness"], message: "GetSourcingMixReport, GetOrderSplitsReport, GetCostToServeReport, GetReportFreshness", relationship: UI}
      # caller inferred: ADR 0014 names an operator publishing a policy, not a client; the planner is the actor of the sibling reoptimise route
      - {from: network-ops planner, type: cmd, channel: "REST PUT /sourcing-policy", routes: ["PUT /sourcing-policy"], message: "PublishSourcingPolicy", relationship: UI}
      # caller inferred: the spec names no caller for the read; attributed to the same operator
      - {from: network-ops planner, type: qry, channel: "REST GET /sourcing-policy", routes: ["GET /sourcing-policy"], message: "GetSourcingPolicy", relationship: UI}
      - {from: network-ops planner, type: cmd, channel: "REST POST /assignments/{assignmentId}:reoptimise", routes: ["POST /assignments/{assignmentId}:reoptimise"], message: "ReoptimiseAssignment", relationship: UI}
    rest:
      - "GET /assignments?state=&nodeId=&orderId="
      - "GET /assignments/{assignmentId}"
      - "POST /assignments/{assignmentId}:reoptimise"
      - "GET /sourcing-policy"
      - "PUT /sourcing-policy"
      - "GET /reports/sourcing-mix?from=&to="
      - "GET /reports/order-splits?from=&to="
      - "GET /reports/cost-to-serve?from=&to="
      - "GET /reports/freshness"
    publishes:
      - {event: FulfillmentQueued, entity: assignment, data: [assignmentId, orderId, groupNo, promiseId, deliverByLatest, lines], consumers: [analytics only]}
      - {event: FulfillmentReleasedToNode, entity: assignment, data: [assignmentId, releaseNo, orderId, groupNo, nodeId, pickupDepartureId, requiredShipBy, promisedDeliverByLatest, tier, lines(catalogItemId, listingId, quantity, ownerRef (optional, omitted when operator-owned)), estimatedCostCents (optional, omitted when the estimate is incomplete), policyVersion (optional), effectiveCostCents (optional), members(assignmentId, orderId, groupNo, promiseId) (optional, merged release only)], consumers: [vendor-connectivity, linehaul-transportation, seller-inbound]}
      - {event: FulfillmentReleaseWithdrawn, entity: assignment, data: [assignmentId, releaseNo, orderId, groupNo, reason, withdrawnAt], consumers: [vendor-connectivity]}
      - {event: FulfillmentReassigned, entity: assignment, data: [assignmentId, fromNodeId, toNodeId, reason, assignmentVersion], consumers: [linehaul-transportation]}
      - {event: FulfillmentLocked, entity: assignment, data: [assignmentId, orderId, groupNo, nodeId, pickupDepartureId, lockedAt, lockReason, promiseId, consolidatedInto (optional), mergedAssignmentIds (optional)], consumers: [delivery-promise, customer-ordering, linehaul-transportation]}
      - {event: FulfillmentShipped, entity: assignment, data: [assignmentId, orderId, groupNo, nodeId, trackingNumbers, shippedAt], consumers: [customer-ordering, delivery-promise]}
      - {event: FulfillmentDelivered, entity: assignment, data: [assignmentId, orderId, groupNo, deliveredAt], consumers: [analytics only]}
      - {event: FulfillmentUnsourceable, entity: assignment, data: [assignmentId, orderId, groupNo, promiseId, excludedNodes, reason], consumers: [delivery-promise, customer-ordering]}
      - {event: FulfillmentCancelled, entity: assignment, data: [assignmentId, orderId, groupNo, reason], consumers: [vendor-connectivity, linehaul-transportation, customer-ordering, seller-inbound]}
      - {event: FulfillmentCancelRefused, entity: assignment, data: [assignmentId, orderId, groupNo, reason], consumers: [customer-ordering]}
      - {event: FulfillmentConstraintRevised, entity: assignment, data: [assignmentId, revisionNo, deliverByLatest], consumers: [analytics only]}
      - {event: FulfillmentSourcingDecided, entity: assignment, data: [assignmentId, orderId, groupNo (optional), releaseNo, nodeId, nodeRegionId (optional), destinationRegionId (optional), inRegion (optional), legs, estimatedCostCents (optional), costComplete, units, candidateCount, decidedAt, policyVersion (optional), effectiveCostCents (optional), carrierAssignmentId (optional), consolidatedCount (optional)], consumers: [analytics only]}
      - {event: SourcingPolicyPublished, entity: policy, data: [version, crossRegionSurchargeCents, maxCostDeviationPercent, consolidationMaxAssignments (optional), publishedAt], consumers: [analytics only]}
      - {event: AssignmentsConsolidated, entity: assignment, data: [carrierAssignmentId, releaseNo, nodeId, memberCount, units, members(assignmentId, orderId, groupNo, promiseId, units), consolidatedAt], consumers: [analytics only]}
      - {event: AssignmentsDeconsolidated, entity: assignment, data: [carrierAssignmentId, releaseNo, reason, triggerAssignmentId (optional), memberAssignmentIds, deconsolidatedAt], consumers: [analytics only]}
    reasons:
      - name: FulfillmentReassignedReason
        fields: [FulfillmentReassigned.reason]
        about: "Why the candidate node of an assignment changed (ADR 0004; the model had left the vocabulary open)."
        values:
          - {value: REOPTIMISED, meaning: "Re-optimisation of a QUEUED assignment found a different best candidate."}
          - {value: RELEASE_RECHECK, meaning: "The re-check against fresh read models at release time chose a different node."}
          - {value: PURCHASE_ORDER_REJECTED, meaning: "The node rejected the purchase order; the next candidate takes over."}
          - {value: PURCHASE_ORDER_EXPIRED, meaning: "The node did not acknowledge the purchase order in time; the next candidate takes over."}
          - {value: PROMISE_REVISED, meaning: "A revised promise (PromiseRevised) changed the constraint and a QUEUED assignment moved to a new candidate."}
          - {value: CONSOLIDATION_WITHDRAWN, meaning: "A consolidation merge was dissolved by a promise revision and the member, back in the queue, was re-searched and now has a different node (order-sourcing ADR 0015)."}
      - name: FulfillmentLockReason
        fields: [FulfillmentLocked.lockReason, "rest:Assignment.lockReason"]
        about: "Why an assignment locked its path."
        values:
          - {value: PURCHASE_ORDER_ACCEPTED, meaning: "The node accepted the purchase order; vendor acceptance is the path lock (docs ADR 0005)."}
      - name: FulfillmentUnsourceableReason
        fields: [FulfillmentUnsourceable.reason]
        about: "Why an assignment became UNSOURCEABLE."
        values:
          - {value: NO_CANDIDATE, meaning: "The candidate set is empty under the promise constraint and the node exclusions."}
          - {value: NODE_REFUSED, meaning: "The last candidate refused (rejected or expired) and no other candidate is left."}
      - name: ExcludedNodeReason
        fields: [FulfillmentUnsourceable.excludedNodes, "rest:ExcludedNode.reason"]
        about: "Why a node is excluded from an assignment. A rejection is written REJECTED followed by a colon and the vendor's reason code when there is one."
        values:
          - {value: REJECTED, meaning: "The node rejected the purchase order; the text continues with the vendor's reasonCode (see the vendor-connectivity RejectReason vocabulary)."}
          - {value: EXPIRED, meaning: "The node did not acknowledge the purchase order before its deadline."}
      - name: FulfillmentCancelRefusedReason
        fields: [FulfillmentCancelRefused.reason]
        about: "Why a cancel request was refused."
        values:
          - {value: CANCEL_AFTER_LOCK, meaning: "The cancel request arrived after the assignment locked; the vendor ships and the shopper's path is a return."}
          - {value: CANCEL_WHILE_MERGED, meaning: "The assignment is a member of a live consolidation merge that has not locked yet; the merge stays intact and the cancel can be retried after the carrier's lock or after the merge is dissolved (order-sourcing ADR 0015)."}
      - name: FulfillmentReleaseWithdrawnReason
        fields: [FulfillmentReleaseWithdrawn.reason]
        about: "Why order-sourcing took a published release back. A member cancel never withdraws (it is refused), so there is one value."
        values:
          - {value: PROMISE_REVISED, meaning: "A promise revision moved the delivery window of a member so that the merged eta no longer fits; the merge is dissolved and the issued purchase order is cancelled by vendor-connectivity, which carries the value as opaque text and does not branch on it."}
      - name: AssignmentsDeconsolidatedReason
        fields: [AssignmentsDeconsolidated.reason]
        about: "Why a consolidation merge was dissolved."
        values:
          - {value: PROMISE_REVISED, meaning: "A promise revision of a RELEASED member excluded the merged eta; the release is withdrawn first (FulfillmentReleaseWithdrawn)."}
          - {value: PURCHASE_ORDER_REJECTED, meaning: "The vendor rejected the carrier's purchase order; every member is re-searched on its own with the node excluded, and no withdraw is raised because the vendor holds the terminal state."}
          - {value: PURCHASE_ORDER_EXPIRED, meaning: "The vendor did not acknowledge the carrier's purchase order in time; every member is re-searched on its own with the node excluded, and no withdraw is raised."}
      - name: ReleaseOutcome
        fields: ["rest:ReleaseOutcome", "rest:Release.outcome"]
        about: "What the node answered to a release, or WITHDRAWN when order-sourcing took the release back."
        values:
          - {value: PENDING, meaning: "Released and not yet answered."}
          - {value: ACCEPTED, meaning: "The node accepted; the assignment locks."}
          - {value: REJECTED, meaning: "The node rejected; Release.reasonCode holds the vendor's code."}
          - {value: EXPIRED, meaning: "The node did not answer before its deadline."}
          - {value: WITHDRAWN, meaning: "Order-sourcing took the release back because the consolidation merge it belonged to was dissolved (order-sourcing ADR 0015); it is not an answer from the node."}
    consumes:
      - {event: CustomerOrderPlaced, from: customer-ordering}
      - {event: CustomerOrderCancelled, from: customer-ordering}
      - {event: PromiseRevised, from: delivery-promise}
      - {event: PromiseBookExhausted, from: delivery-promise}
