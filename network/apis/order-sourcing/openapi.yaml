openapi: 3.0.3
info:
  title: Order Sourcing API (proposed)
  version: 0.1.0-proposed
  description: >-
    Proposed contract derived from model/model.yaml
    (contexts[order-sourcing].rest). Nothing is built yet. Order Sourcing
    decides which vendor node and path fulfil each shipment group: it keeps a
    FulfillmentAssignment per group in a virtual queue, re-optimises it until
    its release point, releases it to one node (a purchase order through
    vendor-connectivity), reassigns on rejection or expiry, and locks it when
    the node accepts. This surface is the network-ops planner's: list and
    inspect assignments, and ask for an immediate re-optimisation of a QUEUED
    one. Every other change arrives as a Kafka event (see the context's
    Domain Events page). No PII is held or returned by this context. Errors
    are RFC 9457 problem details; the problem type is the slug named on the
    Use Cases page (for example assignment-locked). No authentication,
    consistent with the rest of the network.
servers:
  - url: http://localhost:8000/api/retail-network/order-sourcing
tags:
  - name: Assignments
    description: FulfillmentAssignment, one per shipment group of a customer order.
paths:
  /assignments:
    get:
      tags: [Assignments]
      operationId: listAssignments
      summary: List fulfillment assignments
      description: >-
        ListAssignments. Filters combine with AND. nodeId matches the current
        candidate node (QUEUED) or the node released to (RELEASED and later).
      parameters:
        - name: state
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AssignmentState'
        - name: nodeId
          in: query
          required: false
          schema:
            type: string
        - name: orderId
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: The matching assignments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentList'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /assignments/{assignmentId}:
    get:
      tags: [Assignments]
      operationId: getAssignment
      summary: Get one fulfillment assignment
      description: GetAssignment, with its release history and excluded nodes.
      parameters:
        - $ref: '#/components/parameters/AssignmentId'
      responses:
        '200':
          description: The assignment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignment'
        '404':
          $ref: '#/components/responses/NotFound'
  /assignments/{assignmentId}:reoptimise:
    post:
      tags: [Assignments]
      operationId: reoptimiseAssignment
      summary: Re-optimise a queued assignment now
      description: >-
        ReoptimiseAssignment. Re-runs the candidate search (AssignmentCost:
        legs + crossRegionPenalty + scorecardPenalty + bookPressurePenalty,
        ties to the witness node) over the current read models, skipping
        excluded nodes and any candidate whose eta is after deliverByLatest.
        Allowed only while QUEUED. If the best node changes, the assignment
        moves (FulfillmentReassigned is published) and releaseAt follows the
        new candidate (VirtualQueue).
      parameters:
        - $ref: '#/components/parameters/AssignmentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReoptimiseRequest'
      responses:
        '200':
          description: The assignment after re-optimisation (unchanged if the best candidate is the current one).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignment'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            assignment-locked (ErrAssignmentLocked), release-in-flight
            (ErrReleaseInFlight), node-excluded (ErrNodeExcluded) or
            stale-assignment-version (ErrStaleAssignmentVersion).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                locked:
                  value:
                    type: assignment-locked
                    title: Assignment is locked
                    status: 409
                    detail: The node accepted the purchase order; the assignment can no longer move.
                inFlight:
                  value:
                    type: release-in-flight
                    title: A release is pending
                    status: 409
                    detail: The group is released to a node and awaits its acknowledgement.
        '422':
          description: candidate-breaks-promise (ErrCandidateBreaksPromise), or an invalid request body.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  parameters:
    AssignmentId:
      name: assignmentId
      in: path
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: A repeated key returns the stored response of the first call.
      schema:
        type: string
        minLength: 1
        maxLength: 128
  responses:
    NotFound:
      description: assignment-not-found (the model names no Err identifier for it).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unprocessable:
      description: Invalid query parameter.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          description: Problem type slug, for example assignment-locked.
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
    AssignmentState:
      type: string
      enum: [QUEUED, RELEASED, LOCKED, SHIPPED, DELIVERED, UNSOURCEABLE, CANCELLED]
    Tier:
      type: string
      enum: [SAME_DAY, NEXT_DAY, TWO_DAY, STANDARD]
    ReleaseOutcome:
      type: string
      enum: [ACCEPTED, REJECTED, EXPIRED, PENDING]
    PromiseConstraint:
      type: object
      required: [promiseId, tier, deliverByLatest, witnessNodeId]
      properties:
        promiseId:
          type: string
        tier:
          $ref: '#/components/schemas/Tier'
        deliverByLatest:
          type: string
          format: date-time
        witnessNodeId:
          type: string
          description: The node of the promise's witness path; the assigned node may differ.
    Candidate:
      type: object
      required: [nodeId, pickupDepartureId, legs, deliveryWaveId, eta, cost]
      properties:
        nodeId:
          type: string
        pickupDepartureId:
          type: string
        legs:
          type: array
          description: Departure ids after the pickup.
          items:
            type: string
        deliveryWaveId:
          type: string
        eta:
          type: string
          format: date-time
        cost:
          type: number
    Release:
      type: object
      required: [releaseNo, nodeId, releasedAt, requiredShipBy, outcome]
      properties:
        releaseNo:
          type: integer
          minimum: 1
        nodeId:
          type: string
        releasedAt:
          type: string
          format: date-time
        requiredShipBy:
          type: string
          format: date-time
        outcome:
          $ref: '#/components/schemas/ReleaseOutcome'
        reasonCode:
          type: string
          nullable: true
    ExcludedNode:
      type: object
      required: [nodeId, reason]
      properties:
        nodeId:
          type: string
        reason:
          type: string
    Line:
      type: object
      required: [catalogItemId, quantity]
      properties:
        catalogItemId:
          type: string
        listingId:
          type: string
          nullable: true
          description: The listing of the released node; null while QUEUED.
        quantity:
          type: integer
          minimum: 1
    Assignment:
      type: object
      required: [assignmentId, orderId, groupNo, state, assignmentVersion, promise, lines, releases, excludedNodes]
      properties:
        assignmentId:
          type: string
        orderId:
          type: string
        groupNo:
          type: integer
          minimum: 1
        state:
          $ref: '#/components/schemas/AssignmentState'
        assignmentVersion:
          type: integer
          minimum: 1
        promise:
          $ref: '#/components/schemas/PromiseConstraint'
        lines:
          type: array
          items:
            $ref: '#/components/schemas/Line'
        candidate:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Candidate'
          description: The current best candidate; null when none meets deliverByLatest.
        releaseAt:
          type: string
          format: date-time
          nullable: true
          description: VirtualQueue release point (best candidate's pickup cutoff - node handling time - vendor ack budget).
        releases:
          type: array
          items:
            $ref: '#/components/schemas/Release'
        excludedNodes:
          type: array
          items:
            $ref: '#/components/schemas/ExcludedNode'
        lockedAt:
          type: string
          format: date-time
          nullable: true
        lockReason:
          type: string
          nullable: true
        trackingNumbers:
          type: array
          items:
            type: string
        shippedAt:
          type: string
          format: date-time
          nullable: true
        deliveredAt:
          type: string
          format: date-time
          nullable: true
    AssignmentList:
      type: object
      required: [assignments]
      properties:
        assignments:
          type: array
          items:
            $ref: '#/components/schemas/Assignment'
    ReoptimiseRequest:
      type: object
      properties:
        assignmentVersion:
          type: integer
          minimum: 1
          description: Optional. The version the caller last read; a mismatch is 409 stale-assignment-version.
