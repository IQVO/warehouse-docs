name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ============================================================
  # CLASSIFICATION: STATIC VALIDATION (build-only, every PR)
  # This repo builds and deploys straight off `main` on every push (no
  # develop/main split, unlike the fleet's GitFlow service repos) -- see
  # AGENTS.md. Before this job existed, a broken build only surfaced
  # AFTER merging to main (the `build` job below, which runs on push to
  # main and then deploys), i.e. a broken site could go live with nothing
  # blocking the PR that caused it. This job runs the exact same build
  # (minus the Pages upload/deploy) on every PR targeting main so a
  # broken build is caught BEFORE merge, not after.
  # ============================================================
  build-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm --prefix tools/asyncapi-gen ci --no-audit --no-fund
      # tsc over docusaurus.config.ts, sidebars.ts (incl. every generated
      # api-reference sidebar it imports) and src/. TypeScript 7 removed
      # `baseUrl` (TS5102); tsconfig.json overrides it with `null` + `paths`.
      - run: npm run typecheck
      # The alert catalogue page is generated from alerting/ (a copy of
      # warehouse-infra's rules): fail when someone edits one without the other.
      - run: npm run gen-alert-catalogue -- --check
      # Four Business Capability Architecture pages are generated from
      # scripts/capability-map/capabilities.py: fail when a page and the model
      # disagree (stdlib-only Python, preinstalled on the runner).
      - run: python3 scripts/capability-map/generate.py --check
      # The A2A agent index page is generated from docs/architecture/a2a-agents.json
      # (the registry of live Agent Cards): fail when the page and the registry disagree.
      # The live-card drift check needs a cluster and runs from e2e-tests.
      - run: python3 scripts/a2a-cards.py --check-page
      - run: pip install pyyaml
      - name: Network model consistency (network/model/model.yaml vs network/docs/)
        run: npm run check:model:network
      - name: Network generated strategic pages match the model
        run: npm run check:pages:network
      - name: Storefront model consistency (storefront/model/model.yaml vs storefront/docs/ + cross-model rules vs network/model/model.yaml)
        run: npm run check:model:storefront
      - name: Storefront generated strategic pages match the model
        run: npm run check:pages:storefront
      - name: Spectral lint of the storefront OpenAPI contracts (warn-clean, as the service repos)
        run: |
          npm install -g @stoplight/spectral-cli
          for f in storefront/apis/*/openapi.yaml; do
            spectral lint "$f" --ruleset storefront/.spectral.yaml --fail-severity=warn
          done
      - run: npm run build

  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm --prefix tools/asyncapi-gen ci --no-audit --no-fund
      - run: npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: build

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        id: deployment
